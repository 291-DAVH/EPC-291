# LECTURA RÁPIDA

## Las frases de todos los días

Son las del ciclo normal de trabajo por paquetes (un paquete = un documento o un grupo pequeño de documentos que van de la mano).

| Frase | Tipo | Para qué | Qué pasa después |
|---|---|---|---|
| \`desarrollar paquete\` (o \`siguiente paquete\`) | Comando | Claude desarrolla **un** paquete y le entrega su hoja de revisión | Claude se detiene. Estado \`FOR_REVIEW\`: es su turno |
| \`guiar revisión\` | Comando | Revisar juntos, un documento por vez, en el chat | Claude completa la hoja con sus respuestas. Estado \`INTERNAL_REVIEW\` |
| \`procesar comentarios de revisión\` | Comando | Hay comentarios: Claude los resuelve | Cada comentario suma 1 a la revisión (\`00.0\` → \`00.0.1\`); nueva hoja del mismo paquete, solo con lo cambiado. Estado \`FOR_REVIEW\` |
| \`revisión aprobada\` | Decisión | El paquete está bien (OK del paquete, no del proyecto) | El paquete queda \`REVIEWED\`; Claude propone el siguiente |
| \`estado del proyecto\` | Comando | Saber cómo vamos (informe del auditor) | Sin cambio de estado |
| \`registrar cambio\` | Comando | Algo cambió (cliente, obra, comentario) y debe quedar registrado | Se abre una \`RFC-nnn\` con evidencia e impacto. Sin cambio de estado |
| \`registrar incidencia\` | Comando | Algo frena o amenaza el trabajo (bloqueo, pendiente, información que falta, no conformidad) | Una fila en \`ISSUE_LOG.md\` con responsable y fecha. Sin cambio de estado |
| \`tablero\` | Comando | Ver en una página cómo vamos | Claude genera \`Reports/DASHBOARD.md\`. Sin cambio de estado |

Una vez por proyecto o por entrega: \`iniciar proyecto\`, \`auditar\`, \`aprobar auditoría\`, \`entregar IFA\` (o \`IFC\`, al terminar la Ejecutiva) y \`entrega enviada TR-nnn\`. No lo recuerde: escriba \`ayuda\`.

## Flujo típico

En una línea:

\`\`\`text
(usted completa STARTING_DATA y deposita la documentación) → iniciar proyecto → (usted responde las preguntas del charter) → aprobar charter → desarrollar paquete → (usted revisa) → revisión aprobada | procesar comentarios de revisión → siguiente paquete → … → auditar → aprobar auditoría → entregar IFA → entrega enviada TR-001 → (el cliente revisa) → comentarios del cliente recibidos → confirmar clasificación → … → auditar → aprobar auditoría → entregar IFA → … → cliente aprueba → (fase siguiente) … → entregar IFC
\`\`\`

En diagrama:

\`\`\`text
 iniciar proyecto ──► aprobar charter ──► desarrollar paquete ──► [FOR_REVIEW]
                                                                              ▲                    │
                                                                              │            USTED REVISA (hoja o guiar revisión)
                                                                              │                    │
                                                                      siguiente paquete   ┌────────┼──────────────┐
                                                                              ▲           ▼        ▼              ▼
                                                                              │    revisión     procesar        rehacer
                                                                              │    aprobada     comentarios
                                                                              └── (REVIEWED)    └─ revisión +1, nueva hoja

 Con todos los paquetes de la fase REVIEWED (la revisión interna por paquete es el IFR):
   auditar ► aprobar auditoría ► AUDITED ► entregar IFA ► entrega enviada TR-nnn ► IFA (esperando al cliente)
   ► comentarios del cliente recibidos ► confirmar clasificación ► (lo afectado vuelve a IFR) ► auditar ► aprobar auditoría ► nuevo IFA
   ► cliente aprueba ► fase siguiente (IC → IB → ID → IE) ► … ► entregar IFC (al terminar IE)
\`\`\`

# GUÍA DEL ARCHIVO (no editar)

## Objetivo

Que el usuario encuentre en segundos qué decirle a Claude en cada momento del proyecto, sin recordar de memoria una lista, y que Claude tenga una única descripción completa de cada frase y una única regla para interpretarlas.

## Alcance

Define el **estándar de frases** del framework y cubre todas las frases de \`CLAUDE.md\` (8.2) y las que mencionan \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`, \`REVIEW_SHEET.md\`, \`LESSONS_LEARNED.md\`, \`CHANGE_REQUESTS.md\`, \`SCHEDULE_CCPM.md\`, \`PROJECT_AUDIT.md\`, \`DESIGN_RULES.md\`, \`DELIVERABLES.md\` y \`DRAWING_STATUS.md\`. No define reglas nuevas de ingeniería: remite a los archivos donde vive cada regla.

## Forma de utilización

- **Regla de fuente única:** este archivo es la descripción completa de las frases. \`CLAUDE.md\` (8.2) conserva solo la tabla compacta. Si hay una diferencia, se corrige en ambos en el mismo momento; una contradicción es un hallazgo de auditoría documental.
- Al abrir una sesión Claude recuerda en una línea que puede escribir \`ayuda\` o \`comandos\` (\`CLAUDE.md\`, 8).
- Una frase nueva se agrega aquí (tabla del catálogo y tabla «Punto de control») y en la tabla de \`CLAUDE.md\` (8.2).
- Las frases se escriben tal como figuran; los corchetes indican un argumento que usted reemplaza (\`[PQ-nn]\` es, por ejemplo, \`PQ-03\`).

## Buenas prácticas

- Escribir una frase por mensaje; Claude informa el estado en que deja el proyecto al terminar cada una.
- Ante la duda, \`ayuda\`: no cambia nada.
- Usar \`estado del proyecto\` al retomar el trabajo después de varios días.
- Registrar los cambios con \`registrar cambio\` en el momento en que llegan, no al final.

# ESTÁNDAR DE FRASES

## Reglas

1. **Dos tipos de frase.** Un **comando** inicia trabajo de Claude (desarrollar, auditar, verificar, entregar). Una **decisión** es la respuesta del usuario en un punto de control (aprobar, corregir, rehacer, elegir una opción). Las frases que cambian un estado crítico se marcan con ● en las tablas.
2. **Forma fija.** Minúsculas, un verbo en infinitivo o un sustantivo con participio (\`desarrollar paquete\`, \`revisión aprobada\`, \`entrega enviada\`). El argumento va entre corchetes y es obligatorio cuando la frase lo declara (\`aprobar RFC [RFC-nnn]\`); un argumento opcional solo se admite donde la tabla lo indica expresamente y su ausencia tiene un único significado (\`desarrollar paquete\` sin argumento = el siguiente del grafo de la LME). No hay argumentos opcionales ambiguos.
3. **Lenguaje natural aceptado, frase fija repetida.** Claude entiende lenguaje natural, pero antes de ejecutar una acción que cambie un estado, repite la **frase fija** que interpretó y el **cambio de estado** que producirá (por ejemplo: «Entiendo \`revisión aprobada\` del paquete PQ-02: los documentos pasan a \`REVIEWED\` y el proyecto queda en \`ENGINEERING\`. ¿Procedo?»). Las acciones que no cambian estado (consultar, informar) se ejecutan sin ese paso.
4. **Estados críticos.** Los cambios de estado críticos (● en las tablas) solo se ejecutan con la frase fija exacta o con la confirmación explícita de la frase que Claude repitió. Un «sí» a una frase que Claude no repitió no cuenta.
5. **Ambigüedad.** Si una frase puede interpretarse de más de una forma, Claude **pregunta** y no asume. Nunca elige por usted entre dos frases con efectos distintos.
6. **Códigos de las hojas de revisión.** \`OK\`, \`CON COMENTARIOS\`, \`RECHAZAR\`, \`ACEPTO\`, \`CAMBIO: …\`, \`RECHAZO\`, \`DIFERIR\`, \`NO SÉ / PENDIENTE\`, \`ACEPTO PENDIENTE\` y \`ACEPTO TODOS LOS BAJOS\` son respuestas escritas **dentro de la hoja** (\`REVIEW_SHEET.md\`); no son frases del chat. Las frases del chat son las de este archivo.
7. **Sinónimos.** Las variantes aceptadas figuran entre paréntesis en la frase (por ejemplo, \`registrar cambio\` acepta \`registrar RFC\`); Claude responde siempre con la frase fija.

## Frases de cierre de revisión y su efecto

Coherente con \`REVIEW_SHEET.md\`. Las frases se escriben en el chat.

| Frase | Qué significa | Efecto en el paquete | Estado del proyecto |
|---|---|---|---|
| (devolver la hoja con su primera respuesta) · \`empezar revisión\` · \`guiar revisión\` | Empieza a revisar el paquete | Sus documentos pasan a \`INTERNAL_REVIEW\` | \`INTERNAL_REVIEW\` |
| \`revisión aprobada\` | **OK del paquete** (no del proyecto): todos los documentos \`OK\` | Sus documentos pasan a \`REVIEWED\` | \`ENGINEERING\` (para el paquete siguiente), o \`PLANNING\` si no queda nada por desarrollar |
| \`procesar comentarios de revisión\` | Hay comentarios en el paquete | Claude los incorpora (cada uno suma 1 a la revisión) y entrega una nueva hoja del mismo paquete, solo con lo cambiado; documentos en \`FOR_REVIEW\` | \`FOR_REVIEW\` |
| \`rehacer\` | Rechaza el paquete (o lo rechazado en él) | Solo ese paquete vuelve a desarrollo | \`ENGINEERING\` |
| \`siguiente paquete\` | Pide el paquete que sigue (el anterior debe estar \`REVIEWED\`) | Claude desarrolla el paquete pedido y lo entrega con su hoja | \`ENGINEERING\` mientras trabaja; \`FOR_REVIEW\` al entregar |
| \`auditar\` (equivale a \`auditar proyecto\`) | Pide la auditoría de la entrega | Sus documentos pasan a \`FOR_AUDIT\` (con todos los paquetes \`REVIEWED\` y ninguno \`REABIERTO\`) | \`FOR_AUDIT\` |

Veredictos de cada documento en la hoja: \`OK\` (sin comentarios), \`CON COMENTARIOS\` (se incorpora, sube la revisión y vuelve en una hoja nueva) y \`RECHAZAR\` (se rehace ese paquete). Un documento sin veredicto no se da por revisado y el paquete no se puede aprobar.

Respuestas de la parte B de la hoja (códigos de la hoja, no frases del chat): \`ACEPTO\` · \`CAMBIO: …\` · \`RECHAZO\` · \`DIFERIR\` (solo para solicitudes de cambio) · un dato · \`NO SÉ / PENDIENTE\` (queda una \`INF-nnn\` abierta y Claude propone esperar, autorizar un supuesto o bloquear) · \`ACEPTO PENDIENTE\` (solo para marcas \`[DEFINIR]\` o \`[VERIFICAR]\`) · \`ACEPTO TODOS LOS BAJOS\` (parte C; solo filas de riesgo \`Bajo\` de la hoja de este paquete, nunca \`Medio\` ni \`Alto\`).

En la **última hoja de la entrega** la parte C pregunta «¿Auditar la entrega?» (\`SÍ\` / \`NO, sigo con otro paquete\`). \`SÍ\` junto con \`revisión aprobada\` cuenta como confirmación de \`auditar\`.

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Establecer cómo se redacta, nombra, versiona, revisa y entrega cada tipo de documento, para que toda la documentación del proyecto sea **uniforme, sin redundancias, sin contradicciones y auditable**.

## 2. Alcance

Aplica a todo documento de texto, listado, cálculo, procedimiento, protocolo e informe del proyecto. Los planos y modelos CAD se rigen además por \`CAD_STANDARDS.md\`. Si el cliente impone reglas documentales, prevalecen y se registran en \`CLIENT_REQUIREMENTS.md\` (sección *Requisitos documentales*) con la correspondencia hacia esta norma.

## 3. Forma de utilización

1. Antes de redactar, identificar el **tipo de documento** (sección 6) y aplicar sus reglas específicas.
2. Asignar código según la sección 8 y registrarlo en \`DELIVERABLES.md\`, con su paquete de revisión (\`PQ-nn\`) y los paquetes de los que depende.
3. Redactar con la estructura estándar y el formato Markdown compatible con Pandoc (sección 7 y 7.1, RG-20).
4. Pasar el **checklist de cierre documental** (sección 12) antes de solicitar revisión.
5. Ningún documento se entrega sin auditoría aprobada (\`PROJECT_AUDIT.md\`).

## 4. Estructura recomendada de este archivo

Reglas generales → reglas por tipo de documento → estructura estándar y formato Markdown/Pandoc → nomenclatura → revisiones y estados → control de cambios → redacción contractual → checklist de cierre.

## 6. Reglas por tipo de documento

### 6.1 Memoria descriptiva

| Debe | No debe |
|---|---|
| Describir la instalación, sistema o solución: qué es, cómo está compuesto, cómo funciona, cómo se opera. | Repetir especificaciones técnicas ni requisitos de compra. |
| Rentregar a especificaciones, planos y cálculos por código. | Contener valores de cálculo detallados ni criterios de ensayo. |
| Mantener tono descriptivo (presente indicativo). | Usar lenguaje obligacional ("deberá"). |

### 6.2 Especificación técnica

| Debe | No debe |
|---|---|
| Definir requisitos de diseño, fabricación, ensayo y suministro. | Describir el funcionamiento general de la instalación (eso es memoria descriptiva). |
| Definir obligaciones con lenguaje contractual. | Contener alternativas ambiguas ("o similar") sin criterio de equivalencia. |
| Citar normas con serie y edición. | Repetir el alcance contractual. |
| Incluir criterios de aceptación verificables y documentación a entregar. | Mezclar procedimientos de montaje con requisitos del producto. |

### 6.3 Alcance de trabajos

| Debe | No debe |
|---|---|
| Indicar **qué se ejecuta**, qué se suministra y qué queda excluido. | Detallar procedimientos completos de ejecución. |
| Definir interfaces con terceros y límites de suministro. | Repetir responsabilidades ni especificaciones. |
| Referenciar documentos aplicables por código. | Contener cantidades sin respaldo en cómputos o listados. |

### 6.4 Responsabilidades

| Debe | No debe |
|---|---|
| Definir **obligaciones** de cada parte (quién hace, aprueba, provee, verifica). | Repetir el alcance. |
| Usar matriz de responsabilidades (RACI o equivalente) cuando corresponda. | Dejar actividades sin responsable ni dejar dos responsables de la misma actividad. |

### 6.5 Capacitación

| Debe | No debe |
|---|---|
| Centrarse en **transferencia de conocimiento**: audiencia, objetivos de aprendizaje, contenidos, duración, material, evaluación y registro. | Repetir procedimientos o pruebas de commissioning. |
| Rentregar a los manuales y a la documentación as-built. | Sustituir el manual de operación y mantenimiento. |

### 6.6 As-Built

| Debe | No debe |
|---|---|
| **Referenciar la documentación final actualizada**, conforme a obra, con código y revisión. | Reproducir contenido de documentos ya entregados. |
| Incluir el registro de modificaciones respecto de IFC y su causa. | Entregarse sin la evidencia de las modificaciones (marcas de obra, actas, consultas técnicas). |
| Demostrar que cada plano y listado fue actualizado o confirmado sin cambios. | Mantener planos "como diseño" bajo la etiqueta as-built. |
| Registrar, para cada equipo o dato sustituido o modificado en obra: lo instalado, el motivo y el acta de cambio (\`RFC-nnn\` o acta del cliente). | Reemplazar el dato de diseño sin dejar rastro de la sustitución. |

### 6.7 Memoria de cálculo

| Debe | No debe |
|---|---|
| Declarar objetivo, datos de entrada (con fuente), criterios (IDs \`ENG-\`), método, resultados y conclusiones verificables. | Contener resultados sin trazabilidad a los datos de entrada. |
| Mostrar fórmulas, hipótesis y verificación de límites. | Ocultar supuestos: cada uno se enlaza a \`SUP-nnn\`. |
| Indicar el software, versión y archivo de entrada si se usa. | Incluir conclusiones sin comparación con el criterio. |

### 6.8 Procedimiento / método de trabajo

Debe indicar propósito, alcance, responsables, recursos, pasos secuenciales, controles, seguridad, registros generados y criterios de aceptación. No debe repetir especificaciones.

### 6.9 Protocolo / registro de ensayo

Debe contener identificación del equipo, procedimiento y criterio de aceptación referenciados, instrumentos con calibración, valores medidos, resultado (aprueba / no aprueba) y firmas. No debe tener campos "a completar" posteriores a su entrega sin control.

### 6.10 Listados y matrices

Cada fila lleva identificador único, referencia a plano o documento fuente, y revisión. El listado se genera o valida desde la fuente de datos, no se mantiene en paralelo a mano.

### 6.11 Informes (de auditoría, de inspección, de estado)

Deben separar hechos, evidencias, conclusiones y recomendaciones. Cada hallazgo lleva ID, severidad, evidencia y acción requerida.

### 6.12 Documentos de otras disciplinas

Los documentos de cualquier disciplina (memoria de cálculo hidráulico, balance térmico, cálculo de cargas térmicas, cálculo estructural, P&ID, análisis de riesgo de incendio, matriz causa–efecto, etc.) siguen las reglas de su **tipo base** (6.1 a 6.11) y la estructura estándar de la sección 7. Un documento que cruza disciplinas referencia, no duplica, los datos de la disciplina de origen.

La guía completa, la matriz de preparación por capítulo y el autocontrol están en \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`. La estructura estándar de la sección 7 se aplica al conjunto: \`00_Index_and_Control.md\` es la portada con el control de revisiones y los capítulos son el desarrollo; los pendientes de cada capítulo se reúnen en una sección final en el consolidado.

### 6.14 Síntesis de cálculo (\`SM\`)

| Debe | No debe |

### 7.1 Formato Markdown compatible con Pandoc (RG-20)

El usuario pasa los \`.md\` a Word con Pandoc; la plantilla Word aplica los estilos y la numeración de títulos. El Markdown solo declara **estructura**, nunca numeración. Reglas:

- **Títulos:** solo \`#\`, \`##\`, \`###\`… con el texto del título y nada más. Sin números, letras ni prefijos: \`# Alcance\`, nunca \`# 1. Alcance\`, \`## 2.1 Criterios\`, \`## A. Datos\`, \`# IV. Resultados\` ni \`# 05 — Requisitos\`. Un solo \`#\` por archivo (el título del documento o, en un pliego, del capítulo); los demás niveles bajan de uno en uno (de \`##\` a \`###\`, nunca a \`####\`).
- **Viñetas:** siempre con \`-\` (nunca \`*\` ni \`+\`), con una línea en blanco antes de la lista y sangría de 2 espacios para las sublistas. Con negrita: \`- **Término:** descripción\` (evita \`* **NEGRITA**\`).
- **Listas numeradas:** solo cuando el orden es parte del contenido (pasos de un procedimiento, secuencias), escritas siempre \`1.\` (Pandoc las numera) y nunca para numerar secciones.
- **Referencias cruzadas por nombre, no por número:** «ver el capítulo Marco Normativo», «ver la tabla Resumen de cargas»; nunca «ver sección 3.2», porque Word renumera. A otro documento se lo cita por su **código** (RG-11). Una cita a un archivo del framework («\`DOCUMENT_RULES.md\`, sección 9») es válida.
- **Tablas:** de tubería con fila de encabezado y separador, sin celdas combinadas, con el título en una línea previa («Tabla: Resumen de cargas») para que Word le aplique el estilo de título de tabla.
- **Bloques:** una línea en blanco entre bloques (párrafo, lista, tabla, código, título). Sin HTML embebido y sin tabuladores. El código va en bloques cercados con lenguaje (\`\`\`\` \`\`\`python \`\`\`\`). Las imágenes se escriben \`![texto alternativo](ruta)\`. Las ecuaciones, en LaTeX (\`$…$\` en línea, \`$$…$$\` en bloque), nunca como imagen.
- **Metadatos de portada** en un bloque YAML al inicio del archivo, con estos seis campos y en este orden (valores entre comillas dobles):

\`\`\`yaml
---
title: "<Título del documento>"

## 8. Nomenclatura de documentos

### 8.1 Definiciones: código, identificador completo y nombre de archivo

\`\`\`text
código               = [PRY]-[DISC]-[TIPO]-[NNN]          (sin revisión; no cambia nunca)
identificador completo = <código>_Rev<R>
nombre de archivo      = <identificador completo>.<ext>
\`\`\`

| Elemento | Descripción |
|---|---|
| \`PRY\` | Código de proyecto de 3 a 6 caracteres alfanuméricos, declarado en \`STARTING_DATA.md\`. Puede diferir del nombre de la carpeta raíz del proyecto (\`FOLDER_TEMPLATES.md\`, 4.3). |
| \`DISC\` | Disciplina de una o dos letras: A, C, E, F, H, I, M, P, PL (sanitaria), S, T (igual que \`CAD_STANDARDS.md\`, sección 5); \`G\` para documentos generales de gestión |
| \`TIPO\` | Código de tipo (tabla 8.2) |
| \`NNN\` | Número correlativo de tres dígitos por \`DISC\`+\`TIPO\`, sin reutilización. En los planos \`PL\` el primer número puede ser la base del rango de su contenido (\`CAD_STANDARDS.md\`, sección 9) y continuar correlativo dentro del rango; los saltos entre rangos no reutilizan números. |
| \`R\` | Revisión (sección 9) |

| Término | Definición | Ejemplo |
|---|---|---|
| Código | Identifica al documento sin su revisión | \`ACM01-E-MC-003\` |
| Identificador completo | Código + \`_Rev<R>\` | \`ACM01-E-MC-003_Rev00.2.0.ID\` |
| Nombre de archivo | Identificador completo + extensión | \`ACM01-E-MC-003_Rev00.2.0.ID.md\` |
| Insumos de dibujo de un plano | \`<código-del-plano>_DIN_Rev<R>.md\`; hereda el código del plano (sin fila propia en la LME), tiene su propia revisión (\`00.0\`, \`00.0.c\`, \`00.n\`) y se revisa como documento | \`ACM01-E-PL-410_DIN_Rev00.0.md\` |
| Anexo de un documento (script, datos de entrada o salida) | \`<código>_Rev<R>_ANX-<n>_<descr>.<ext>\`; \`n\` correlativo por documento y \`descr\` breve sin espacios ni tildes | \`ACM01-E-MC-003_Rev00.2.0.ID_ANX-1_calculo.py\` |

Un anexo no tiene código propio, se lista en el documento, se archiva con él y **se renombra con la revisión del documento cada vez que este cambia de revisión**, aunque su contenido no cambie (el control de revisiones anota «anexo sin cambios»), de modo que cada revisión conserve su conjunto completo.

Ejemplo: \`ACM01-E-MC-003_Rev00.2.0.ID\` → proyecto ACM01, disciplina Electricidad, memoria de cálculo n.º 3, revisión interna 00.2.0, originada por la \`RFC-002\`, en la fase Ingeniería de Detalle (\`ID\`) (el cliente la recibe rotulada como \`ACM01-E-MC-003_Rev00\`).

### 8.2 Códigos de tipo

| Código | Tipo | Código | Tipo |
|---|---|---|---|
| \`MD\` | Memoria descriptiva | \`PL\` | Plano |
| \`MC\` | Memoria de cálculo | \`DG\` | Diagrama / esquema |
| \`ET\` | Especificación técnica | \`LC\` | Lista de cables |
| \`AL\` | Alcance de trabajos | \`LE\` | Lista de equipos |
| \`CR\` | Criterios de diseño | \`LM\` | Lista de materiales / cómputo |
| \`HD\` | Hoja de datos | \`LI\` | Lista de instrumentos / señales |
| \`PR\` | Procedimiento | \`PT\` | Protocolo de ensayo |
| \`IN\` | Informe | \`MN\` | Manual |
| \`PC\` | Plan (de calidad, de capacitación, etc.) | \`RG\` | Registro / acta |
| \`TR\` | Transmittal | \`CT\` | Carta / comunicación |
| \`PG\` | Pliego técnico (modular, por capítulos; ver RG-18) | \`SM\` | Síntesis de cálculo (ver 6.14) |

La síntesis de cálculo (\`SM\`) es un tipo propio, distinto de la memoria de cálculo (\`MC\`): resume para lectura rápida los resultados, las hipótesis y las conclusiones de **una** memoria \`MC\` y siempre se desarrolla y se revisa en el mismo paquete de revisión que su memoria (\`DELIVERABLES.md\`, 4.1). Su código es \`[PRY]-[DISC]-SM-[NNN]\` (por ejemplo \`ACM01-E-SM-001\`); la letra \`SM\` se verificó libre en la tabla de arriba y en \`CAD_STANDARDS.md\`.

El pliego técnico (\`PG\`) no figuraba con otro código equivalente (\`ET\` es la especificación técnica de un equipo o material y \`AL\` el alcance de trabajos, que en el pliego es un capítulo): se agrega como tipo propio. Su código es \`[PRY]-[DISC]-PG-[NNN]\` con \`DISC\` = \`G\` si es multidisciplina o la letra de su disciplina si es monodisciplina (ej.: \`ACM01-G-PG-001\`). El esquema unifilar y los demás diagramas son \`DG\`-nnn (no \`PL\`). Si el cliente impone otra codificación se aplica la del cliente y se registra la tabla de correspondencia en \`CLIENT_REQUIREMENTS.md\`. Si el proyecto necesita un tipo no listado o usa una sigla distinta (por ejemplo \`PR\` para protocolo en lugar de \`PT\`), la correspondencia se registra en una \`DEC\`; la tabla de este apartado se entiende ampliada con esa decisión. Los archivos de soporte de un documento (scripts de cálculo, datos de entrada y salida) no tienen código propio: se nombran como anexo (8.1), se listan en el documento, se archivan junto a él y se versionan con su revisión.

### 8.3 Nombre de archivo

\`<código>_Rev<R>.<ext>\` (identificador completo + extensión, ver 8.1) — sin espacios, sin tildes ni caracteres especiales, sin términos como "final", "nuevo" o "copia". La revisión se escribe completa, con el sufijo de fase: \`Rev00.0.0.IB\`, \`Rev00.0.1.IB\`, \`Rev00.1.0.ID\`, \`Rev00.1.2.IE\`; y \`Rev00\` (solo en \`06_DELIVERABLES\`) y \`Rev01\`… sin sufijo El prefijo \`_Rev\` aparece una sola vez en el nombre. No hay sufijos de borrador: cada revisión superada se archiva en \`ARCHIVE\` con su propio nombre (\`<código>_Rev00.0.1.IB.md\`).

**Capítulos de pliego.** Cada capítulo de un pliego se nombra \`<NN>_<Name>.md\` (\`NN\` = número de dos dígitos desde \`01\`; \`Nombre\` en \`Mayusculas_Iniciales_Con_Guion_Bajo\`, sin tildes) dentro de \`02_ENGINEERING/TECHNICAL_SPECS\`, p. ej. \`04_General_Execution_Conditions.md\`. **No repite el código ni la revisión en el nombre:** estos van en el encabezado de cada capítulo y en \`00_Index_and_Control.md\`. El identificador completo del pliego (\`<código>_Rev<R>\`) nombra solo al documento consolidado que se entrega (\`TECHNICAL_SPECIFICATIONS_GUIDE.md\`, 4.6).

## 9. Revisiones y estados documentales

Antes de las reglas, la idea general: la revisión de un documento tiene que contestar dos preguntas sin abrir el archivo. Cuántos comentarios llevó incorporados, y cuántos cambios de fondo (RFC) tuvo. Por eso la revisión interna tiene tres números, \`00.R.C\`.

**Estado documental = ubicación.** Los archivos de un paquete se editan solo en \`02_ENGINEERING\` (\`DRAFT\` / \`REABIERTO\`); en \`03_REVIEW/REVIEW_PACKAGES\` están \`FOR_REVIEW\`, en \`04_AUDIT/AUDIT_PACKAGES\` \`FOR_AUDIT\`, en \`05_RELEASED\` \`AUDITED\`; \`06_DELIVERABLES\` guarda la copia rotulada \`Rev 00\` (\`Rev 01\` en el as-built). Un archivo congelado en 04, 05 o 06 no se modifica: si hay que cambiarlo, vuelve a \`02_ENGINEERING\` con \`RETURN_TO_ENGINEERING.py\` y el ciclo se reinicia (\`M6\`, 11.2). Los archivos de un plano viajan como DWG + XREF + PDF.

Principio: **nosotros comenzamos siempre en \`Rev 00.0.0\` (línea base interna); cada comentario incorporado suma 1 al último dígito (\`00.0.1\`, \`00.0.2\`…); cada RFC fija el dígito intermedio con su número (\`00.1.0\`); el sufijo de fase indica en qué nivel de ingeniería está el documento (\`.IC\`, \`.IB\`, \`.ID\`, \`.IE\`); el cliente siempre ve \`Rev 00\`; la obra queda en \`Rev 01\` (as-built) y todo cambio posterior sube el proyecto completo a \`Rev 02\`, \`03\`…** La numeración \`00.R.C.FF\` es interna.

**Forma de la revisión interna: \`00.R.C.FF\`.** \`R\` es el número de la última RFC, \`C\` cuenta los comentarios incorporados y \`FF\` es la fase: \`IC\` Ingeniería Conceptual, \`IB\` Ingeniería Base, \`ID\` Ingeniería de Detalle, \`IE\` Ingeniería Ejecutiva. Ejemplo: \`Rev 00.2.34.IB\` es un documento de Ingeniería Base con la última RFC n.º 2 y 34 comentarios incorporados. Al **pasar a la fase siguiente cambia solo el sufijo** (\`00.2.34.IB\` → \`00.2.34.ID\`), sin sumar números, porque no es un comentario ni una RFC. El as-built no lleva sufijo: ya se entiende al pasar a \`Rev 01\`. En los textos de este framework, para abreviar, se escriben los ejemplos sin el sufijo (\`00.0.1\`) o sin el último cero (\`00.1\`); **en los archivos reales la revisión se escribe siempre completa.**

| Revisión | Uso |
|---|---|
| \`00.0.0.FF\` | **Línea base interna.** Todo documento nace en \`Rev 00.0.0\` con el sufijo de la fase en que se desarrolla por primera vez (por ejemplo \`00.0.0.IB\`). |
| \`00.0.c\` (c ≥ 1) | **Comentarios incorporados**: cada comentario \`REV-nnn\` que el documento incorpora (de la revisión interna del usuario o de su superior, del cliente o de la auditoría) suma 1 al último dígito. Si el cliente dice que falta un circuito, el documento pasa a \`00.0.1\`; si después el jefe pide agregar un diferencial, a \`00.0.2\`. Es el dígito que más cambia: deja la trazabilidad de comentarios |
| \`00.n\` (n ≥ 1) | **Revisión interna originada por la \`RFC-00n\`**: \`RFC-001\` genera \`00.1\`, \`RFC-002\` genera \`00.2\`, \`RFC-n\` genera \`00.n\`. El último dígito vuelve a cero. Es numeración **interna**: el cliente nunca la ve |
| \`00.n.c\` | Comentarios incorporados después de la RFC (por ejemplo \`00.1.1\`, \`00.1.2\`) |
| \`00\` | **Revisión que ve el cliente** en toda emisión al cliente (IFA o IFC): portada, nombre de archivo en \`06_DELIVERABLES\` y transmittal. El cliente siempre recibe \`Rev 00\`, cualquiera sea la revisión interna que se envíe |
| \`01\` | **As-built (conforme a obra).** Al completarse la documentación as-built, **todo el proyecto** pasa a \`Rev 01\`: la obra queda exclusivamente en \`Rev 01\` |
| \`02\`, \`03\`, \`04\`… | Toda modificación **posterior** al as-built: el proyecto completo pasa a la revisión siguiente. El número es secuencial del proyecto (no está ligado al número de la RFC); el control de revisiones cita la RFC que lo originó |

Los estados documentales describen en qué punto del recorrido está un documento. La tabla siguiente reúne los estados y las emisiones.

| Estado documental | Significado |
|---|---|
| \`DRAFT\` | En redacción |
| \`FOR_REVIEW\` | **PARA REVISAR:** generado por Claude como parte del paquete que espera al usuario (un solo paquete por vez), pendiente de su revisión |
| \`INTERNAL_REVIEW\` | En revisión del usuario / equipo (comentarios \`REV-nnn\`) |
| \`REVIEWED\` | **REVISADO:** el usuario dio el OK a su paquete (\`revisión aprobada\`); pendiente de auditoría y de entrega. Desde aquí todo cambio nace de un comentario \`REV-nnn\` y es una RFC o una corrección documental |
| \`FOR_AUDIT\` | Presentado a auditoría |
| \`AUDITED\` | Auditoría aprobada: **aprobado internamente** |
| \`IFR\` | *Emitido para revisión* (emisión **interna**): un documento está en IFR desde que su paquete se entrega a revisión hasta \`AUDITED\`, y vuelve a IFR cada vez que un comentario del cliente o una RFC lo modifica. No se envía al cliente |
| \`IFA\` / \`IFC\` | Emitido al cliente para aprobación / liberado para construcción (el estado se registra recién cuando el usuario confirma el envío, \`entrega enviada TR-nnn\`) |
| \`AS_BUILT\` | Conforme a obra |
| \`SUPERSEDED\` | Reemplazado por una revisión posterior (se conserva en archivo histórico) |
| \`VOID\` | Anulado (con motivo) |

Estados de planificación (solo para la LME y \`PROJECT_STATUS.md\`, no son estados de un documento entregado): \`PLANNED\` (previsto, no iniciado) y \`BLOCKED\` (no puede desarrollarse; se cita el \`BLQ-nnn\`). **Planos y diagramas dibujados por el usuario:** su estado de dibujo (\`PLANNED\`, \`CAD_INPUT\`, \`DRAWN\`, \`REVIEWED\`, \`ENTREGADO\`) vive **solo** en \`DRAWING_STATUS.md\` (fuente única, RG-06); la LME y \`PROJECT_STATUS.md\` lo referencian y no lo repiten. En la LME, la fila de un plano muestra el estado de su documento de **insumos** (que es un documento revisable, sin fila propia), y el estado del dibujo se lee de \`DRAWING_STATUS.md\`.

**Regla de revisiones.**

1. **Todo documento nace en \`Rev 00.0.0.FF\`** (línea base interna), con el sufijo de la fase en que se desarrolla por primera vez.
2. **Comentarios (\`REV-nnn\`).** Cada comentario que el documento incorpora suma 1 al último dígito de su revisión, sin importar el origen: revisión interna del paquete (\`procesar comentarios de revisión\`), cliente (\`comentarios del cliente recibidos\`) o auditoría. Si en una pasada se incorporan *k* comentarios, la revisión sube *k* unidades (\`00.0\` → \`00.0.k\`) y la fila del control cita los *k* \`REV-nnn\`. Un comentario que no modifica el documento (rechazado, diferido o ya cumplido) no suma. Claude archiva la revisión superada en \`02_ENGINEERING/ARCHIVE/<código>/\` con su nombre (\`<código>_Rev00.0.1.<ext>\`, estado \`SUPERSEDED\`; los anexos se archivan con él) y el archivo de trabajo pasa a llamarse con la nueva revisión. **Ya no existen borradores con la revisión fija:** toda versión nueva es una revisión.
3. **Comentario: ¿corrección documental o RFC?** Si el comentario corrige un error documental, una omisión, una inconsistencia, un problema de representación o información ya definida pero mal reflejada, es una **corrección documental**: suma 1 al último dígito. Si modifica la línea base, el alcance, los requisitos del cliente, los parámetros maestros, la filosofía de operación, los criterios de diseño, las potencias, el equipamiento aprobado o una decisión registrada, se tramita como **RFC** (\`CHANGE_REQUESTS.md\`) y, con la RFC \`APPROVED\`, **cada documento afectado pasa a \`Rev 00.n\`, con \`n\` = número de la RFC** y el último dígito en cero (\`RFC-001\` → \`00.1\`, \`RFC-002\` → \`00.2\`).
   - Una RFC puede afectar solo a algunos documentos, de modo que un documento puede saltar de \`00.0\` a \`00.2\`, o de \`00.0.3\` a \`00.2\`: es correcto. El control de revisiones de cada documento cita la RFC que originó cada revisión.
   - Los documentos que usan un dato modificado por la RFC (cambio aguas arriba) pasan también a \`Rev 00.n\` con la misma RFC. Los que solo citan al documento modificado no cambian de revisión.
   - Si una RFC es \`REJECTED\` o \`DEFERRED\`, no genera revisión: ese \`n\` queda sin usar en los documentos que habría afectado.
   - Si dos RFC afectan al mismo documento, se aplican en el orden de \`n\`.
   - Un cambio que cumple los criterios de RFC se tramita **siempre** como RFC, aunque el documento todavía no esté \`REVIEWED\`: fija el dígito intermedio (\`00.n\`) igual que en un documento revisado.
4. **Avance de fase.** Cuando un documento evoluciona de una fase a la siguiente (por ejemplo de Base a Detalle) **cambia solo el sufijo**: el unifilar \`00.0.2.IB\` pasa a \`00.0.2.ID\`. No suma números, porque no es un comentario ni una RFC. El documento conserva su código y su archivo; cada fase agrega definición y no elimina la anterior (\`CLAUDE.md\`, 4.3). La revisión superada (\`..._Rev00.0.2.IB\`) se archiva como cualquier otra. El siguiente comentario suma 1 normalmente (\`00.0.3.ID\`).
5. **Rótulo al cliente.** El cliente **siempre ve \`Rev 00\`**: portada, nombre de archivo en \`06_DELIVERABLES\` (\`<código>_Rev00.<ext>\`), carpeta de entrega (\`YYYYMMDD_TR-nnn_Rev00\`) y transmittal. El **transmittal registra la revisión interna entregada** (\`00.0.2\`, \`00.1\`…) de cada documento; lo que distingue dos entregas con el mismo rótulo es el \`TR-nnn\` y el control de revisiones del propio documento, que lista los comentarios y las RFC incorporados. Una reemisión después de comentarios del cliente sigue rotulada \`Rev 00\`, con otro \`TR-nnn\`.
6. **As-built (\`Rev 01\`).** Al completarse la documentación as-built, **todo el proyecto** pasa a \`Rev 01\`: los documentos afectados se actualizan y los no afectados se reentregan «sin cambios» con \`Rev 01\`. Mientras se elabora, la documentación as-built sigue el mismo mecanismo de comentarios con la forma \`01.c\`, hasta quedar \`REVIEWED\`.
7. **Después del as-built (\`Rev 02\`, \`03\`, \`04\`…).** Cualquier cambio posterior lleva el proyecto completo a la revisión siguiente (los no afectados se reentregan «sin cambios»). También se tramita por RFC; el número de revisión es secuencial del proyecto y la tabla de control cita la RFC.
8. Cuando un documento cambia de revisión, los documentos que lo citan **no** cambian de revisión por ese solo hecho (citan la «revisión vigente»); solo cambian los que usan un dato que cambió.

**Tabla de control de revisiones.** Cada documento lleva en la sección *Control de revisiones* una tabla con estas columnas, que el verificador comprueba:

Tabla: Control de revisiones

| Rev. | Fecha | Origen | Descripción | Elaboró | Revisó | Aprobó |
|---|---|---|---|---|---|---|

- *Rev.*: la revisión interna completa con su sufijo de fase (\`00.0.0.IB\`, \`00.0.1.IB\`, \`00.1.0.ID\`, \`00.2.34.IB\`…) o \`01\`… en el as-built.
- *Origen*: los \`REV-nnn\` incorporados, la \`RFC-nnn\` que originó la revisión, «Avance de fase» (solo cambia el sufijo) o el \`TR-nnn\` de una emisión. Una fila \`00.n\` sin la \`RFC-00n\` correspondiente, o una fila \`00.R.c\` (c ≥ 1) sin ningún \`REV-nnn\` (salvo que solo cambie el sufijo de fase), es un aviso del verificador.
- Cada emisión registra además una fila \`00\` con el \`TR-nnn\` y la revisión interna enviada. La copia de \`06_DELIVERABLES\` muestra al cliente solo las filas \`00\` (una por emisión, con los comentarios y RFC incorporados en la descripción); no se muestran al cliente las revisiones internas (\`00.0.1\`, \`00.1\`…).

Las versiones anteriores se archivan en \`02_ENGINEERING/ARCHIVE/<código>/\` (una subcarpeta plana por documento, con el **conjunto completo** de cada revisión: el documento y sus anexos, anexos \`.py\` y \`.txt\` incluidos). Al archivarse, el estado de la portada pasa a \`SUPERSEDED\` con una línea que cita la revisión que lo reemplaza; no se edita nada más. Las hojas de revisión superadas se archivan en \`02_ENGINEERING/ARCHIVE/REVIEW_SHEETS/\`. Los estados de proyecto y de documento se mantienen según la tabla 4.3 de \`PROJECT_STATUS.md\`. Si el cliente impone otro esquema, se aplica el del cliente hacia afuera y se registra la correspondencia en una \`DEC\` y en \`CLIENT_REQUIREMENTS.md\`.

Reglas: un documento generado por Claude queda en \`FOR_REVIEW\` hasta que el usuario revise su paquete; solo el usuario lo mueve de ese estado, y pasa a \`REVIEWED\` únicamente con el OK del usuario a **todo el paquete** (\`revisión aprobada\`; un paquete no queda a medias: si un documento tiene comentarios, el paquete sigue en revisión). Los documentos de un paquete comparten estado. Si un paquete \`REVIEWED\` cambia después (comentario posterior, pedido del cliente, hallazgo de auditoría) y un paquete dependiente \`REVIEWED\` usa el dato modificado, ese paquete vuelve a \`FOR_REVIEW\` mediante una hoja corta de impacto (\`REVIEW_SHEET.md\`, sección 7); si solo cita al documento modificado, no cambia de estado ni de revisión. El paso a \`FOR_AUDIT\` exige que **todos** los paquetes de la emisión objetivo estén \`REVIEWED\` (\`CLAUDE.md\`, sección 11). Un documento solo puede estar \`IFA\` o \`IFC\` si estuvo \`AUDITED\` en esa revisión y el usuario confirmó el envío. Solo la última revisión vigente figura como activa; las anteriores pasan a \`SUPERSEDED\`.

## 10. Control de cambios y duplicados

1. Todo cambio genera una nueva revisión (un comentario incorporado suma 1 al último dígito; una RFC aprobada fija el dígito intermedio) con descripción **específica** ("se corrigió la sección de cable X de 3×120 mm² a 3×150 mm² por DEC-012 (RFC-003)"), nunca "actualización general".
2. Al cambiar un documento se revisa qué otros documentos, planos y listados lo citan o comparten el dato (análisis de impacto), y se registran en el control de revisiones.
3. **No pueden coexistir dos documentos con el mismo propósito**: se reemplazan por revisión.
4. Los documentos superados van a la carpeta de históricos; no se editan.
5. La lista maestra (\`DELIVERABLES.md\`) es la única fuente de códigos y revisiones vigentes.
6. **Control de revisiones — quién completa cada columna.** *Elaboró*: lo completa Claude al crear cada revisión. *Revisó*: lo completa Claude con el nombre del usuario al registrar la revisión aprobada del paquete (\`revisión aprobada\`); en una revisión aún no revisada puede quedar «—». *Aprobó*: solo se completa en las filas de entrega (\`00\`, \`01\` y \`02\` en adelante), con el nombre de la persona responsable; nunca lo completa Claude por sí mismo.
7. **Estado de decisiones y supuestos.** El documento cita \`DEC-nnn\` y \`SUP-nnn\` por ID y no escribe su estado (RG-16). Cuando una propuesta se aprueba o un supuesto se reemplaza, se actualiza la marca del texto sin cambiar la revisión y se deja una nota en el control de revisiones de la revisión vigente. Actualizar una referencia cruzada o una marca no es un cambio de revisión.

## 11. Redacción contractual

| Verbo | Significado | Uso |
|---|---|---|
| "deberá" / "deben" | Obligación | Especificaciones, alcances, responsabilidades |
| "no deberá" | Prohibición | Ídem |
| "podrá" | Facultad (opcional) | Cuando se otorga una opción |
| "se recomienda" | Recomendación no obligatoria | Solo en documentos informativos, nunca en especificaciones |
| "es" / "se encuentra" | Descripción | Memorias descriptivas |

Debe indicarse siempre **el sujeto** de la obligación (Contratista, Cliente, Proveedor, Ingeniería) y el **criterio de verificación** cuando la obligación sea medible.

| Redacción deficiente | Redacción correcta |
|---|---|
| "El tablero será de excelente calidad y alta robustez." | "El tablero deberá cumplir IEC 61439-1 y IEC 61439-2 y contar con verificación de diseño y ensayos individuales documentados." |
| "Los cables serán adecuados para el servicio." | "Los cables deberán cumplir \`ENG-CND-006\` y la sección determinada en la memoria \`[código]\`." |

## 12. Checklist de cierre documental

Antes de entregar un paquete a revisión o de pedir la auditoría, el redactor verifica cada documento del paquete (y, al terminar, el paquete completo):

- [ ] El código, título y revisión coinciden con \`DELIVERABLES.md\` (se comprueba con \`python3 98_LIBRARY/CALCULATIONS/document_verifier.py <carpeta_del_proyecto>\`; ver \`CLAUDE.md\`, 8.3, punto 7).
- [ ] Si es parte de un paquete: los paquetes de los que depende están \`REVIEWED\` y el documento cita su «revisión vigente».
- [ ] Si es una síntesis de cálculo (\`SM\`): cada valor, hipótesis y conclusión figura en su memoria (misma revisión de paquete) y no repite procedimientos.
- [ ] Sigue la estructura estándar (sección 7) y las reglas de su tipo (sección 6).
- [ ] No hay datos sin fuente; cada valor de \`PROJECT_INFORMATION.md\` coincide.
- [ ] No hay marcas \`[DEFINIR]\` / \`[VERIFICAR]\` sin justificar.
- [ ] No repite contenido de otros documentos; se referencia por código.
- [ ] Los IDs de requisitos cubiertos figuran en \`TRACEABILITY_MATRIX.md\`.
- [ ] Las decisiones y supuestos citados existen en \`ASSUMPTIONS_AND_DECISIONS.md\`.
- [ ] Las normas citadas están en \`PROJECT_INFORMATION.md\` con edición.
- [ ] Control de revisiones completo (columna *Origen*, revisión con su sufijo de fase; cada comentario incorporado cita su \`REV-nnn\` y cada revisión \`00.n\` la \`RFC-00n\` que la originó).
- [ ] Ortografía, unidades y numeración de valores uniformes.
- [ ] Formato Markdown compatible con Pandoc (RG-20): títulos sin numeración, un solo \`#\`, viñetas con \`-\`, referencias por nombre y bloque YAML de portada (\`document_verifier.py\` sin errores de formato).
- [ ] Si es un pliego: autocontrol de \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`, 4.8, y \`python3 -B 98_LIBRARY/CALCULATIONS/specification_verifier.py 02_ENGINEERING/TECHNICAL_SPECS\` sin errores.

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Reunir en un solo lugar las **reglas de práctica de la oficina** que se repiten en todos los proyectos (alturas de montaje, ubicación de elementos, niveles por tipo de área, valores de partida), para que Claude no las pregunte ni las invente cada vez y para que los planos y memorias sean consistentes entre proyectos.

## 2. Alcance

Cubre reglas generales de **diseño y montaje** por disciplina. No reemplaza a las normas ni a los reglamentos (\`ENGINEERING_STANDARDS.md\` los cita) ni a los requisitos del cliente. Una regla de este archivo es un **valor por defecto de la oficina**.

## 3. Forma de utilización

1. Antes de diseñar o generar insumos de dibujo, Claude consulta las reglas de la disciplina (\`CLAUDE.md\`, sección 7).
2. Si el cliente o el reglamento local exigen otro valor, prevalece el requisito del cliente o del reglamento (jerarquía de \`CLAUDE.md\`, sección 4.1) y se registra la decisión (\`DEC-nnn\`) citando el \`RGD-\` desplazado.
3. Una regla con \`[DEFINIR]\` no se aplica por suposición: Claude pregunta al usuario, registra la respuesta aquí (con fecha y motivo en el historial) y la usa desde ese momento en todos los proyectos. Con el comando **«completar reglas de diseño [disciplina]»** Claude entrevista al usuario sobre todas las reglas pendientes de esa disciplina. Este es el **único archivo de reglas generales para todas las disciplinas**; no se crean archivos paralelos.
4. Los valores de iluminancia de la sección 9 son **orientativos**: el valor de cada proyecto surge de la norma vigente y del requisito del cliente, se fija en \`PROJECT_INFORMATION.md\` y se verifica en la memoria de cálculo.
5. Cambios a este archivo: solo por decisión del Líder Técnico, con fecha y motivo en el historial (sección 10). El cambio no altera proyectos ya con línea base, salvo decisión registrada.
6. La auditoría verifica el cumplimiento de las reglas aplicables (\`PROJECT_AUDIT.md\`, A3-17).

## 4. Estructura recomendada

Cada regla tiene ID \`RGD-<DISC>-nnn\`, enunciado verificable, valor con unidad, origen (OFICINA / NORMA / CLIENTE-TIPO) y observaciones. Las reglas se agrupan por disciplina con los mismos códigos de \`CAD_STANDARDS.md\`: E (eléctrica), F (incendio), H (HVAC), M (mecánica), P (cañerías), C (civil), S (estructuras), I (instrumentación), T (telecomunicaciones), A (arquitectura).

## 5. Ejemplos de uso (ilustrativos)

- El plano de tomacorrientes cita \`RGD-E-001\` para la cota de montaje; no se pregunta al usuario.
- El cliente exige tomacorrientes a +0,45 m: se registra \`DEC-nnn\` que desplaza \`RGD-E-001\` para ese proyecto.
- Claude necesita la altura de montaje de sensores de presencia; la regla figura \`[DEFINIR]\`, por lo que pregunta, registra y propone incorporarla.

## 6. Buenas prácticas

- Un valor, una regla: sin duplicar valores en otros archivos; citar el ID.
- Agregar una regla cuando la misma pregunta se repite en dos proyectos.
- Indicar siempre el nivel de referencia (por ejemplo NPT = nivel de piso terminado).
- Revisar las reglas cada vez que se actualice una norma citada.

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Establecer un estándar CAD único para todas las disciplinas, de modo que los planos sean **consistentes, intercambiables, legibles e imprimibles de la misma manera** en cualquier proyecto y cliente.

## 2. Alcance

Cubre nomenclatura de capas, convenciones de dibujo, referencias externas (xrefs), convenciones de impresión, nomenclatura de planos, bloques y rótulos. Aplica a archivos DWG y PDF entregados. Si el cliente exige otro estándar CAD, se registra en \`CLIENT_REQUIREMENTS.md\` (sección *Requisitos CAD*) y se documenta la tabla de correspondencia; los valores indicados aquí funcionan como **valores por defecto**.

## 3. Forma de utilización

1. Al iniciar el proyecto, verificar si el cliente (o proyectos históricos del cliente) impone un estándar CAD; si lo hay, registrar la decisión de adoptarlo o mapearlo.
2. Crear las plantillas DWT del proyecto con capas, estilos de texto, cotas, tipos de línea y rótulo según este estándar.
3. Nombrar los planos según la sección 9.
4. Antes de entregar, ejecutar la **lista de verificación de entrega** (sección 11).
5. Las capas nuevas se agregan por decisión registrada, nunca ad hoc.

## 3.1 Elaboración de planos (regla del framework)

1. **Los planos DWG los elabora el usuario personalmente.** Claude no genera, edita ni sustituye archivos DWG.
2. Para cada plano (\`PL\`) y diagrama dibujado en CAD (\`DG\`) de la LME, Claude entrega un **conjunto de insumos de dibujo** (\`<código-del-plano>_DIN_Rev00.0.md\`, que hereda el código del plano; \`DOCUMENT_RULES.md\`, 8.1) en \`02_ENGINEERING/DRAWING_INPUTS/\` con: objeto y vista del plano; lista de elementos (tag, tipo, cantidad, ubicación o criterio de ubicación con alturas según \`DESIGN_RULES.md\`); capas y bloques a usar; notas y leyendas; cuadros (cargas, circuitos, luminarias); referencias a cálculos, listados y especificaciones por código y revisión; datos pendientes (\`INF-nnn\`); y la lista de verificación de entrega de la sección 11.
   Los DWG que dibuja el usuario viven en esa misma carpeta de planos (en multidisciplina, subcarpeta por disciplina) y los recursos comunes (plantillas DWT, xrefs, bloques y símbolos) en \`02_ENGINEERING/CAD_RESOURCES/\` (\`01_Templates\`, \`02_XREF\`, \`03_Blocks_and_Symbols\`). No existe una carpeta CAD ni de trabajo aparte: el plano es **el mismo archivo en todas las fases** y madura con más información (sección 3.2); no se crea un CAD distinto por fase.
3. **El estado del plano vive en \`DRAWING_STATUS.md\`** (fuente única; el usuario lo actualiza a mano, porque Claude no puede conocer el estado de un archivo que dibuja el usuario). Estados: \`PLANNED\` → \`CAD_INPUT\` (insumos entregados) → \`DRAWN\` (el usuario depositó el DWG y el PDF de revisión) → \`REVIEWED\` (OK personal del usuario, sin hoja de revisión aparte) → \`ENTREGADO\` (después de \`entrega enviada TR-nnn\`). Claude **nunca** modifica la columna *Estado*: solo propone filas nuevas (\`PLANNED\` o \`CAD_INPUT\`) y completa la columna *Verificación de Claude*. La LME (\`DELIVERABLES.md\`) y \`PROJECT_STATUS.md\` solo remiten a ese archivo. Los insumos son un **documento revisable**: Claude los marca \`FOR_REVIEW\` en la hoja de revisión de su paquete para que el usuario los revise antes de dibujar (el plano no se dibuja hasta que ese paquete esté \`REVIEWED\`); el estado \`CAD_INPUT\` es del plano, no del documento de insumos, que no tiene fila propia en la LME.
4. Al recibir un plano (\`verificar plano [código]\` o \`actualizar planos\`), Claude lo verifica contra los insumos y la lista de verificación (por el PDF de revisión exportado, o por un DXF si el usuario lo provee), escribe el resultado en *Verificación de Claude* (\`OK\` u \`OBSERVACIONES REV-nnn\`) y registra las diferencias como comentarios \`REV-nnn\`. Lo que no pueda leer del archivo lo declara como no verificado. Un plano solo entra en una entrega si el usuario lo marcó \`REVIEWED\`.
5. Un cambio de ingeniería que afecte un plano pasa por una \`RFC\` (\`CHANGE_REQUESTS.md\`) y genera un insumo actualizado (\`Rev 00.n\`, con \`n\` igual al número de la \`RFC\`; un comentario o corrección documental suma 1 al último dígito, \`00.0.1\`) con la lista de cambios; el usuario actualiza el DWG y el estado en \`DRAWING_STATUS.md\`.
6. Al abrir cada sesión Claude lee \`DRAWING_STATUS.md\`; si la fecha del último cambio es anterior al último paquete entregado, pregunta si hubo cambios no registrados.

## 3.2 Nivel de información por fase \`[VERIFICAR]\`

El plano **es un único archivo que madura de fase en fase** (\`IC\` → \`IB\` → \`ID\` → \`IE\` → \`ASB\`); no se copia ni se rehace al cambiar de fase: la revisión continúa (\`DOCUMENT_RULES.md\`, sección 9) y cada fase agrega información. La tabla fija el nivel esperado (coherente con la matriz de madurez de \`DELIVERABLES.md\`, sección 10); el usuario la corrige según su práctica y la del cliente.

| Aspecto | Conceptual (\`IC\`) | Básica (\`IB\`) | Detalle (\`ID\`) | Ejecutiva (\`IE\`) | As-built (\`ASB\`) |
|---|---|---|---|---|---|
| Ubicación | \`02_ENGINEERING/DRAWINGS/\` (insumos en \`02_ENGINEERING/DRAWING_INPUTS/\`) | igual | igual | igual | \`02_ENGINEERING/AS_BUILT/\` |
| Nivel de detalle | Esquemático | Bajo | Alto | Final para construcción | Igual que el ejecutivo, actualizado con lo construido |
| Contenido típico | Layout preliminar; áreas; unifilar esquemático | Layouts y áreas; equipos principales; unifilar básico; recorridos troncales esquemáticos | Recorridos y circuitos completos; cotas; tags de equipos y cables; detalles de montaje y típicos; notas; listados cruzados con planos | Planos coordinados y actualizados constantemente con las decisiones de obra | Planos corregidos con los redlines de obra (\`Rev 01\`), con lo instalado, el motivo del cambio y su acta (\`RFC-nnn\` o acta del cliente) |
| Detalles constructivos | No | No | Sí | Sí, finales | Los realmente ejecutados |
| Rótulo | Completo | Completo | Completo | Completo | Completo, con estado \`AS BUILT\` |
| Emisión típica | IFA | IFA | IFA | IFC | Entrega final as-built |
| Base de partida | Información de entrada (\`01_INPUT\`) | Plano conceptual aprobado (\`cliente aprueba\`) | Plano básico aprobado | Plano de detalle aprobado | Plano IFC vigente y redlines consolidados |

Las plantillas, xrefs y bloques son comunes a todas las fases (\`02_ENGINEERING/CAD_RESOURCES/\`). Cada comentario o RFC que cambia un plano suma a su revisión (\`00.0.1\`, \`00.1\`…); la revisión superada se archiva en \`02_ENGINEERING/ARCHIVE/\`.

## 4. Estructura recomendada

Disciplinas → formato de capa → capas de Electricidad → capas de otras disciplinas → convenciones de dibujo → xrefs → impresión → nomenclatura de planos → verificación y depuración de entrega.

## 6. Nomenclatura de capas

### 6.1 Formato

\`\`\`text
[DISC]-[SISTEMA]-[ELEMENTO]            (obligatorio)
[DISC]-[SISTEMA]-[ELEMENTO]-[ESTADO]   (cuando se distingue condición)
\`\`\`

- Todo en mayúsculas, separado por guiones, sin espacios ni tildes.
- Máximo 3 campos principales + estado opcional.
- **Estado** (opcional): \`NEW\` nuevo, \`EXIST\` existente, \`DEMO\` a retirar, \`FUT\` futuro.

## 7. Convenciones de dibujo

| Tema | Convención |
|---|---|
| Unidades | 1 unidad de dibujo = 1 mm en detalles y plantas de equipos; implantaciones generales en metros solo si se define por decisión y se informa en el rótulo |
| Modelo | Se dibuja en espacio modelo a escala 1:1; las escalas se resuelven en presentación |
| Coordenadas | Sistema de coordenadas del sitio definido en \`PROJECT_INFORMATION.md\`; punto base común para todas las disciplinas |
| Propiedades | Todo objeto con color, tipo de línea y espesor **PorCapa** (ByLayer); se prohíben propiedades forzadas por objeto |
| Texto | Estilos definidos en plantilla; altura de impresión mínima 2,5 mm; anotativo o por escala según plantilla |
| Cotas | Estilo único por escala; unidades coherentes con el modelo |
| Bloques | Definidos en capa \`0\`, propiedades PorBloque, con atributos para identificación (TAG, DESCRIPCIÓN); insertados en la capa del sistema correspondiente |
| Símbolos | Según IEC 60617 o norma corporativa del cliente; biblioteca única por proyecto |
| Identificadores | Todo equipo y cable dibujado lleva identificador que coincide con unifilares y listados |
| Limpieza | Sin objetos duplicados, sin capas vacías, sin referencias huérfanas; ejecutar \`PURGE\` y \`AUDIT\` antes de entregar |
| Revisiones | Cambios marcados con nube de revisión en \`E-ANNO-REVC\` y descripción en el cuadro de revisiones del rótulo; se limpian en la siguiente entrega |
| Estados de obra | \`NEW\`, \`EXIST\` y \`DEMO\` diferenciados por sufijo de capa y tipo de línea |

## 8. Referencias externas (xrefs)

| Regla | Detalle |
|---|---|
| Tipo de vínculo | **Overlay** por defecto, para evitar referencias circulares; **Attach** solo si lo exige el flujo |
| Ruta | Relativa, nunca absoluta; carpeta \`02_ENGINEERING/CAD_RESOURCES/02_XREF\` del proyecto |
| Archivos base | Un archivo base de arquitectura / civil por área (\`PRY-A-BASE-nnn\`, \`PRY-C-BASE-nnn\`) con capas limpias y sin anotaciones |
| Nomenclatura | \`PRY-[DISC]-XR-nnn\` para archivos pensados para referenciar |
| Capas | Las capas de la xref aparecen con el prefijo \`NOMBRE_XREF|\`; se controlan por congelamiento en ventana, no se modifican |
| Edición | Las xrefs no se editan desde el archivo que las referencia; se corrige en el archivo origen |
| Actualización | Antes de entregar, recargar todas las xrefs y verificar que no hay referencias no resueltas |
| Prohibiciones | Prohibido vincular archivos de otras carpetas fuera del proyecto, o usar bind sin decisión del Líder Técnico; la excepción es la copia depurada que se entrega, donde el bind o el eTransmit de las xrefs es obligatorio (lista de «depuración de entrega», \`FOLDER_TEMPLATES.md\`, 4.5) |

## 9. Nomenclatura de planos

\`\`\`text
[PRY]-[DISC]-PL-[NNN]_Rev[R].dwg
\`\`\`

El nombre del archivo es el identificador completo del plano más la extensión (\`DOCUMENT_RULES.md\`, 8.1: código sin revisión, \`_Rev<R>\` una sola vez). El **esquema unifilar y los demás diagramas son \`DG\`-nnn** y no se numeran en estos rangos; los rangos siguientes se aplican **solo a los planos \`PL\`**. El correlativo es sin reutilización y puede comenzar en la base del rango de su contenido (por ejemplo \`PL-400\`) y continuar dentro del rango. Rango sugerido de numeración de planos \`PL\` para Electricidad:

| Rango | Contenido |
|---|---|
| 001–009 | Generales: índice, leyendas, simbología, notas |
| 010–099 | Reservado (los unifilares y esquemas son \`DG\`, ver \`DOCUMENT_RULES.md\`, 8.2) |
| 100–199 | Implantaciones y plantas de equipos |
| 200–299 | Canalizaciones, bandejas y recorridos |
| 300–399 | Puesta a tierra y pararrayos |
| 400–499 | Alumbrado y fuerza |
| 500–599 | Control, señales e instrumentación eléctrica |
| 600–699 | Detalles de montaje y típicos |
| 700–799 | Tableros: vistas, disposición y conexionado |
| 800–899 | Protección contra incendio eléctrica y telecom |
| 900–999 | As-Built / Registros especiales |

Las demás disciplinas usan la misma estructura de rangos adaptada a su tipo de plano (001–009 generales; 010–099 reservado, porque los diagramas, P&ID y esquemas son \`DG\`; 100–199 implantaciones; 200–699 plantas, cortes y detalles; 900–999 as-built), definida por decisión al inicio del proyecto.

Rótulo: atributos mínimos — proyecto, cliente, título, código, revisión, fecha, escala, hoja, elaboró, revisó, aprobó, estado de emisión (IFA / IFC / AS BUILT), cuadro de revisiones.

## 10. Convenciones de impresión

| Tema | Convención |
|---|---|
| Formatos | Serie ISO 216 (A0, A1, A2, A3, A4); formato por defecto A1 o A3 según definición del cliente |
| Escalas | 1:1, 1:2, 1:5, 1:10, 1:20, 1:50, 1:100, 1:200, 1:500; se indica en el rótulo y en cada ventana |
| Presentaciones | Una presentación por plano; nombre de presentación igual al código del plano |
| Ventanas | Ventanas en capa \`XX-VPORT\` (no imprimible), escala fija bloqueada |
| Estilo de impresión | Por color (CTB) por defecto; por nombre (STB) solo si el cliente lo requiere; archivo único por proyecto |
| Espesores | Según tabla de capas; coherencia entre PDF y copia impresa |
| Salida | PDF vectorial con nombre igual al archivo DWG, mismo código y revisión; no se entregan PDF escaneados |
| Ploteo | Verificar fuentes, tramas y escalas de línea antes de entregar |
| Fecha y revisión | La revisión del rótulo coincide con la del nombre de archivo: \`Rev 00\` en la copia entregada (\`06_DELIVERABLES\`) y la revisión interna \`00.n\` en el DWG de trabajo; ambas figuran en \`DELIVERABLES.md\` |

- [ ] Código, título y revisión en el rótulo coinciden con \`DELIVERABLES.md\`, y el estado del plano con \`DRAWING_STATUS.md\`. Al cliente se entrega rotulado \`Rev 00\`.
- [ ] Todas las capas cumplen la nomenclatura; sin capas fuera de estándar.
- [ ] Todo objeto con propiedades PorCapa.
- [ ] Xrefs relativas, cargadas, sin referencias huérfanas.
- [ ] Identificadores de equipos y cables coinciden con listados y unifilares.

- [ ] Nubes de revisión coinciden con el cuadro de revisiones.
- [ ] \`PURGE\` y \`AUDIT\` ejecutados.
- [ ] PDF generado con estilo de impresión correcto y legibilidad verificada.

- [ ] **Depuración de entrega** completa (\`FOLDER_TEMPLATES.md\`, 4.5, DE-01 a DE-10): \`PURGE\`, \`AUDIT\`, \`RECOVER\`, \`ETRANSMIT\` o bind de xrefs, sin datos de otros proyectos ni internos, PDF de verificación contra el DWG y nombres según \`DOCUMENT_RULES.md\`. El DWG y el PDF entregados son copias depuradas en \`06_DELIVERABLES\`; el DWG de trabajo permanece en \`02_ENGINEERING\`.

## 12. Ejemplos

**Ejemplo de nombre de plano:** \`ACM01-E-PL-210_Rev00.2.dwg\` → plano de recorrido de bandejas de baja tensión, revisión interna 00.2 (por la \`RFC-002\`; el cliente la recibe rotulada Rev 00).

**Ejemplo de capas en una planta de sala eléctrica:** \`E-MV-EQUIP\` (celdas), \`E-LV-EQUIP\` (tableros), \`E-TRAY-MV\` y \`E-TRAY-LV\` (bandejas), \`E-GND-GRID\` (malla de tierra), \`E-ANNO-TAGS\` (identificadores), \`A-WALL-FULL\` (xref de arquitectura).

**Ejemplo de capa con estado:** \`E-LV-EQUIP-EXIST\` (tablero existente), \`E-LV-EQUIP-NEW\` (tablero nuevo), \`E-LV-EQUIP-DEMO\` (tablero a retirar).

## 13. Buenas prácticas

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Definir cómo se redacta, numera, versiona, revisa y entrega un **pliego técnico modular**: un único documento contractual (\`PG\`) escrito como una secuencia fija de capítulos, cada uno en su propio archivo Markdown numerado, de modo que el orden sea siempre el mismo en todos los proyectos y cada capítulo responda **una única pregunta**. Incorpora, sin alterar su sentido, la guía de redacción del usuario (sección 4.4), que es la autoridad en materia de redacción del pliego.

## 2. Alcance

- Aplica a todo proyecto que requiera un pliego técnico (documentación licitatoria, pliego de especificaciones o de condiciones técnicas). La carpeta del pliego se crea solo cuando el proyecto lo requiere; en la plantilla C (licitación) es parte esencial (\`FOLDER_TEMPLATES.md\`, 4.6).
- Cubre: la estructura de carpeta y archivos, la tabla de capítulos, las reglas de redacción y de consistencia con el framework, el versionado y la consolidación para la entrega, la matriz de preparación por capítulo, el autocontrol y la forma en que el usuario revisa el pliego.
- No cubre: las especificaciones técnicas de equipos (\`ET\`, \`DOCUMENT_RULES.md\`, 6.2), los contratos ni los pliegos recibidos del cliente (se guardan en \`01_INPUT/01_CONTRACTS_AND_TENDERS\`), ni los aspectos económicos y comerciales: el pliego **no contiene precios ni condiciones comerciales** (\`DOCUMENT_RULES.md\`, RG-05).
- La firma y la aprobación contractual del pliego son siempre humanas (\`CLAUDE.md\`, sección 2).

## 3. Forma de utilización

1. Confirmar que el proyecto requiere pliego, registrar su entregable \`PG\` en la LME (\`DELIVERABLES.md\`, 7.1) con su código (\`DOCUMENT_RULES.md\`, 8.1) y la decisión de aplicabilidad.
2. Ejecutar \`armar pliego\` (\`CLAUDE.md\`, 8.2; detalle en \`COMMANDS.md\`): crea \`02_ENGINEERING/TECHNICAL_SPECS/\` con \`00_Index_and_Control.md\`, los diez capítulos vacíos con su plantilla (sección «PLANTILLA» de este archivo) y la subcarpeta \`Annexes/\`.
3. Registrar los **paquetes de pliego** (4.10) en la LME y en el plan de paquetes: cada capítulo, o grupo de capítulos que van de la mano, es un paquete de revisión con sus dependencias. **El pliego nunca se redacta antes que los paquetes técnicos de los que depende** (cálculos, diseño).
4. Evaluar la **puerta de preparación capítulo por capítulo** (4.7) y la **puerta de dependencias** del paquete (4.10). Los paquetes cuya puerta se cumple se desarrollan; los demás quedan \`BLOCKED\` con su \`BLQ-nnn\` o en espera de sus dependencias, sin detener el resto del plan.
5. Redactar con \`desarrollar documentación licitatoria\`, **un paquete de pliego por vez** y, dentro del paquete, **en orden numérico**, aplicando las reglas de redacción (4.4) y de consistencia (4.5).
6. Pasar el **autocontrol del pliego** (4.8) y ejecutar \`python3 -B 98_LIBRARY/CALCULATIONS/specification_verifier.py 02_ENGINEERING/TECHNICAL_SPECS\` (CAL-011) antes de pasar el paquete a \`FOR_REVIEW\`; Claude entrega la hoja del paquete y se detiene.
7. El usuario revisa el paquete, capítulo por capítulo, en su hoja de revisión (4.9). Con todos los paquetes del pliego \`REVIEWED\` y la auditoría de la entrega, Claude consolida los capítulos en un único documento en \`06_DELIVERABLES\` (4.6).

### 4.3 Reglas de numeración

1. Los capítulos se numeran **de a uno**, con dos dígitos, desde \`01\`, sin saltos ni duplicados.
2. **Nunca se renumeran.** El número de un capítulo es el mismo en todos los proyectos y en todas las revisiones.
3. Un capítulo que no aplica **se conserva** para mantener la numeración, con la leyenda \`No aplica a este proyecto (DEC-nnn)\`, citando la decisión que lo justifica. Conserva su encabezado y la línea «Pregunta que responde».
4. Los capítulos adicionales (por ejemplo, planillas de datos garantizados o anexos redactados como parte del pliego) se agregan **al final** con \`11\`, \`12\`… sin alterar el orden de los anteriores. Los archivos de respaldo que no son capítulos (planos, hojas de datos de terceros) van en \`Annexes/\`.
5. Nombre de archivo: \`<NN>_<Name>.md\`, con \`Mayusculas_Iniciales_Con_Guion_Bajo\`, sin tildes ni espacios y **sin repetir el código del pliego** (el código y la revisión van en el encabezado de cada capítulo y en \`00_Index_and_Control.md\`).
6. Los títulos del capítulo y de sus secciones se escriben **sin número** (\`# Condiciones Generales de Ejecución\`, \`## Planificación\`; \`DOCUMENT_RULES.md\`, RG-20): el número del capítulo vive solo en el nombre del archivo y la numeración que ve el lector la aplica la plantilla Word al convertir con Pandoc. Capítulos y secciones se citan **por nombre** («\`<código>\`, capítulo Condiciones Generales de Ejecución, sección Planificación»), nunca por número.
7. Cada capítulo tiene un solo \`#\` (su nombre) y sus secciones son \`##\` y \`###\` sin saltos de nivel; las viñetas van con \`-\`.

### 4.4 Guía de redacción (del usuario)

> Texto autoritativo entregado por el usuario, incorporado sin alterar su sentido. Solo se ajustaron el formato y el nivel de los encabezados para no chocar con la numeración de este archivo.

#### Filosofía General

Un buen pliego no se construye agregando más contenido, sino separando correctamente los conceptos.

La regla principal es:

> Cada capítulo debe responder una única pregunta.
>
> Si un texto responde otra pregunta, probablemente está ubicado en el capítulo incorrecto.

El documento debe redactarse de forma:

- Técnica.
- Clara.
- Contractual.
- Natural de leer.
- Sin redundancias.
- Sin superposición entre capítulos.
- Sin repetir conceptos ya definidos en otras secciones.

Cada apartado debe aportar información nueva al lector.

### 4.6 Versionado, consolidación y entrega

**Un documento, un código, una revisión.** El pliego es **un solo documento** con código de tipo \`PG\` (\`DOCUMENT_RULES.md\`, 8.2): \`[PRY]-[DISC]-PG-[NNN]\` (por ejemplo \`ACM01-G-PG-001\`; \`DISC\` es \`G\` si es multidisciplina o la letra de la disciplina si es monodisciplina). Tiene **una** revisión: nace en \`Rev 00.0\`, pasa a \`00.n\` solo por una \`RFC\` una vez \`REVIEWED\`, y el cliente siempre lo recibe rotulado \`Rev 00\` (\`DOCUMENT_RULES.md\`, sección 9). Los capítulos no tienen código ni revisión propios.

**Encabezado de cada capítulo.** Lleva el código del pliego y la revisión **del conjunto** (la misma en todos los capítulos y en el índice). Cuando el pliego pasa a una revisión nueva (\`00.n\`, por una \`RFC\`) o suma un comentario (\`00.0.c\`) se actualizan los encabezados de todos los capítulos y el índice anota, en el control de revisiones, **qué capítulos cambiaron** y por qué (descripción específica, \`DOCUMENT_RULES.md\`, sección 10). Un capítulo sin cambios conserva su texto y solo cambia la revisión del encabezado.

**Cambios.** Todo comentario \`REV-nnn\` (del usuario, del cliente o de la auditoría) que se incorpora suma 1 al último dígito de la revisión del conjunto (\`00.0\` → \`00.0.1\`); si además cambia línea base, alcance, requisitos, parámetros maestros, filosofía de operación, criterios de diseño, potencias o equipos aprobados, se tramita como \`RFC-nnn\` y el conjunto pasa a \`Rev 00.n\`, con \`n\` igual al número de la RFC. La revisión superada se archiva consolidada en \`02_ENGINEERING/ARCHIVE/<código>/<código>_Rev<R>.md\` (estado \`SUPERSEDED\`), con sus anexos.

**Consolidación para la entrega.** Los capítulos **no se entregan sueltos**. Tras la auditoría (\`AUDITED\`), Claude genera en \`06_DELIVERABLES/<tipo>/<YYYYMMDD_TR-nnn_Rev00>/Documents/\` un único documento \`<código>_Rev00.md\` (identificador completo, \`DOCUMENT_RULES.md\`, 8.1; si se acordó otro formato final, se exporta desde él), con este procedimiento:

1. Verificar que todos los capítulos tienen el mismo código y la misma revisión, que el verificador (CAL-011) no informa errores y que ningún capítulo está \`BLOCKED\` (salvo entrega parcial registrada en una \`DEC\`, con el capítulo como \`BLOQUEADO (PQ-nn)\`).
2. Armar el documento con la portada y el control de revisiones de \`00_Index_and_Control.md\`, el índice, y los capítulos **en orden numérico** (01, 02, … 10, 11…), cada uno bajo un título \`##\` con su nombre, **sin número** (\`## Alcance\`): al insertarlos, cada título del capítulo baja un nivel (\`#\` pasa a \`##\`, \`##\` a \`###\`) para que el consolidado tenga un solo \`#\` (el título del pliego, con el bloque YAML de portada del índice, \`DOCUMENT_RULES.md\`, 7.1). Se conservan los capítulos «No aplica» con su leyenda, para mantener la numeración.
3. **Depurar** (\`FOLDER_TEMPLATES.md\`, 4.5, DE-08): se quitan la tabla de encabezado de cada capítulo, la línea «Pregunta que responde», los comentarios y las marcas internas; los «Pendientes y supuestos» de los capítulos se reúnen en una sola sección final del documento (\`DOCUMENT_RULES.md\`, sección 7), que en una entrega para construcción debe estar vacía.
4. Los archivos de \`Annexes/\` se copian con su nombre \`<código>_Rev<R>_ANX-<n>_<descr>.<ext>\` y se listan en el documento.
5. El transmittal registra la correspondencia (por ejemplo «TR-001 = revisión interna 00.0»; «TR-002 = revisión interna 00.2»). El consolidado debe **coincidir** con \`TECHNICAL_SPECS\` (mismo orden, mismo texto, misma revisión); no se edita después de entregado.

**Estado y LME.** El pliego es una sola fila de la LME (\`DELIVERABLES.md\`); el estado de cada capítulo (\`DRAFT\`, \`BLOCKED\`, \`FOR_REVIEW\`, \`REVIEWED\`…, \`NO APLICA\`) vive en \`00_Index_and_Control.md\`, y el estado del conjunto es el del paquete de pliego menos avanzado (avanza cuando todos los capítulos desarrollables alcanzaron el estado). Los requisitos del cliente que el pliego cubre se registran en \`TRACEABILITY_MATRIX.md\` contra el \`ENT\` del pliego, indicando el capítulo en la columna de sección.

### 4.9 Revisión del usuario

El pliego es **un** documento, pero se revisa **por paquete de pliego** (4.10): cada hoja de revisión (\`REVIEW_SHEET.md\`) contiene **solo el paquete de pliego en revisión** y su parte A lista **cada capítulo de ese paquete como una fila**:

- *Código* y *Rev.*: los del pliego; *Título*: «Capítulo <Nombre>» (sin número; el número está en la ruta del archivo); *Archivo*: la ruta del capítulo en \`TECHNICAL_SPECS\`.
- *Qué mirar*: la **pregunta que responde** el capítulo (4.2) más 2 a 4 puntos de mayor riesgo (por ejemplo, datos críticos de la línea base usados, supuestos \`SUP-nnn\` con \`[VERIFICAR]\`, límites con el capítulo vecino).
- Prioridad *Alta* para los capítulos 01, 05, 06 y 10 (donde se concentra el efecto contractual) y para los que dependen de supuestos; el resto, *Media*.
- Los capítulos \`BLOCKED\` pertenecen a otro paquete y no figuran en la hoja (el paquete bloqueado se informa en el encabezado de la hoja, con su \`BLQ-nnn\`); los «No aplica» figuran con su \`DEC-nnn\`.

El usuario da un veredicto por capítulo. Sus comentarios se transcriben como \`REV-nnn\` con el código del pliego y el capítulo y sección (por ejemplo «capítulo Requisitos de Diseño, sección Criterios de tensión»). \`procesar comentarios de revisión\` modifica solo los capítulos afectados (y los que usan un dato modificado), incorpora cada comentario sumando 1 a la revisión del **conjunto** (\`00.0\` → \`00.0.1\`) y entrega una hoja nueva **del mismo paquete de pliego** con una fila por capítulo modificado. Un capítulo \`RECHAZAR\` se rehace sin tocar los paquetes ya \`REVIEWED\`. \`revisión aprobada\` cierra el paquete de pliego (sus capítulos pasan a \`REVIEWED\`) y Claude propone el paquete de pliego siguiente según 4.10. Si un capítulo ya \`REVIEWED\` cambia después, los capítulos de paquetes posteriores que usan el dato modificado se reabren con una hoja corta de impacto (\`REVIEW_SHEET.md\`, 7.1). Con \`guiar revisión\`, Claude recorre los capítulos del paquete de a uno, en orden numérico, preguntando «¿OK, comentarios o rechazar?» a partir de la pregunta del capítulo.

### 4.10 Paquetes de pliego y dependencias

El pliego se desarrolla y se revisa **de a un paquete por vez** (\`DELIVERABLES.md\`, 4.1). Un paquete de pliego es **un capítulo o un grupo de capítulos que van de la mano**; sus dependencias son de dos clases: (a) los paquetes de pliego anteriores, porque la lectura avanza y no se vuelve atrás (reglas C-3 y C-4), y (b) los **paquetes técnicos del proyecto** (criterios de diseño, cálculos con su síntesis, unifilares, listados) cuyos resultados el capítulo cita. **El pliego nunca se redacta antes que los paquetes técnicos de los que depende:** no se escribe el capítulo 05 sin haber dimensionado antes los cables, ni el capítulo 09 sin la LME. Un capítulo depende de un paquete de cálculo cuando cita sus resultados (secciones, potencias, niveles de falla, caídas de tensión); si no los cita, la LME lo declara así y no hay dependencia. Solo se puede apartar de la regla con un \`[DEFINIR]\` justificado en una \`DEC\` (\`CLAUDE.md\`, 8.3, punto 3).

**Propuesta de paquetes de pliego** (punto de partida: Claude la ajusta a cada proyecto y el usuario la confirma o reordena con el plan de paquetes (en el charter, \`aprobar charter\`, o \`aprobar plan de paquetes\` en una fase siguiente); los \`PQ-nn\` reales los asigna la LME):

| Paquete de pliego | Capítulos | Depende de (paquetes de pliego) | Depende de (paquetes técnicos del proyecto) | Por qué van juntos o separados |
|---|---|---|---|---|
| A | 01 Alcance + 02 Memoria Descriptiva | — | Línea base; paquete del balance de cargas (memoria + síntesis), que origina \`PAR-004\` y \`PAR-005\` citados en el 02 | Qué se ejecuta y qué es el proyecto se leen juntos |
| B | 03 Marco Normativo | A | \`STANDARDS_INDEX.md\` y \`NOR-nnn\` (sin paquetes de cálculo) | Una sola pregunta; es el único lugar donde se define la normativa |
| C | 04 Condiciones Generales de Ejecución | B | Calendario (\`SCHEDULE_CCPM.md\`); paquete de criterios de diseño si cita restricciones de montaje | Contiene las obligaciones de ejecución |
| D | 05 Requisitos de Diseño | C | **Los paquetes de cálculo que el capítulo cita** (cada memoria con su síntesis: cargas, cortocircuito, conductores y cables de baja tensión, protecciones, iluminación…), criterios de diseño y unifilar | Es el capítulo técnico más pesado: va solo para que el usuario lo verifique con calma |
| E | 06 Ensayos e Inspecciones | D | Criterios de aceptación (\`CAC-nnn\`); depende del diseño | Qué se verifica depende de cómo debe quedar la solución |
| F | 07 Precommissioning + 08 COMMISSIONING | E | Paquetes de protecciones y de control si el capítulo cita ajustes o secuencias | Ambos describen la verificación posterior a la construcción y comparten criterios |
| G | 09 Documentación Técnica | F | **La LME completa y sus paquetes** (el capítulo lista exclusivamente los entregables documentales definidos allí) | Depende de la LME, no de los cálculos |
| H | 10 Responsabilidades del Contratista | G | Todos los paquetes de pliego anteriores (es el último: reúne las obligaciones que los demás capítulos no pueden llevar) | Último en redactarse |
| I, J… | 11 y siguientes (capítulos adicionales) | Los que cite el capítulo | Los que fije la \`DEC\` que lo crea | Se agregan al final, cada uno como paquete propio |

**Reglas.**

1. Un paquete de pliego **no empieza** hasta que los paquetes de los que depende están \`REVIEWED\` (puerta de dependencias, \`DELIVERABLES.md\`, sección 9), además de cumplir la puerta de preparación del capítulo (4.7).
2. Si el usuario pide redactar un capítulo cuyas dependencias técnicas no están \`REVIEWED\`, Claude no lo redacta: informa qué paquete falta, propone desarrollarlo antes y deja el paquete de pliego en espera (o \`BLOCKED\` si el dato no existe).
3. La propuesta de la tabla es el punto de partida del plan: el usuario puede agrupar más capítulos en un paquete (hasta 3 documentos o, para el pliego, pocos capítulos cortos) o separarlos, sin violar las dependencias.
4. Dentro de un paquete los capítulos se redactan en orden numérico; las hojas de revisión contienen solo los capítulos del paquete (4.9).
5. Un cambio posterior en un paquete técnico \`REVIEWED\` que un capítulo cita se trata como cambio aguas arriba: el paquete de pliego que usa el dato modificado se reabre con una hoja corta de impacto (\`REVIEW_SHEET.md\`, 7.1).

## 6. Buenas prácticas

- Antes de escribir un párrafo, preguntarse qué pregunta responde el capítulo (regla 6 del usuario).
- Redactar en orden numérico y no volver a un capítulo anterior para «completarlo»: si falta algo, se corrige en su capítulo y se registra en el control de revisiones.
- Citar, no copiar: normas por \`NOR-nnn\`, datos por \`PAR-nnn\`, alcance por \`ALD-nnn\`, documentos por código.
- Una obligación por oración, con el sujeto correcto según el capítulo (\`DOCUMENT_RULES.md\`, 11 y 14).
- Mantener el índice (\`00\`) al día en cada revisión: estado, revisión y capítulos modificados.
- Ejecutar el verificador con frecuencia durante la redacción, no solo al final; leer sus avisos como preguntas, no como sentencias.
- No consolidar ni entregar capítulos sueltos; no editar el consolidado de \`06_DELIVERABLES\`.
- Si un capítulo crece mucho, revisar si está respondiendo más de una pregunta antes de dividirlo; la división se hace con capítulos adicionales (11 en adelante), nunca renumerando.
- Escribir en Markdown limpio para Pandoc: ni números en los títulos ni viñetas con \`*\`; el verificador marca ambos como error.

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Contener las plantillas de los informes, actas y lienzos que Claude **genera** durante el proyecto (D10 a D28). Cada documento se produce con una frase fija (ver \`COMMANDS.md\` y \`RULES/M8_management_documents.md\`), se numera, se fecha y no se rehace: se emite uno nuevo.

## 2. Alcance

Documentos periódicos o por evento. Los registros permanentes (\`ISSUE_LOG\`, \`STAKEHOLDERS\`, planes) tienen su propio archivo en \`90_MANAGEMENT\`.

## 3. Forma de utilización

1. Claude copia la plantilla de la sección que corresponde al documento pedido y la guarda en la carpeta indicada, con el nombre \`<PREFIJO>-nn_AAAAMMDD.md\`.
2. Los datos **no se escriben a mano**: Claude los toma de sus fuentes (\`LEDGER\`, \`ISSUE_LOG\`, \`DELIVERABLES\`, \`SCHEDULE_CCPM\`, \`EFFORT_BASELINE\`, registro de riesgos) y cita el ID de cada una.
3. Cada documento termina con el bloque *Fuentes usadas* para poder reconstruirlo.
4. Los documentos emitidos al cliente se envían por transmittal; los internos se quedan en \`90_MANAGEMENT\`.

## 4. Estructura recomendada

Cada plantilla indica carpeta, prefijo, disparador, destinatario y las secciones del documento.

## 5. Ejemplos (ilustrativos)

\`90_MANAGEMENT/REPORTS/STATUS-03_20261105.md\` es el tercer informe de estado, emitido el 5 de noviembre de 2026.

## 6. Buenas prácticas

- Un informe es una fotografía: no se edita después de emitido.
- Si un dato no tiene fuente, se declara «sin dato» y se abre una incidencia.
- Mantener cada informe en una o dos páginas.
