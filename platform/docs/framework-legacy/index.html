# PLANTILLAS (copiar, no editar este archivo)

## D10 — Acta de reunión

Carpeta \`90_MANAGEMENT/Meetings/\`, nombre \`MTG-nnn_AAAAMMDD.md\`. Disparador: \`registrar reunión\`. Destinatario: asistentes.

Secciones: fecha, hora, asistentes y rol; agenda; decisiones tomadas (se registran también como \`DEC-nnn\`); puntos de acción (\`PA\` en \`ISSUE_LOG\`, con responsable y fecha); cambios detectados (\`RFC\` propuestas); próxima reunión.

## D11 — Informe de estado

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`STATUS-nn_AAAAMMDD.md\`. Disparador: \`generar informe de estado\`. Destinatario: cliente y patrocinador.

Secciones: semáforo global (verde / amarillo / rojo) con motivo; hitos del período (planificado vs real); avance de paquetes; horas (resumen de \`EFFORT\`); riesgos rojos y amarillos; incidencias vencidas; cambios abiertos; decisiones pedidas al lector; próximos pasos del período siguiente. Fuentes usadas.

## D12 — Informe de avance (extiende PROGRESS-nn)

Carpeta \`90_MANAGEMENT/PROGRESS/\`, nombre \`PROGRESS-nn_AAAAMMDD.md\`. Disparador: \`generar informe de avance\`. Destinatario: equipo y cliente.

Secciones: avance por paquete y entrega, calculado del \`LEDGER\`; avance planificado según \`SCHEDULE_CCPM\`; consumo de colchón del cronograma (zona verde / amarilla / roja); fechas reales tomadas del \`LEDGER\`; borrador pre-llenado por Claude para que el usuario solo corrija.

## D13 — Informe de riesgos

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`RISKS-nn_AAAAMMDD.md\`. Disparador: \`generar informe de riesgos\`. Destinatario: patrocinador.

Secciones: matriz probabilidad × impacto (escalas de \`RISK_PLAN\`); cambios desde el informe anterior (nuevos, cerrados, subieron, bajaron); riesgos rojos con su respuesta; riesgos materializados (enlace a \`ISSUE_LOG\`); riesgos que requieren decisión.

## D14 — Informe de esfuerzo

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`EFFORT-nn_AAAAMMDD.md\`. Disparador: \`generar informe de esfuerzo\`. Destinatario: Project Engineer y patrocinador.

Secciones: horas estimadas, reales y ganadas por paquete (de \`EFFORT_BASELINE\`); índice de desempeño de esfuerzo = ganadas / reales; índice de plazo = ganadas / planificadas; proyección de horas al terminar = estimadas / índice de desempeño [complemento: gestión del valor ganado]; desvíos mayores al umbral y causa.

## D15 — Informe de cambios

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`CHANGES-nn_AAAAMMDD.md\`. Disparador: \`generar informe de cambios\`. Destinatario: cliente.

Secciones: \`RFC\` abiertas, aprobadas, rechazadas y diferidas del período; impacto acumulado en horas y plazo; documentos que subieron de revisión por cambios; comentarios del cliente aún sin resolver.

## D17 — Acta de revisión de puerta (gate)

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`GATE-nn_<fase>.md\`. Disparador: \`cerrar fase\` (●) o \`aprobar inicio\` (●). Destinatario: patrocinador y cliente.

Secciones: puerta que se evalúa (listo para ejecutar / fin de fase / listo para cerrar); criterios y cumplimiento con evidencia; riesgos y pendientes que pasan a la fase siguiente; condiciones; decisión (\`APROBADA\`, \`APROBADA CON CONDICIONES\`, \`NO APROBADA\`) con firma y fecha. Se registra también como \`DEC-nnn\`.

## D18 — Tablero de una página

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`DASHBOARD.md\` (se sobrescribe; la historia está en los informes). Disparador: \`tablero\`.

Secciones: fase y emisión actuales; próxima puerta y su fecha; semáforo; avance global; horas; hitos próximos (30 días); 3 riesgos principales; incidencias vencidas; cambios abiertos; siguiente frase sugerida. Puede exportarse a PDF.

## D19 — Acta de aceptación

Carpeta \`06_DELIVERABLES/TRANSMITTALS/\`, nombre \`ACC-nnn.md\`. Disparador: \`aceptación firmada\` (●). Destinatario: cliente (firma).

Secciones: entregable aceptado y revisión; criterio de aceptación (\`ACE-nnn\`); evidencia; reservas o excepciones; aceptante, cargo, fecha y firma. Enlaza al \`TR-nnn\` que lo entregó.

## D20 — Registro de revisión del cliente

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`CLIENT_REVIEW-nn.md\`. Disparador: \`comentarios del cliente recibidos\`.

Secciones: documento y revisión revisados; comentarios con clasificación (técnico, documental, de alcance); plazo de respuesta cumplido o no; plazo comprometido para nuestra respuesta; resultado de cada comentario (aceptado, rechazado con motivo, \`RFC\`).

## D22 — Informe de visita a obra

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`SITE_VISIT-nn_AAAAMMDD.md\`. Disparador: \`registrar visita de obra\`.

Secciones: fecha, asistentes, áreas visitadas; observaciones con foto; diferencias con el diseño (se pasan a \`REDLINE_LOG\`); consultas (se pasan a \`SITE_RFI_LOG\`); hallazgos de seguridad; acciones y responsables.

## D25 — Informe final del proyecto

Carpeta \`90_MANAGEMENT/REPORTS/\`, nombre \`PROJECT_END_REPORT.md\`. Disparador: \`generar informe de cierre\`.

## Concepto de Programa

Un **Programa** es un conjunto de Proyectos relacionados gestionados de forma coordinada para obtener beneficios que no serían posibles gestionándolos de manera independiente.

| Criterio | Proyecto | Programa |
|---|---|---|
| Entregables | un conjunto unificado | por proyecto; sinergia entre ellos |
| Equipo | un PM | Programme Manager + un PM por proyecto |
| Contratos | uno o consolidado | contratos separados por proyecto |
| Cronograma | fases coordinadas | timelines distintos con interdependencias formales |
| Beneficio | suma de entregables | beneficio que ningún proyecto produce solo |

> **ℹ️ Regla de escalada:** ante la duda, siga como Proyecto. La escalada es una decisión de gobernanza, no una clasificación técnica.

## Roles

| Rol | Equivalencia | Responsabilidad |
|---|---|---|
| Programme Sponsor | Project Owner | Autoriza el programa; aprueba el Programme Charter |
| Programme Manager | Project Manager | Coordina entre proyectos; gestiona PROAD y PBEN |
| PM de proyecto | Project Manager | Gestiona su proyecto con autonomía (M8) |
| PSC-P | Steering Committee | Decisiones que afectan a más de un proyecto |

# GUÍA DEL ARCHIVO (no editar)

## 1. Objetivo

Definir la estructura de carpetas del framework y de cada proyecto derivado, con **numeración fija y coherente entre las plantillas A a E**, para que cada proyecto se organice siempre del mismo modo y cualquier persona (o Claude) encuentre cada documento en un lugar predecible.

## 2. Alcance

Define carpetas, reglas de uso y casos de aplicación. No define el contenido de los documentos (ver \`DOCUMENT_RULES.md\` y \`DELIVERABLES.md\`).

## 3. Forma de utilización

1. Identificar **cliente** y **tipo de proyecto** (\`PROJECT_INFORMATION.md\`).
2. Seleccionar la plantilla con la tabla 4.1 y **registrar la elección** en \`ASSUMPTIONS_AND_DECISIONS.md\` (DEC-001).
3. Crear solo las carpetas que correspondan; **no renumerar** las carpetas de primer nivel.
4. Si el proyecto cambia de fase (p. ej., de licitación a ingeniería), migrar a la plantilla correspondiente conservando lo existente y registrando el cambio.
5. Los desvíos se registran como decisión.

## 4. Estructura recomendada

### 4.1 Selección de plantilla

| Situación | Plantilla |
|---|---|
| Solo ingeniería (básica y/o detalle), una o varias disciplinas, sin ejecución de obra | **A** |
| Ingeniería + compras + construcción + commissioning + as-built | **B** |
| Preparación de una oferta técnico–económica (licitación) | **C** |
| Ejecución de obra a partir de ingeniería recibida | **D** |
| Cliente con proyectos repetidos y estándares propios | **E** (marco) + A / B / C / D por proyecto |

La plantilla **cambia solo el contenido de \`02_ENGINEERING\` y de \`90_MANAGEMENT\`** (qué subcarpetas existen); los demás primeros niveles son idénticos en todas.

### 4.2 Numeración fija de primer nivel (común a todas las plantillas)

La **ubicación física de un paquete es su estado** en el flujo (\`CLAUDE.md\`): el trabajo avanza de \`03\` a \`07\` y nunca se edita fuera de \`02_ENGINEERING\`.

| N.º | Carpeta | Uso |
|---|---|---|
| \`01\` | \`01_INPUT\` | **Buzón del usuario**: todo lo que Claude debe analizar (ver 4.4); lo nuevo va a \`99_UNCLASSIFIED\` |
| \`02\` | \`02_ENGINEERING\` | Outputs de ingeniería: SLD, MLD, láminas, cálculos — solo lectura para el usuario |
| \`03\` | \`02_ENGINEERING\` | **Único lugar de trabajo**: todo lo que se elabora y se edita (ingeniería, CAD, y según la plantilla, compras, obra y commissioning) |
| \`04\` | \`03_REVIEW\` | Revisión técnica: \`REVIEW_SHEETS/\` (hojas), \`REVIEW_PACKAGES/PQ-nn/\` (paquetes congelados en revisión) y \`Comments/\` |
| \`05\` | \`04_AUDIT\` | Auditoría de la emisión: \`PROJECT_AUDIT.md\` (guía), \`AUDIT_PACKAGES/PQ-nn/\` (conjunto congelado en auditoría), \`AUDIT_REPORTS/\`, \`AUDIT_EVIDENCE/\` y \`AUDIT_REGISTRY/\` |
| \`06\` | \`05_RELEASED\` | \`PQ-nn/\` aprobados por auditoría, listos para emitir, y los registros \`RELEASE_<emisión>\` |
| \`07\` | \`06_DELIVERABLES\` | Emisiones efectivas (IFR, IFA, IFC, AS_BUILT), transmittals y paquetes al cliente. Copia rotulada \`Rev 00\`, no un movimiento |
| \`90\` | \`90_MANAGEMENT\` | Gestión: estado, cambios, supuestos, trazabilidad, LME, planos, lecciones, cronograma, registro de auditorías y la gobernanza del proyecto. Lo que genera Claude aquí es **propuesta hasta que el usuario lo valida** |
| \`98\` | \`98_LIBRARY\` | Normas, equipos y cálculos validados de la oficina (\`STANDARDS\`, \`EQUIPMENT\`, \`CALCULATIONS\`) |
| \`99\` | \`99_CORE\` | El framework: \`CLAUDE.md\`, reglas, guías y estándares. **Ningún documento de proyecto se guarda en \`99_CORE\`** |

En la raíz del proyecto, además: \`CLAUDE.md\` (arranque que importa \`99_CORE/CLAUDE.md\`), \`README.md\`, \`CHANGELOG.md\`, \`.gitignore\` y \`.gitattributes\`.

**Raíz de un proyecto derivado**: los outputs de gestión viven en \`90_MANAGEMENT\`; \`98_LIBRARY\` y \`99_CORE\` se copian al iniciar el proyecto como instantánea; la versión maestra vive en la plantilla maestra y se actualiza mediante \`LESSONS_LEARNED.md\`.

### 4.3 Reglas de nombres de carpetas y archivos

- Primer nivel: \`NN_NOMBRE\` en mayúsculas con guion bajo (\`01_INPUT\` … \`99_CORE\`). Subcarpetas de \`01_INPUT\`: \`NN_MAYUSCULAS\`. Resto: \`Mayusculas_Iniciales_Con_Guion_Bajo\`, sin tildes ni espacios.
- Raíz del proyecto: \`[CLI]_[PRY]_[Description]\`, siempre con los tres campos (ej.: \`ACME_ACM01_Ampliacion_Linea_3\`). \`CLI\` es la sigla del cliente de 3 a 4 letras; \`PRY\` es el código de proyecto de 3 a 6 caracteres (\`DOCUMENT_RULES.md\`, 8.1); un nombre fusionado de más de 6 caracteres (por ejemplo \`TALLER01\`) no es un \`PRY\` válido y se separa en \`CLI\` y \`PRY\` (ej.: \`ROS_TLR01_Taller_Mecanico\`).
- Archivos: \`<código>_Rev<R>.<ext>\` con \`R\` = \`00.0\` (línea base interna), \`00.0.c\`, \`00.n\`, \`00\` (la que ve el cliente; solo en \`06_DELIVERABLES\`), \`01\` (as-built), \`02\`… (ver \`DOCUMENT_RULES.md\`, secciones 8.1 y 9). Las revisiones superadas se archivan con su propio nombre en \`02_ENGINEERING/ARCHIVE/<código>/\`. Excepción: los capítulos de un pliego se nombran \`<NN>_<Name>.md\` dentro de \`TECHNICAL_SPECS\` (RG-18). Insumos de dibujo: \`<código-del-plano>_DIN_Rev<R>.md\`; anexos: \`<código>_Rev<R>_ANX-<n>_<descr>.<ext>\`.
- Carpetas de entrega: \`YYYYMMDD_TR-nnn_Rev00\`; el cliente siempre ve \`Rev 00\` y el transmittal registra la revisión interna (\`00.R.C.FF\`).

### 4.4 Carpeta \`01_INPUT\` (buzón del usuario)

Es el lugar donde el usuario deposita **toda la información de partida**. Claude la analiza completa con \`iniciar proyecto\` (ver \`CLAUDE.md\`, 8.1), **antes** de hacerle preguntas (el único listado va en el \`PROJECT_CHARTER.md\`).

\`\`\`text
01_INPUT/
├── README.md                         (instrucciones de uso del buzón)
├── _INPUT_REGISTER.md          (índice de todo lo recibido y su estado de análisis)
├── 01_CONTRACTS_AND_TENDERS/        (contratos, pliegos, bases, cartas de adjudicación, alcances)
├── 02_REQUIREMENTS/                 (especificaciones técnicas y requisitos del cliente)
├── 03_CLIENT_STANDARDS/             (normas corporativas, CAD, nomenclatura, rótulos, plantillas, proveedores aprobados)
├── 04_EXISTING_DOCUMENTS/           (planos, unifilares, P&ID, layouts, memorias, as-built existentes; en la plantilla D, IFC_Received/)
├── 05_SITE_DATA/                    (relevamientos, fotos, topografía, estudios de suelo, datos ambientales)
├── 06_EQUIPMENT_DATA/               (hojas de datos, catálogos, manuales, certificados)
├── 07_CODES_AND_STANDARDS/          (normas aplicables, reglamentos, permisos, requisitos de aseguradora y bomberos)
├── 08_PREVIOUS_PROJECTS/            (referencias históricas, lecciones aprendidas)
├── 09_COMMUNICATIONS/               (correos, actas, instrucciones confirmadas, consultas recibidas)
└── 99_UNCLASSIFIED/                 (todo lo que el usuario no sabe dónde poner)
\`\`\`

Reglas del buzón:

1. El usuario puede depositar archivos en cualquier subcarpeta, o en \`99_UNCLASSIFIED\` si no sabe dónde.
2. **Claude nunca modifica ni borra los originales.** Puede moverlos desde \`99_UNCLASSIFIED\` a la subcarpeta correcta, registrándolo.
3. Cada archivo se registra en \`_INPUT_REGISTER.md\` con tipo, emisor, fecha, revisión, disciplina, estado de análisis y destino de los datos extraídos.
4. Todo dato que Claude extrae lleva como **fuente** el archivo y, si es posible, la página o sección. Un pedido inicial dado de palabra se transcribe como \`MINUTES-000_Initial_Request.md\` en \`09_COMMUNICATIONS\` y esa acta es la fuente (\`CLAUDE.md\`, 8.1, Fase 1).
5. Claude informa, al analizar: archivos ilegibles, duplicados, revisiones superadas, documentos que se contradicen entre sí y documentos que parecen faltar.
6. El buzón sigue vigente durante todo el proyecto: al iniciar cada sesión Claude revisa si hay **archivos nuevos sin analizar** y lo informa.
7. Las revisiones de documentos del cliente se conservan; la vigente se indica en el registro.
8. Cada subcarpeta del buzón lleva un archivo \`.gitkeep\` para que exista aunque esté vacía; si faltan al copiar la plantilla, Claude las crea con esta estructura.

### 4.5 Flujo de trabajo → emisión y depuración de entrega

**Regla.** Los archivos de trabajo viven en \`02_ENGINEERING\`. El paquete avanza por \`03_REVIEW\`, \`04_AUDIT\` y \`05_RELEASED\`; al emitir, el conjunto se **copia** a \`06_DELIVERABLES\` (limpio, rotulado \`Rev 00\`). El contenido de \`06_DELIVERABLES\` es de **solo lectura**: una corrección se tramita como RFC (\`CHANGE_REQUESTS.md\`), se hace en \`02_ENGINEERING\` y se emite de nuevo con otro \`TR-nnn\`. La auditoría verifica que lo emitido coincida con lo aprobado y esté depurado (\`PROJECT_AUDIT.md\`, A1-16). El movimiento entre etapas lo hacen los scripts de \`99_CORE/SCRIPTS/\` (\`M6\`, 11.2); el estado de cada paquete es su ubicación.

**Estructura de \`06_DELIVERABLES\`** (solo las carpetas que apliquen):

\`\`\`text
06_DELIVERABLES/
├── IFR/                          (emisión interna para revisión; no es carpeta de trabajo)
├── IFA/                          (Emitido para Aprobación; la fase IC / IB / ID / IE consta en el transmittal)
│   └── YYYYMMDD_TR-nnn_Rev00/
│       ├── Documents/           (formato final: PDF u otro acordado)
│       ├── DRAWINGS_PDF/
│       ├── DRAWINGS_DWG/           (DWG depurados)
│       └── TR-nnn.md             (copia del transmittal; el original está en TRANSMITTALS/)
├── IFC/                          (Emitido para Construcción; misma estructura)
├── AS_BUILT/                     (entrega final as-built; misma estructura)
├── TRANSMITTALS/                 (transmittals TR-nnn originales)
├── CLIENT_PACKAGES/              (paquetes presentados al cliente: oferta presentada en la plantilla C, data book, otros)
└── HISTORICAL/          (emisiones superadas)
\`\`\`

**Quién genera qué.** Con la frase \`entregar IFA\` (o \`IFC\`), Claude genera el conjunto de **documentos y listados** (copiados sin comentarios, marcas internas ni metadatos, con la portada y las referencias rotuladas \`Rev 00\`) y el transmittal borrador. El **usuario** depura y exporta los **DWG y PDF de planos**; Claude le entrega la lista de verificación siguiente y confirma que se cumplió. **Solo entran los planos que figuran \`REVIEWED\` en \`90_MANAGEMENT/DRAWING_STATUS.md\`**; los demás se listan como excluidos. La entrega se da por hecha cuando el usuario dice \`entrega enviada TR-nnn\`; después pasa esos planos a \`ENTREGADO\`.

**Pliego técnico (consolidación).** Los capítulos de \`02_ENGINEERING/TECHNICAL_SPECS\` **no se entregan sueltos**: Claude los consolida en orden numérico en un único documento \`<código>_Rev00.md\` dentro de \`Documents/\` de la carpeta de la emisión, con los anexos de \`TECHNICAL_SPECS/Annexes/\` nombrados \`<código>_Rev<R>_ANX-<n>_<descr>.<ext>\`. El procedimiento está en \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`, 4.6, y la auditoría lo verifica en \`PROJECT_AUDIT.md\`, A4-13.

**Lista de verificación de «depuración de entrega»** (referenciada desde \`CAD_STANDARDS.md\`):

| N.º | Verificación | Quién |
|---|---|---|
| DE-01 | \`PURGE\` (todo, anidado) ejecutado: sin capas, bloques, estilos ni tipos de línea sin uso | Usuario |
| DE-02 | \`AUDIT\` con corrección de errores ejecutado, sin errores pendientes | Usuario |
| DE-03 | \`RECOVER\` ejecutado y el archivo abre sin avisos | Usuario |
| DE-04 | \`ETRANSMIT\` o *bind* de xrefs: el DWG entregado no depende de rutas externas del proyecto | Usuario |
| DE-05 | Sin datos de otros proyectos (rótulos, textos, capas, bloques, atributos, rutas de red, nombres de personas ajenas) | Usuario |

| DE-09 | Nombres de archivo y carpeta conforme a \`DOCUMENT_RULES.md\` (\`<código>_Rev<R>.<ext>\`; carpeta \`YYYYMMDD_TR-nnn_Rev00\`) | Claude y usuario |
| DE-10 | Mismos códigos y contenido que lo editable aprobado y la LME (\`DELIVERABLES.md\`), con la revisión interna \`00.R.C.FF\` de cada documento registrada en el transmittal; transmittal completo. En un pliego, el consolidado coincide con \`10_TECHNICAL_SPECS\` (orden, texto y revisión interna) | Claude |

Dentro de \`02_ENGINEERING\`, el pliego técnico vive en \`TECHNICAL_SPECS\`:

## A.4 Reglas de utilización

1. Los documentos en elaboración residen en \`02_ENGINEERING\`; **al emitirse** se copian, depurados (4.5), a \`06_DELIVERABLES/<tipo>/<YYYYMMDD_TR-nnn_Rev00>\` junto con su transmittal. Una corrección se tramita como RFC.

3. El informe de cada auditoría se guarda en \`04_AUDIT/AUDIT_REPORTS\` como \`AUD-nn_YYYYMMDD.md\`; cada informe de avance, en \`90_MANAGEMENT/PROGRESS\` como \`PROGRESS-nn_YYYYMMDD.md\`; el gestor los registra en \`90_MANAGEMENT/AUDIT_REGISTER.md\`.

5. Las revisiones superadas se mueven a \`02_ENGINEERING/ARCHIVE/<código>/\` (conjunto completo, anexos incluidos, estado \`SUPERSEDED\`) al generar la revisión siguiente, sea por un comentario o por una RFC (\`DOCUMENT_RULES.md\`, sección 9). Al pasar de fase, el documento **continúa en su carpeta**.

7. Las fases contratadas no cambian la estructura: la fase de cada documento se registra en la LME (\`DELIVERABLES.md\`) y en su control de revisiones.
8. Claude genera los documentos y listados de la emisión; el usuario depura y exporta DWG y PDF según 4.5. Solo se usan las carpetas de \`06_DELIVERABLES\` que apliquen.
9. **Pliego técnico.** \`TECHNICAL_SPECS\` se crea solo cuando el proyecto lo requiere (4.6, \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`).

      return `<div class="pre-wrap"><button class="copy-btn" onclick="copyCode(this)">Copiar</button><pre><code>${esc}</code></pre></div>`;
    };
    r.table = (header, body) =>
      `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    return r;
  })()
});

// ── STATE ──
let current = null;

// ── NAV BUILD ──
const nav = document.getElementById('sidebar');
ORDER.forEach(key => {
  if (!DOCS[key]) return;
  const btn = document.createElement('button');
  btn.className = 'nav-item';
  btn.textContent = DOCS[key].label;
  btn.dataset.key = key;
  btn.onclick = () => showDoc(key);
  nav.appendChild(btn);
});

// ── RENDER DOC ──

// ── RICH CONTENT PREPROCESSOR ──────────────────────────────────────────────
function enrichHTML(html) {
  // Callout boxes: convert blockquotes that start with specific keywords
  html = html.replace(/<blockquote>\s*<p><strong>(ℹ️[^<]*)<\/strong>([\s\S]*?)<\/p>\s*<\/blockquote>/g,
    (_,title,body) => `<div class="callout callout-info"><div class="callout-icon">ℹ️</div><div class="callout-body"><strong>${title.replace('ℹ️','').trim()}</strong>${body}</div></div>`);
  html = html.replace(/<blockquote>\s*<p><strong>(⚠️[^<]*)<\/strong>([\s\S]*?)<\/p>\s*<\/blockquote>/g,
    (_,title,body) => `<div class="callout callout-warn"><div class="callout-icon">⚠️</div><div class="callout-body"><strong>${title.replace('⚠️','').trim()}</strong>${body}</div></div>`);
  html = html.replace(/<blockquote>\s*<p><strong>(✅[^<]*)<\/strong>([\s\S]*?)<\/p>\s*<\/blockquote>/g,
    (_,title,body) => `<div class="callout callout-tip"><div class="callout-icon">✅</div><div class="callout-body"><strong>${title.replace('✅','').trim()}</strong>${body}</div></div>`);
  html = html.replace(/<blockquote>\s*<p><strong>(🔴[^<]*)<\/strong>([\s\S]*?)<\/p>\s*<\/blockquote>/g,
    (_,title,body) => `<div class="callout callout-crit"><div class="callout-icon">🔴</div><div class="callout-body"><strong>${title.replace('🔴','').trim()}</strong>${body}</div></div>`);
  // Simple blockquotes → info style
  html = html.replace(/<blockquote>([\s\S]*?)<\/blockquote>/g,
    (_,inner) => `<div class="callout callout-info"><div class="callout-icon">ℹ️</div><div class="callout-body">${inner}</div></div>`);
  // Badge in table cells: ● Crítico / ● crítico
  html = html.replace(/<td>(●\s*[Cc]rítico)<\/td>/g,
    '<td><span class="badge badge-critical">● Crítico</span></td>');
  html = html.replace(/<td>(Comando)<\/td>/g,
    '<td><span class="badge badge-cmd">Comando</span></td>');
  html = html.replace(/<td>(Normal)<\/td>/g,
    '<td><span class="badge badge-cmd">Comando</span></td>');
  html = html.replace(/<td>(Decisión)<\/td>/g,
    '<td><span class="badge badge-dec">Decisión</span></td>');
  html = html.replace(/<td>(Consulta)<\/td>/g,
    '<td><span class="badge badge-query">Consulta</span></td>');
  // ● in code spans → critical chip styling hint
  html = html.replace(/<code>([^<]+●[^<]*)<\/code>/g,
    '<code class="critical-cmd">$1</code>');
  return html;
}

function showDoc(key) {
  const doc = DOCS[key]; if (!doc) return;
  current = key;
  // active nav
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  // render
  const raw = marked.parse(doc.content);
  const clean = DOMPurify.sanitize(raw, {USE_PROFILES: {html: true, svg: true, svgFilters: true}});
  document.getElementById('article').innerHTML = enrichHTML(clean);
  document.getElementById('content-title').textContent = doc.label;
  // subtitle = first h2 text
  const h2 = document.getElementById('article').querySelector('h2');
  document.getElementById('content-subtitle').textContent = h2 ? h2.textContent : '';
  document.getElementById('main').scrollTop = 0;
  // persist
  try { localStorage.setItem('wiki-doc', key); } catch(e){}
  // close mobile sidebar
  closeSidebar();
}

// ── COPY BUTTON ──
function copyCode(btn) {
  const code = btn.nextElementSibling.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '¡Copiado!';
    setTimeout(() => btn.textContent = 'Copiar', 1800);
  }).catch(() => {
    const sel = window.getSelection(), range = document.createRange();
    range.selectNodeContents(btn.nextElementSibling.querySelector('code'));
    sel.removeAllRanges(); sel.addRange(range);
  });
}

// ── SEARCH ──
let searchTimer = null;
const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 180);
});
searchInput.addEventListener('focus', () => { if (searchInput.value.trim().length > 1) doSearch(); });
document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) closeSearch();
});

function doSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { closeSearch(); return; }
  const results = [];
  ORDER.forEach(key => {
    const doc = DOCS[key]; if (!doc) return;
    const text = doc.content.toLowerCase();
    let idx = 0, found = 0;
    while ((idx = text.indexOf(q, idx)) !== -1 && found < 3) {
      const start = Math.max(0, idx - 60);
      const end = Math.min(text.length, idx + q.length + 100);
      const snippet = doc.content.slice(start, end).replace(/[#*`]/g,'');
      results.push({ key, label: doc.label, snippet, idx });
      idx += q.length; found++;
    }
  });
  if (results.length === 0) {
    resultsEl.innerHTML = '<div class="sr-empty">Sin resultados para "' + q.replace(/</g,'&lt;') + '"</div>';
  } else {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    resultsEl.innerHTML = results.slice(0, 12).map(r => {
      const snip = r.snippet.replace(re, m => `<mark>${m}</mark>`);
      return `<button class="sr-item" onclick="pickResult('${r.key}')">
        <div class="sr-doc">${r.label}</div>
        <div class="sr-snippet">…${snip}…</div>
      </button>`;
    }).join('');
  }
  resultsEl.classList.add('open');
}

function pickResult(key) {
  closeSearch();
  searchInput.value = '';
  showDoc(key);
}
function closeSearch() { resultsEl.classList.remove('open'); }

// ── THEME ──
const themeBtn = document.getElementById('theme-btn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('wiki-theme', t); } catch(e){}
}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};
try {
  const saved = localStorage.getItem('wiki-theme');
  if (saved) applyTheme(saved);
} catch(e) {}

// ── MOBILE SIDEBAR ──
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); };
overlay.onclick = closeSidebar;
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

// ── INIT ──
let startDoc = 'README';
try { const s = localStorage.getItem('wiki-doc'); if (s && DOCS[s]) startDoc = s; } catch(e){}
showDoc(startDoc);
</script>
