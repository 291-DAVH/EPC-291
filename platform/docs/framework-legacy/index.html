<style>
:root {
  --bg: #f5f7fa; --bg2: #ffffff; --bg3: #edf0f5;
  --sidebar: #111827; --sidebar-hover: #1e2d3d; --sidebar-active: #0ea5e9;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.06);

    --sidebar-text: #6b7d92; --sidebar-text-active: #ffffff;
    --fg: #e6edf3; --fg2: #9aabb8; --fg3: #6b7d92;
    --accent: #38bdf8; --accent2: #818cf8; --accent-light: #0c2d3e;
    --border: #21303d; --code-bg: #1a2332; --code-fg: #cdd9e5;
    --table-stripe: #1a2232; --shadow: 0 2px 8px rgba(0,0,0,.4);

}
:root[data-theme="dark"] {

  --sidebar-text: #6b7d92; --sidebar-text-active: #ffffff;
  --fg: #e6edf3; --fg2: #9aabb8; --fg3: #6b7d92;

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {

  font-size: 15px;
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
#topbar {
  height: var(--topbar-h);
  background: var(--sidebar);
  background-image: linear-gradient(135deg, #080c12 0%, #111827 100%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: 0 1px 0 rgba(14,165,233,.15);
}
#menu-btn {
  display: none;
  background: none; border: none; cursor: pointer;
  color: var(--sidebar-text); padding: 6px; border-radius: 6px;
  line-height: 1;
}
#menu-btn:hover { background: var(--sidebar-hover); color: #fff; }
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--accent);
  letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.logo-icon {
  width: 24px; height: 24px; border-radius: 6px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon svg { width: 13px; height: 13px; fill: #fff; }
.logo span { color: var(--sidebar-text); font-weight: 400; }
#search-wrap {
  flex: 1; max-width: 480px; margin-left: auto;
  position: relative;
}
#search {
  width: 100%;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 8px 12px 8px 36px;
  font-size: 13px; color: #fff;
  font-family: var(--font-sans);
  outline: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
#search::placeholder { color: var(--sidebar-text); }
#search:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 3px rgba(14,165,233,.15);
}
.search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--sidebar-text); pointer-events: none;
}
#theme-btn {
  background: none; border: none; cursor: pointer;
  color: var(--sidebar-text); padding: 6px; border-radius: 6px;
  line-height: 1; flex-shrink: 0;
  transition: background .12s, color .12s;
}
#theme-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

/* ── BODY LAYOUT ── */
#body {
  display: flex; flex: 1; overflow: hidden;
}

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar);
  background-image: linear-gradient(180deg, #080c12 0%, #0f1825 100%);
  display: flex; flex-direction: column;
  overflow-y: auto; flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar-section {
  padding: 22px 14px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.25);
}
.sidebar-divider {
  height: 1px; background: rgba(255,255,255,.05);
  margin: 6px 14px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  width: calc(100% - 12px); margin: 1px 6px;
  background: none; border: none; cursor: pointer;
  text-align: left;
  padding: 7px 10px;
  font-size: 13px; font-family: var(--font-sans);
  color: var(--sidebar-text);
  border-radius: var(--radius-sm);
  transition: background .12s, color .12s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  position: relative;
}
.nav-item::before {
  content: ''; flex-shrink: 0;
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; opacity: .35;
  transition: opacity .12s, background .12s;
}
.nav-item:hover { background: rgba(255,255,255,.05); color: #c8d8e8; }
.nav-item:hover::before { opacity: .6; }
.nav-item.active {
  background: rgba(14,165,233,.12);
  color: var(--sidebar-text-active);
  font-weight: 500;
}
.nav-item.active::before {
  background: var(--accent); opacity: 1; width: 6px; height: 6px;
}

/* ── MAIN ── */
#main {
  flex: 1; overflow-y: auto; background: var(--bg);
  display: flex; flex-direction: column;
}
#content-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 20px 48px 18px;
  display: flex; align-items: flex-start; gap: 14px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  position: relative;
}
#content-header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
  opacity: .5;
}
#content-title {
  font-size: 21px; font-weight: 700; letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--fg) 0%, var(--fg2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
#content-subtitle { font-size: 13px; color: var(--fg3); margin-top: 3px; }
#article {
  padding: 36px 48px 72px;
  max-width: 920px;
  min-width: 0;
}

/* ── SEARCH RESULTS OVERLAY ── */
#search-results {
  position: absolute; top: calc(var(--topbar-h) + 6px); right: 0;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
  width: 580px; max-height: 460px; overflow-y: auto;
  z-index: 200; display: none;
}
#search-results.open { display: block; }
.sr-item {
  display: block; width: 100%; background: none; border: none;
  cursor: pointer; text-align: left;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-family: var(--font-sans);
  transition: background .1s;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--accent-light); }
.sr-doc {
  font-size: 10px; font-weight: 700; color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em;
}
.sr-snippet { font-size: 13px; color: var(--fg2); margin-top: 4px; line-height: 1.55; }
.sr-snippet mark {
  background: var(--accent-light); color: var(--accent);
  border-radius: 3px; padding: 1px 3px;
}
.sr-empty { padding: 20px 16px; font-size: 13px; color: var(--fg3); }

/* ── MARKDOWN STYLES ── */
#article h1 {
  font-size: 1.8rem; font-weight: 800; margin: 0 0 .6em;
  letter-spacing: -.03em; color: var(--fg);
  text-wrap: balance;
}
#article h2 {
  font-size: 1.2rem; font-weight: 700; margin: 2.2em 0 .7em;
  padding: .5em 0 .5em 1em;
  border-left: 3px solid var(--accent);
  background: linear-gradient(90deg, var(--accent-light) 0%, transparent 100%);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--fg); text-wrap: balance;
}
#article h3 {
  font-size: 1.05rem; font-weight: 600; margin: 1.8em 0 .55em;
  color: var(--fg); text-wrap: balance;
}
#article h4 {
  font-size: .95rem; font-weight: 600; margin: 1.5em 0 .45em;
  color: var(--fg2); text-wrap: balance;
}
#article p { line-height: 1.8; margin-bottom: 1.1em; color: var(--fg2); max-width: 70ch; }
#article ul, #article ol { margin: .5em 0 1.1em 1.5em; }
#article li { line-height: 1.75; color: var(--fg2); margin-bottom: .3em; }
#article a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .12s; }
#article a:hover { border-bottom-color: var(--accent); }
#article strong { font-weight: 600; color: var(--fg); }
#article em { color: var(--fg2); }
#article blockquote {
  border-left: 3px solid var(--accent2);
  margin: 1.2em 0; padding: .7em 1.1em;
  background: var(--bg3); border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--fg2);
}
#article hr {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, var(--accent) 0%, transparent 70%);
  margin: 2.2em 0; opacity: .3;
}
#article code {
  font-family: var(--font-mono); font-size: .84em;
  background: var(--code-bg); color: var(--accent);
  padding: .2em .45em; border-radius: var(--radius-sm);
  border: 1px solid rgba(14,165,233,.15);
}
.pre-wrap {
  position: relative; margin: 1.2em 0; overflow-x: auto;
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.pre-wrap pre {
  margin: 0; padding: 18px 20px;
  background: var(--code-bg); border-radius: var(--radius);
  font-family: var(--font-mono); font-size: .83em; line-height: 1.65;
  color: var(--code-fg); white-space: pre; overflow-x: auto;
}
.pre-wrap pre code {
  background: none; padding: 0; border-radius: 0;
  font-size: inherit; color: inherit; border: none;
}
.copy-btn {
  position: absolute; top: 10px; right: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--fg3); font-size: 11px; padding: 4px 9px;
  border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans);
  transition: background .12s, color .12s, border-color .12s;
  font-weight: 500;
}
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.table-wrap { overflow-x: auto; margin: 1.2em 0; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
#article table { border-collapse: collapse; min-width: 100%; font-size: .9em; }
#article th {
  background: var(--bg3); font-weight: 700; text-align: left;
  padding: 10px 16px; border: 1px solid var(--border);
  color: var(--fg); font-size: .82em; letter-spacing: .04em;
  text-transform: uppercase;
}
#article td { padding: 9px 16px; border: 1px solid var(--border); color: var(--fg2); vertical-align: top; line-height: 1.6; }
#article tr:nth-child(even) td { background: var(--table-stripe); }
#article tr:hover td { background: var(--accent-light); transition: background .1s; }
#article img { max-width: 100%; border-radius: var(--radius); margin: .6em 0; box-shadow: var(--shadow-sm); }

/* ── RESPONSIVE ── */
#sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 50;
  backdrop-filter: blur(2px);
}
@media (max-width: 640px) {
  #menu-btn { display: flex; }
  #sidebar {
    position: fixed; top: var(--topbar-h); left: 0;
    height: calc(100% - var(--topbar-h));
    z-index: 60; transform: translateX(-100%);
    transition: transform .2s ease;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay.open { display: block; }
  #content-header { padding: 16px 20px; }
  #article { padding: 22px 20px 52px; }
  #search-results { width: calc(100vw - 32px); right: 16px; }
}

/* ── CALLOUTS ── */
.callout {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; margin: 1.3em 0;
  border-radius: var(--radius); font-size: .92em; line-height: 1.65;
}
.callout-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
.callout-body { flex: 1; color: var(--fg2); }
.callout-body strong { display: block; margin-bottom: 3px; font-weight: 600; }
.callout-info { background: var(--accent-light); border-left: 3px solid var(--accent); }
.callout-info .callout-icon { color: var(--accent); }
.callout-warn { background: #fffbeb; border-left: 3px solid #f59e0b; }
.callout-warn .callout-icon { color: #d97706; }
.callout-tip  { background: #f0fdf4; border-left: 3px solid #22c55e; }
.callout-tip  .callout-icon { color: #16a34a; }
.callout-crit { background: #fff1f2; border-left: 3px solid #ef4444; }
.callout-crit .callout-icon { color: #dc2626; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  .callout-warn { background: #291e07; border-color: #b45309; }
  .callout-tip  { background: #071c10; border-color: #15803d; }
  .callout-crit { background: #1f0a0a; border-color: #dc2626; }
}}
:root[data-theme="dark"] {
  .callout-warn { background: #291e07; border-color: #b45309; }
  .callout-tip  { background: #071c10; border-color: #15803d; }
  .callout-crit { background: #1f0a0a; border-color: #dc2626; }
}

/* ── COMMAND CHIPS ── */
.cmd-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: .82em; font-weight: 500;
  padding: 3px 9px; border-radius: 20px;
  background: var(--bg3); color: var(--accent);
  border: 1px solid rgba(14,165,233,.25);
  white-space: nowrap;
}
.cmd-chip.critical {
  background: rgba(239,68,68,.08); color: #ef4444;
  border-color: rgba(239,68,68,.3);
}
.cmd-chip.decision {
  background: rgba(99,102,241,.08); color: var(--accent2);
  border-color: rgba(99,102,241,.3);
}
.badge {
  display: inline-block; font-size: .73em; font-weight: 700;
  padding: 2px 7px; border-radius: 20px; vertical-align: middle;
  letter-spacing: .03em;
}
.badge-critical { background: rgba(239,68,68,.12); color: #ef4444; border: 1px solid rgba(239,68,68,.25); }
.badge-cmd      { background: rgba(14,165,233,.1);  color: var(--accent); border: 1px solid rgba(14,165,233,.2); }
.badge-dec      { background: rgba(99,102,241,.1);  color: var(--accent2); border: 1px solid rgba(99,102,241,.2); }
.badge-query    { background: rgba(107,114,128,.1); color: var(--fg3); border: 1px solid var(--border); }

/* ── SVG DIAGRAM CONTAINER ── */
.diagram {
  margin: 1.6em 0; text-align: center;
  overflow-x: auto;
}
.diagram svg { max-width: 100%; height: auto; }

/* ── FEATURE GRID ── */
.feat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
  gap: 14px; margin: 1.4em 0;
}
.feat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s, border-color .15s;
}
.feat-card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.feat-card-icon { font-size: 22px; margin-bottom: 8px; }
.feat-card-title { font-weight: 600; font-size: .9em; color: var(--fg); margin-bottom: 4px; }
.feat-card-desc { font-size: .83em; color: var(--fg3); line-height: 1.55; }

/* ── STEP LIST ── */
.step-list { list-style: none; margin: 1em 0 1.3em; padding: 0; counter-reset: steps; }
.step-list li {
  counter-increment: steps;
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  color: var(--fg2); font-size: .92em; line-height: 1.6;
}
.step-list li:last-child { border-bottom: none; }
.step-list li::before {
  content: counter(steps);
  flex-shrink: 0; width: 24px; height: 24px;
  border-radius: 50%; background: var(--accent); color: #fff;
  font-size: .78em; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
</style>

Esta guía le explica, en el orden en que ocurre, todo el recorrido de un proyecto con el framework: desde la primera frase hasta el cierre. Está escrita para una persona inteligente que no recuerda los nombres de los archivos.

## Qué es el framework en una página

Antes de entrar en el detalle de los archivos, estados y comandos, conviene entender la lógica general del framework.

El objetivo es que un proyecto de ingeniería pueda avanzar de forma ordenada, verificable y sin contradicciones, incluso cuando intervienen múltiples documentos, revisiones, decisiones y cambios. En concreto, busca evitar tres problemas conocidos: la información contradictoria entre documentos, los cambios sin control y la documentación difícil de rastrear.

El framework es un método para que un proyecto de ingeniería avance por pasos chicos, verificables y sin contradicciones. Se apoya en seis conceptos.

Todo el sistema descansa sobre estos seis principios, que se mantienen durante todo el proyecto. Cada uno se presenta con la idea general y, a continuación, cómo funciona en la práctica.

### Línea base como fuente única

Si cada documento repitiera sus propios datos, tarde o temprano dos de ellos dirían cosas distintas. Por eso el framework define cada dato en un solo lugar y obliga a todo lo demás a remitirse a él.

En la práctica: al iniciar, Claude vuelca la definición formal del proyecto en un archivo por función (\`STARTING_DATA.md\`, \`PROJECT_SCOPE.md\`, \`GOALS.md\`, \`CLIENT_REQUIREMENTS.md\`, \`PROJECT_INFORMATION.md\`) y las consolida en el \`PROJECT_CHARTER.md\`. Usted lo aprueba y queda como línea base 1.0. Ningún documento puede contradecirla sin una decisión registrada (\`DEC-nnn\`). Cada dato se define en un solo lugar.

### Paquete de revisión (\`PQ-nn\`)

Revisar veinte documentos de una vez es la forma más segura de dejar pasar errores. El framework propone el camino opuesto: avanzar de a poco, con piezas chicas que usted puede juzgar completas.

En la práctica: Es la unidad de trabajo y de revisión: un documento o un grupo pequeño (normalmente de 1 a 3) que van de la mano, por ejemplo una memoria de cálculo y su síntesis. Claude desarrolla un paquete, se detiene y usted lo revisa. No se empieza un paquete hasta que los paquetes de los que depende estén \`REVIEWED\`.

### Revisión del usuario frente a auditoría

Revisar y auditar parecen lo mismo, pero responden preguntas distintas y las hacen roles distintos. Separarlas evita que quien redacta se controle a sí mismo.

En la práctica: La revisión es suya y es por paquete: «¿esto es lo que quiero y es técnicamente correcto?» (es el **IFR**, la emisión interna). La auditoría es de Claude en el rol de auditor independiente, se hace una vez por emisión (cada IFA y la IFC) sobre lo nuevo y modificado de los paquetes revisados: «¿está demostrado y es coherente?». Usted la aprueba con \`aprobar auditoría\`; con eso el conjunto queda «aprobado internamente» y puede salir al cliente.

### Revisiones del documento

El control de revisiones responde una pregunta práctica: qué versión de cada documento tiene cada persona. El framework la contesta con una regla simple, que distingue el trabajo interno de lo que ve el cliente.

En la práctica: Todo documento nace en \`Rev 00.0.0\` (línea base interna). La revisión interna tiene tres números más el sufijo de la fase, \`00.R.C.FF\` (por ejemplo \`00.2.34.IB\`: Ingeniería Base, última RFC n.º 2, 34 comentarios incorporados; las fases son \`IC\` Conceptual, \`IB\` Base, \`ID\` Detalle e \`IE\` Ejecutiva, y el as-built no lleva sufijo). Al pasar de fase **cambia solo el sufijo** (\`00.2.34.IB\` → \`00.2.34.ID\`), sin sumar números. **cada comentario que se incorpora suma 1 al último dígito** (\`00.0\` → \`00.0.1\` → \`00.0.2\`), venga del cliente, de su jefe, suyo o de la auditoría; **cada RFC fija el dígito del medio** con su número (\`RFC-001\` → \`00.1\`, y el último dígito vuelve a 0). Así la revisión dice, sin abrir el archivo, cuántos comentarios llevó y cuántos cambios de fondo tuvo. Ya no hay borradores: toda versión nueva es una revisión, y la superada se archiva con su nombre. El cliente **siempre** ve \`Rev 00\`: lo que cambia entre emisiones lo distinguen el transmittal (\`TR-nnn\`, que anota la revisión interna entregada) y la tabla de control de revisiones. \`Rev 01\` es el as-built de todo el proyecto; \`Rev 02\`, \`03\`… son las modificaciones posteriores.

### Fases de ingeniería y emisiones al cliente

La ingeniería madura por fases (Conceptual \`IC\`, Básica \`IB\`, Detalle \`ID\`, Ejecutiva \`IE\` y As-Built \`ASB\`). Cada documento es **el mismo archivo** en todas las fases: evoluciona, no se copia. Cada fase repite la misma secuencia y la emisión sale al cliente solo cuando está aprobada internamente.

En la práctica: **IFR** es la revisión interna por paquete (suya, repetible); **IFA** es la emisión al cliente para aprobación; **IFC** libera para construir al terminar la Ejecutiva (no es una aprobación documental). **Cada emisión tiene su propia auditoría.** Una emisión solo sale de un proyecto \`AUDITED\`: Claude arma el paquete limpio (\`entregar IFA\`), usted depura los DWG y los PDF, envía y confirma con \`entrega enviada TR-nnn\`; recién entonces el proyecto pasa a \`IFA\` o \`IFC\`, esperando al cliente. Todo comentario del cliente vuelve **siempre** a su revisión interna (IFR) y a una auditoría de lo cambiado antes de reemitirse. Cuando el cliente aprueba (\`cliente aprueba\`), se dispara la fase siguiente: Conceptual → Básica → Detalle → Ejecutiva, y la Ejecutiva, siempre actualizada, es la base del as-built. Lo emitido vive en \`06_DELIVERABLES\`, limpio y de solo lectura.

### El estado es dónde está el paquete

Un paquete de revisión no tiene una etiqueta de estado que alguien deba actualizar: **su estado es la carpeta en la que está**. Se trabaja en \`02_ENGINEERING\`; al terminarlo pasa a \`03_REVIEW\` (usted lo revisa), después a \`04_AUDIT\`, después a \`05_RELEASED\` (aprobado internamente) y, al emitirlo, queda una copia rotulada \`Rev 00\` en \`06_DELIVERABLES\`. Claude mueve los paquetes con scripts de \`99_CORE/SCRIPTS/\` cuando usted dice la frase fija correspondiente; usted no mueve archivos. Cada paquete queda congelado con una huella de sus archivos: si alguien lo modifica fuera de \`02_ENGINEERING\`, el flujo se detiene y el paquete vuelve a Ingeniería. **Solo un resultado \`APPROVED\` avanza**; cualquier otro (\`APPROVED_WITH_COMMENTS\`, \`REJECTED\`, \`REJECTED_WITH_COMMENTS\`) devuelve el paquete a Ingeniería y el ciclo se repite completo. Para los planos, usted entrega el DWG con sus XREF y el PDF: viajan juntos (así nadie modifica el DWG durante la revisión) y Claude revisa solo el PDF.

### Frases fijas

Para que ni usted ni Claude tengan que adivinar qué se quiso decir, los puntos de control se gobiernan con un vocabulario corto y estable.

En la práctica: Usted gobierna el proyecto con frases fijas de dos tipos: **comandos** (inician trabajo de Claude, como \`desarrollar paquete\`) y **decisiones** (sus respuestas en los puntos de control, como \`revisión aprobada\` o \`aprobar auditoría\`). Claude entiende lenguaje natural, pero antes de cambiar un estado repite la frase fija que entendió y el estado resultante; los cambios críticos solo se ejecutan con la frase exacta o su confirmación, y ante una duda Claude pregunta. El estándar completo, con la tabla «punto de control → frase esperada → efecto», está en \`COMMANDS.md\`.

Con estos seis principios en mente, los mapas siguientes muestran dónde vive cada cosa.

## Quién hace qué

Antes de empezar a recorrer las etapas, conviene tener claro quién interviene en un proyecto y qué le corresponde a cada uno.

Cada participante tiene responsabilidades claramente definidas. Claude asiste, el usuario decide, el auditor verifica y el cliente revisa. Que estén separadas no es un detalle formal: evita que una misma persona (o rol) redacte, controle y apruebe su propio trabajo.

La tabla siguiente responde qué hace y qué nunca hace cada actor.

Tabla: Reparto de responsabilidades

| Actor | Qué hace | Qué nunca hace |
|---|---|---|
| Claude | Analiza el buzón, llena las fuentes, presenta el charter con la línea base y el plan de paquetes, desarrolla un paquete por vez, hace el autocontrol, entrega la hoja de revisión, procesa comentarios, registra cambios, calcula el cronograma, arma insumos de dibujo, verifica los planos recibidos, prepara la carpeta de entrega | Dar por revisado un paquete, pasar a auditoría sin su frase, aprobar su propia auditoría, modificar el estado de un plano en \`DRAWING_STATUS.md\`, desarrollar dos paquetes a la vez sin su autorización, inventar datos técnicos, firmar o certificar |
| Usted | Completa los datos de partida, deposita información, responde las preguntas del charter y lo aprueba, revisa cada paquete y lo cierra, decide los cambios, dibuja los planos DWG y mantiene su estado en \`DRAWING_STATUS.md\`, aprueba la auditoría, depura DWG y PDF, decide entregar y confirma el envío, firma como responsable | Pedir documentos sueltos fuera de la LME |
| Auditor (rol de Claude) | Audita una vez por entrega (A1 a A5) con evidencia, emite el informe \`AUD-nn\` y el informe de avance \`PROGRESS-nn\`, propone el estado resultante | Modificar documentos o archivos de gestión, diseñar la solución, aprobar su propio trabajo |
| Cliente | Aporta información, revisa y comenta lo emitido (IFA), aprueba cada fase (lo que dispara la siguiente) y pide cambios; sus comentarios vuelven siempre a revisión interna antes de reemitirse | Nada de lo anterior ocurre sin que usted lo registre |

La firma, la matrícula y la aprobación contractual son siempre humanas. Claude prepara, verifica y audita.

## El recorrido completo en el tiempo

Visto desde arriba, todos los proyectos recorren siempre el mismo camino.

Primero se recopila información. Después se construye la línea base. Luego se desarrolla la ingeniería, paquete por paquete. Más adelante se revisa, se audita y se entrega. Finalmente se incorporan los comentarios del cliente, se genera la documentación final y se cierra el proyecto.

El diagrama siguiente muestra ese camino con el estado del proyecto en cada etapa y la frase que usted dice para pasar a la siguiente.

Cada línea es una etapa. A la derecha, el estado del proyecto y, entre corchetes, lo que usted dice.

Iniciar proyecto (Fases 1 a 4)                                   PLANNING   [iniciar proyecto, aprobar charter]

   todo OK          -> paquete REVIEWED, sigue el próximo        ENGINEERING [revisión aprobada, siguiente paquete]

## Paso a paso detallado

Hasta aquí vio el mapa general. Ahora se recorre cada etapa en detalle, en el mismo orden en que ocurre en un proyecto real.

Todas las etapas se presentan de la misma manera: primero qué es la etapa y por qué existe, después qué hace usted y qué hace Claude.

Cada etapa dice qué hace usted, qué hace Claude, qué archivos aparecen, qué le va a preguntar, qué debe revisar, cómo sabe que terminó y los errores típicos.

### Paso: Preparar el proyecto y depositar información

Todo proyecto empieza con material: el contrato, un pliego del cliente, un croquis, un correo. Esta etapa consiste en declarar los datos básicos y poner el material donde Claude pueda leerlo. No hay cuestionario en el chat: usted lo completa una vez, en un archivo.

Existe porque lo que está en archivos no se pierde, y lo que solo se dijo por el chat sí. No hace falta ordenar ni completar todo: el framework está pensado para arrancar con información incompleta.

A continuación se indica qué hace cada uno en esta etapa.

- **Usted:** duplica la carpeta de la plantilla maestra y le pone el nombre del proyecto (formato sugerido \`[CLI]_[PRY]_[Description]\`, por ejemplo \`ROS_TLR01_Taller_Mecanico\`); completa \`STARTING_DATA.md\` (casillas ya marcadas con los valores por defecto: pliego para licitación, electricidad, fases Conceptual y Base, 120 horas hábiles de ingeniería, solo ingeniería); y copia sus documentos a \`01_INPUT/99_UNCLASSIFIED\`, sin ordenarlos. Si el encargo es solo verbal, no hace falta archivo: puede escribirlo en las notas libres de \`STARTING_DATA.md\`. También puede trabajar en la maestra: Claude hace la copia con el nombre indicado.
- **Claude:** nada todavía. Si abre una sesión nueva, recuerda al final del primer mensaje que puede escribir \`ayuda\` o \`comandos\`.
- **Archivos:** \`STARTING_DATA.md\` y sus documentos en el buzón. \`README.md\` explica qué va en cada subcarpeta.
- **Le pedirá:** nada.
- **Revise:** que estén las revisiones vigentes del cliente. Si tiene varias revisiones del mismo documento, deje todas. Los campos obligatorios de \`STARTING_DATA.md\` son nombre de carpeta, cliente, sigla y código; si faltan, Claude pregunta solo esos.
- **Terminó cuando:** los datos de partida están completos y el material está en el buzón. Con buzón vacío igual puede iniciar: el charter traerá el listado completo de preguntas.
- **Errores típicos:** esperar a «ordenar» antes de iniciar (no hace falta); dejar información confidencial que no corresponde al proyecto. **Costos, presupuestos y precios del cliente:** si un documento los trae, Claude los trata como confidenciales (no los transcribe ni los usa en ningún archivo; solo anota que el documento los contiene), salvo que usted pida expresamente lo contrario (\`DOCUMENT_RULES.md\`, RG-21).

### Paso: Iniciar el proyecto

Iniciar el proyecto es convertir un pedido todavía difuso en una definición formal sobre la que se va a trabajar. Claude lee sus datos de partida y lo que usted dejó, llena cada archivo en su lugar y le presenta **una sola cosa para aprobar**: el Project Charter.

Existe para que la ingeniería arranque desde datos confirmados y no desde suposiciones. Todo lo que se defina aquí es la fuente única de verdad del resto del proyecto.

Son cuatro fases seguidas, que se describen una por una a continuación.

- **Usted dice:** \`iniciar proyecto\` (también \`nuevo proyecto\` o \`arrancar proyecto\`), con \`STARTING_DATA.md\` completado y el material en el buzón. Después contesta las preguntas del charter y dice \`aprobar charter\`. Es su único punto de control hasta que quiera empezar a desarrollar.
- **Claude hace:** lee los datos de partida (si faltan carpeta, cliente, sigla o código, los pregunta juntos), analiza todo el buzón, llena cada fuente en su archivo y le presenta el \`PROJECT_CHARTER.md\`. Usted no responde cuestionarios intermedios.
- **Estado al terminar:** \`PLANNING\`. Claude no empieza la ingeniería hasta que usted diga \`desarrollar paquete\` o \`siguiente paquete\`.

#### Datos de partida y ubicación del proyecto (Paso 1)

- **Claude hace:** lee \`STARTING_DATA.md\`. Si la carpeta de trabajo no se llama como el nombre indicado (usted trabajó en la maestra), crea una copia nueva con ese nombre que incluye sus datos y su documentación: los archivos de arranque de la raíz, \`90_MANAGEMENT/\` (con \`DRAWING_STATUS.md\` y \`AUDIT_REGISTER.md\`), \`03_REVIEW/\`, \`04_AUDIT/\`, \`99_CORE/\`, \`98_LIBRARY/\` completa y \`01_INPUT/\`. Esta guía no se copia. Crea \`02_ENGINEERING\` y el resto de las carpetas de la plantilla en la misma raíz y anota en \`PROJECT_INFORMATION.md\` (sección A) la ruta de la maestra y la versión de la plantilla con que parte el proyecto.
- **Usted:** nada, salvo contestar los datos obligatorios que falten.
- **Error típico:** trabajar sobre la maestra sin copiarla y dejar allí los datos de otro proyecto. Lo normal es duplicar la plantilla antes de completar nada.

#### Análisis del buzón (Fase 1)

Antes de preguntarle nada, Claude lee todo lo que usted depositó. Así evita hacerle preguntas cuya respuesta ya está en un documento.

- **Claude hace:** lee todo el buzón, mueve cada archivo de \`99_UNCLASSIFIED\` a su subcarpeta, completa \`_INPUT_REGISTER.md\` sin tocar los originales y señala duplicados, revisiones superadas, archivos ilegibles, documentos que se contradicen y documentos que parecen faltar. Si el pedido llegó por el chat, lo transcribe como \`MINUTES-000_Initial_Request.md\` en \`09_COMMUNICATIONS\` y lo cita como fuente.
- **Revise (en el charter):** que cada dato extraído sea correcto. Corrija lo que esté mal con \`corregir charter: …\`.
- **Errores típicos:** dejar pasar un dato mal leído de un documento escaneado.

#### Llenado de las fuentes (Fase 2)

Claude vuelca cada dato en el único archivo que le corresponde, con su fuente y su estado: hechos técnicos en \`PROJECT_INFORMATION.md\`; alcance, exclusiones y criterios de aceptación en \`PROJECT_SCOPE.md\`; objetivos en \`GOALS.md\`; requisitos en \`CLIENT_REQUIREMENTS.md\`. No le pregunta nada en esta fase: lo que falta se marca \`[DEFINIR]\`, abre una \`INF-nnn\` y se agrega a la lista de consultas pendientes de \`PROJECT_STATUS.md\` (sección K), clasificada por destinatario (Cliente o Ingeniería).

Los bloques que debe cubrir están fijados por el framework (\`M3\`, Fase 2); las preguntas exactas las formula Claude según lo que falte. Estas son las que suelen aparecer, agrupadas.

Tabla: Preguntas típicas del charter

| Bloque | Qué le puede preguntar |
|---|---|
| Información general | Nombre y descripción del proyecto. Ubicación. Tipo de proyecto (¿solo ingeniería?, lo que decide la plantilla de carpetas). Disciplina principal. Si el IFA se emite al cierre de cada fase. ¿Hay proyectos históricos del cliente? |
| Información técnica | Tensión y frecuencia del suministro. Potencia disponible en la acometida. Nivel de cortocircuito. Régimen de neutro. Ubicación del tablero y distancia al medidor. Condiciones ambientales y áreas clasificadas. Reglamentación y normas aplicables, con edición. Parámetros de cada disciplina que aplique |
| Alcance | Por disciplina: qué incluye suministro, construcción, montaje y ensayos, y qué queda excluido. Interfaces con terceros |
| Requisitos del cliente | Listas de marcas, estándar CAD, codificación y formatos del cliente. Requisitos de seguridad, operación y mantenimiento. Restricciones de operación |
| Entregables | Detalle de lo marcado en los datos de partida: formato y medio de entrega. Hitos (el IFA de cada fase, \`IFC\`) |
| Criterios de aceptación | FAT, SAT, pruebas funcionales y de protecciones, ensayos, capacitación, puesta en marcha, entrega documental |

Cómo responder (en el mismo mensaje en que aprueba el charter):

- **Si lo sabe:** conteste en una frase, por número. Claude lo registra en el archivo que corresponde y cita su respuesta como fuente.
- **Si no lo sabe:** escriba «no sé / pendiente». El proceso no se detiene: queda \`[DEFINIR]\` con su \`INF-nnn\`.
- **Si tiene dudas sobre un valor:** diga «lo creo, pero no estoy seguro». Claude lo marca \`[VERIFICAR]\`.
- **Error típico:** inventar una respuesta para no dejar un hueco. Un dato inventado contamina todos los cálculos; un pendiente es barato.

#### Project Charter y línea base (Fase 3)

Claude junta todo en una ficha de una o dos páginas que usted aprueba. Es el punto donde la información dispersa se transforma en una definición del proyecto. El charter no agrega datos: cada línea cita el archivo o el ID de donde sale.

- **Claude hace:** genera \`PROJECT_CHARTER.md\` (resumen ejecutivo, caso de negocio, alcance dentro y fuera, criterios de éxito y de aceptación, necesidades, entregables, restricciones, supuestos, **riesgos iniciales**, costo en \`[DEFINIR]\`, plazo e hitos, recursos, enfoque, gobierno, **plan de paquetes de la fase de inicio**, **preguntas pendientes** —el único listado del arranque— y el registro de la línea base) y, de la misma información, \`PROJECT_CHARTER_EXECUTIVE.md\`: una página para la dirección.
- **Duraciones propuestas** (solo si en \`STARTING_DATA.md\` eligió «Ingeniería + gestión del proyecto»; en el modo por defecto, «Solo ingeniería y trazabilidad documental», no hay duraciones ni cronograma): la duración segura por tipo de entregable (valores de partida de \`SCHEDULE_CCPM.md\`, ajustados a la cantidad de entregables y recursos), el plazo resultante frente al límite contractual y, si hay déficit, tres opciones: recortar duraciones o alcance, plazo nuevo, o más recursos.
- **Usted:** responde las preguntas pendientes por número y aprueba con \`aprobar charter\` (o pide ajustes con \`corregir charter: …\`, incluidas las duraciones y el orden de los paquetes; si hay déficit, elige una opción y queda como \`DEC\`).
- **Revise:** que el alcance diga lo que se acordó, que las exclusiones sean explícitas, que el orden de los paquetes tenga sentido y que los pendientes (\`INF-nnn\`) estén en la lista.
- **Efecto:** al aprobar, la definición queda como línea base 1.0 y es la fuente de verdad. Si después cambia una fuente, el charter se regenera con una nueva versión.
- **Error típico:** aprobar sin leer las exclusiones; después, lo excluido reaparece como cambio.

#### Generación automática (Fase 4)

Aprobado el charter, el trabajo de armado es mecánico y Claude lo hace sin consultarle cada paso. El plan de paquetes de la fase de inicio ya lo aprobó dentro del charter.

Solo ocurre tras \`aprobar charter\`. Claude, sin preguntarle:

1. Elige la plantilla de carpetas y registra \`DEC-001\`; crea la estructura.
2. Inicializa los archivos de gestión con lo obtenido y registra las decisiones iniciales (\`DEC-001\` a \`DEC-004\`) y los supuestos (\`SUP-nnn\`, siempre con su base del valor).
3. Marca la columna *Aplica* de \`ENGINEERING_STANDARDS.md\` y revisa \`DESIGN_RULES.md\` (si el proyecto necesita reglas \`[DEFINIR]\`, lo anota).
4. Carga la Lista Maestra de Entregables en \`DELIVERABLES.md\`, con aplicabilidad justificada.
5. Divide en paquetes según el **Plan de paquetes** que usted aprobó en el charter (orden, paquete, documentos, depende de) y lo carga en \`DELIVERABLES.md\`; la aprobación queda como \`DEC-nnn\`. El plan de cada fase siguiente se propone tras \`cliente aprueba\` y se confirma con \`aprobar plan de paquetes\` o \`cambiar plan de paquetes: …\`.
6. Propone las filas de planos y diagramas en \`DRAWING_STATUS.md\` (estado \`PLANNED\`), genera la matriz de trazabilidad inicial y el cronograma CCPM borrador, y registra las normas relevantes como \`NOR-nnn\` en \`PROJECT_INFORMATION.md\` (sección G).
7. Le entrega la lista de consultas pendientes y el primer paquete propuesto.

- **Archivos que aparecen o cambian:** casi todos los de \`90_MANAGEMENT\`, \`90_MANAGEMENT/Planning/ccpm_input.json\` y la salida del cronograma, las carpetas de la plantilla.
- **Revise:** el Plan de paquetes. Pregúntese: ¿el orden tiene sentido?, ¿ningún paquete es demasiado grande para revisar de una vez?, ¿los cálculos van antes que los documentos que los citan? Si un paquete es muy grande, dígalo y Claude lo divide.
- **Terminó cuando:** Claude informa estado \`PLANNING\`, el plan de paquetes aprobado y el primer paquete propuesto.
- **Error típico:** querer que Claude empiece a redactar sin confirmar el plan.

### Paso: Generar el cronograma

**Este paso es opcional.** Solo aplica si eligió «Ingeniería + gestión del proyecto» en \`STARTING_DATA.md\` (sección 7). Con el modo por defecto, «Solo ingeniería y trazabilidad documental», no hay cronograma, buffers ni control de plazos, y el foco queda en la ingeniería; si más adelante lo necesita, diga \`activar gestión del proyecto\`.

El cronograma responde cuándo estará listo cada paquete y cuánto margen tiene el proyecto. Se calcula por cadena crítica (CCPM): en lugar de repartir un colchón en cada tarea, se concentra en un buffer compartido que protege la fecha final.

Esto existe porque las fechas hechas a mano suelen ser optimistas y no avisan cuando se están perdiendo. Claude no calcula fechas a mano: usa una herramienta validada.

Veamos cómo se pide y qué debe revisar usted.

- **Usted dice:** \`generar cronograma\` (o \`actualizar cronograma\` más adelante). La primera vez ya ocurre dentro de la Fase 4.
- **Claude hace:** arma la lista de tareas desde la LME, ejecuta \`98_LIBRARY/CALCULATIONS/ccpm.py\` (nunca calcula fechas a mano) y escribe \`SCHEDULE_CCPM.md\` con la cadena crítica, los buffers y el Plan de paquetes (sección B2). La revisión suya es una tarea propia por paquete, con duración a confirmar.
- **Archivos:** \`90_MANAGEMENT/Planning/ccpm_input.json\`, \`ccpm_output.md\`, \`ccpm_output.json\` y \`SCHEDULE_CCPM.md\`.
- **Le pedirá:** confirmar duraciones y recursos; elegir entre las tres opciones si hay déficit.
- **Revise:** la duración que Claude le asignó a su propia revisión. Si es irreal, la cadena crítica lo será.
- **Cuándo repetirlo:** tras un cambio aprobado, un bloqueo nuevo o un dato que llegó tarde (\`actualizar cronograma\`).
- **Error típico:** olvidar actualizarlo tras un cambio aprobado; es un hallazgo de auditoría.

### Paso: El ciclo por paquete

Este es el corazón del framework. En lugar de recibir veinte documentos y revisarlos todos juntos, usted recibe un paquete por vez: lo revisa, responde y recién entonces pasa al siguiente.

El ciclo existe porque un error detectado en el primer paquete se corrige antes de que contamine los demás. Y porque revisar poco y a menudo es más fácil, y más seguro, que revisar mucho de una sola vez.

Cada vuelta tiene tres momentos: Claude desarrolla, usted revisa y se cierra con una frase fija. Se describen a continuación.

Este ciclo se repite una vez por paquete. Es el corazón del framework.

#### Desarrollar el paquete

Claude no empieza a escribir apenas se lo pide. Primero comprueba que se cumplan las condiciones para hacerlo bien.

- **Usted dice:** \`desarrollar paquete\` (el siguiente del plan) o \`desarrollar paquete PQ-nn\` (uno en particular). Después del primero, \`siguiente paquete\`. Todo documento nace en \`Rev 00.0\`.
- **Claude hace, en este orden:**
  1. Puerta de dependencias: verifica que los paquetes de los que depende estén \`REVIEWED\`. Si no, no desarrolla: le dice cuál falta y propone hacerlo antes.
  2. Puerta de preparación: verifica que los parámetros críticos estén confirmados en la línea base (\`DELIVERABLES.md\`, sección 9).
  3. Desarrolla el paquete, con la biblioteca de cálculos validados (\`CAL-nnn\`) y los criterios de ingeniería.
  4. Autocontrol: cada documento y el paquete completo, con \`document_verifier.py\` (y \`specification_verifier.py\` si hay pliego).
  5. Entrega la hoja de revisión y se detiene.
- **Archivos:** los documentos del paquete en \`02_ENGINEERING\` con nombre \`<código>_Rev00.0.md\` (por ejemplo \`TLR01-E-MC-001_Rev00.0.md\`), anexos con el patrón \`_ANX-n_descr\`, y la hoja \`03_REVIEW/REVIEW_SHEETS/REVIEW-nn_YYYYMMDD_PQ-nn.md\`. Se actualizan \`DELIVERABLES.md\`, \`TRACEABILITY_MATRIX.md\` y \`PROJECT_STATUS.md\`.
- **Estado:** \`ENGINEERING\` mientras trabaja; \`FOR_REVIEW\` al entregar.

#### La puerta de preparación (opciones A, B y C)

Esta puerta existe para evitar el error más caro de una ingeniería: calcular sobre un dato que nadie confirmó. Si falta algo crítico, Claude no lo inventa; le pregunta qué prefiere hacer.

Si falta un dato crítico, Claude no redacta ni asume. Le presenta un formulario, uno solo por paquete, y usted responde una opción por documento con \`opción A [ENT-nnn]\`, \`opción B [ENT-nnn]\` u \`opción C [ENT-nnn]\`.

Las tres respuestas posibles y lo que cada una deja registrado se resumen en la tabla siguiente.

Tabla: Opciones del formulario de la puerta

| Frase | Qué significa | Qué queda |
|---|---|---|
| \`opción A\` (esperar) | Se abre una \`INF-nnn\` con responsable y fecha | El documento queda \`BLOCKED\` hasta recibir el dato |
| \`opción B\` (autorizar un supuesto) | Claude adopta un valor con su base del valor (práctica típica citada, catálogo u otro proyecto) | \`SUP-nnn\` con marca \`[VERIFICAR]\` y una \`DEC-nnn\` que registra quién autoriza |
| \`opción C\` (bloquear) | El documento queda \`BLOCKED\` con su \`BLQ-nnn\` | Como los paquetes son chicos, queda bloqueado el paquete completo y Claude propone otro paquete independiente |

- **«No sé / pendiente»** se trata como \`opción A\`.
- **Nunca \`opción B\`** para los críticos no autorizables. En eléctrica: nivel de cortocircuito y poder de corte, régimen de neutro y tensiones de servicio. Para esos datos solo existen A o C.
- **Error típico:** querer autorizar un supuesto sobre la corriente de cortocircuito. No se puede: se espera el dato o se bloquea.

#### Revisar la hoja (su turno)

Cuando Claude se detiene, la pelota está de su lado. La hoja de revisión es el único lugar donde usted responde, de modo que no tiene que buscar qué archivo mirar ni dónde dejar sus comentarios.

Claude le dice dónde está la hoja. Usted:

1. Abre la hoja \`REVIEW-nn_YYYYMMDD_PQ-nn.md\`. Contiene solo ese paquete.
2. Revisa los documentos de la parte A, empezando por prioridad Alta, y completa *Veredicto* y *Comentario* de cada uno.
3. Responde la parte B (supuestos, decisiones, datos y marcas del paquete).
4. Cierra con una frase fija en el chat.

Veredictos de cada documento:

- \`OK\`: sin comentarios.
- \`CON COMENTARIOS\`: se corrige y vuelve en una hoja nueva del mismo paquete, solo con lo cambiado.
- \`RECHAZAR\`: se rehace ese paquete (y solo ese).
- Vacío: no revisado. El paquete no se puede aprobar con documentos sin veredicto.

Además de los veredictos por documento, la hoja tiene una parte B con los supuestos, decisiones y datos que Claude necesita que usted resuelva. Se responden con frases cortas.

Respuestas de la parte B:

Tabla: Cómo responder la parte B de la hoja

| Respuesta | Cuándo | Efecto |
|---|---|---|
| \`ACEPTO\` | Supuesto, decisión propuesta o dato propuesto | El supuesto se acepta (queda abierto hasta tener el dato real); la decisión pasa a aprobada; el dato queda confirmado |
| \`CAMBIO: …\` | Supuesto o decisión | Claude crea una decisión nueva que reemplaza al supuesto o a la decisión anterior y propaga el valor |
| \`RECHAZO\` | Supuesto o decisión | El supuesto queda invalidado; la decisión, rechazada |
| \`DIFERIR\` | Solo solicitudes de cambio | La \`RFC\` queda diferida |
| un dato | \`INF-nnn\` o \`[DEFINIR]\` | Se cierra la \`INF\` y el valor va a \`PROJECT_INFORMATION.md\` |
| \`NO SÉ / PENDIENTE\` | \`INF\`, \`[DEFINIR]\`, \`SUP\`, \`DEC\` | Queda una \`INF-nnn\` abierta y Claude propone A, B o C |
| \`ACEPTO PENDIENTE\` | Solo marcas \`[DEFINIR]\` o \`[VERIFICAR]\` | Queda como pendiente aceptado \`PA-nnn\` (fecha y firmante). No equivale a conformidad |
| \`ACEPTO TODOS LOS BAJOS\` | Parte C | Acepta en bloque los supuestos y decisiones de riesgo Bajo de esta hoja sin respuesta propia. Nunca alcanza a riesgo Medio o Alto, parámetros críticos ni valores normativos \`[VERIFICAR]\` |

- **Revisar en el chat:** \`guiar revisión\` hace que Claude recorra la hoja un documento por vez («¿OK, comentarios o rechazar?») y la complete con sus respuestas.
- **Si no entiende algo:** escriba \`NO ENTIENDO\` en el comentario. Claude lo explica o lo reescribe.
- **Un buen comentario** dice dónde (sección o tabla por su nombre), qué está mal y, si lo sabe, cómo debe ser.
- **La revisión empieza** cuando devuelve la hoja con su primera respuesta o dice \`empezar revisión\`: el proyecto pasa a \`INTERNAL_REVIEW\`.

#### Frases de cierre

Cuando terminó de revisar, lo indica con una frase fija. Es la señal que Claude espera para saber cómo seguir.

La tabla siguiente responde qué ocurre con el paquete y con el estado del proyecto según la frase que usted diga.

Tabla: Frases de cierre y su efecto

| Usted dice | Efecto en el paquete | Estado del proyecto |
|---|---|---|
| \`revisión aprobada\` | OK del paquete (no del proyecto): sus documentos pasan a \`REVIEWED\`; Claude completa la columna *Revisó* con su nombre y propone el paquete siguiente | \`ENGINEERING\` |
| \`procesar comentarios de revisión\` | Claude transcribe cada comentario como \`REV-nnn\`, lo incorpora en los documentos afectados y **suma 1 al último dígito de su revisión** (\`00.0\` → \`00.0.1\`; la revisión anterior se archiva con su nombre) y entrega una hoja nueva del mismo paquete, solo con lo cambiado | \`FOR_REVIEW\` |
| \`rehacer\` | Solo ese paquete vuelve a desarrollo; se rehace lo rechazado | \`ENGINEERING\` |

- **Si es el último paquete de la emisión:** la parte C pregunta «¿Auditar la entrega?» (\`SÍ\` o \`NO, sigo con otro paquete\`). \`SÍ\` junto con \`revisión aprobada\` cuenta como \`auditar\`.
- **Verifique la reentrega:** en la hoja nueva, cada \`REV-nnn\` indica cómo se resolvió. Confirme que es lo que quería.
- **Desde \`REVIEWED\`:** cualquier comentario posterior (suyo, del cliente o de la auditoría) también se registra como \`REV-nnn\`; Claude propone si es una corrección documental (suma 1 a la revisión) o una RFC (cambia línea base, alcance, requisitos, parámetros maestros, filosofía de operación, criterios de diseño, potencias o equipos), y usted lo confirma con \`confirmar clasificación\`.
- **Terminó cuando:** el paquete está \`REVIEWED\` y Claude propone el siguiente. Usted lo confirma con \`siguiente paquete\` o lo reordena (\`siguiente paquete [PQ-nn]\`).
- **Dos paquetes a la vez:** solo si son independientes y usted lo autoriza con \`desarrollar paquetes [PQ-nn] y [PQ-nn]\`; queda registrado en una \`DEC\`.
- **Errores típicos:** pedir el paquete siguiente con el actual sin respuesta (Claude no lo desarrolla); dejar filas de la parte B sin respuesta; decir \`revisión aprobada\` con documentos sin veredicto.
- **Cambio aguas arriba:** si un paquete ya \`REVIEWED\` cambia después (siempre mediante una RFC), los paquetes dependientes que usan el dato modificado quedan \`REABIERTO\` y vuelven a usted de a uno, con una hoja corta («qué cambió / por qué afecta»). Los que solo citan al documento modificado no cambian.

### Paso: Ver el avance

Un proyecto largo se desvía de a poco y casi nunca de golpe. El informe de avance existe para que usted vea ese desvío mientras todavía es barato corregirlo.

Lo emite el auditor y no quien desarrolla, para que la medición sea independiente. No modifica nada: solo informa.

- **Usted dice:** \`estado del proyecto\` o \`informe de avance\`, al retomar o en cualquier momento. No cambia el estado.
- **Claude hace:** el auditor (rol independiente) emite \`90_MANAGEMENT/PROGRESS/PROGRESS-nn_YYYYMMDD.md\` con: resumen de una página, estado, avance por entregable verificado contra la carpeta, avance global, cobertura de trazabilidad, bloqueos e información pendiente, paquetes, cambios, cronograma y buffers, planos y riesgos. Después Claude lo vuelca en \`PROJECT_STATUS.md\` y \`SCHEDULE_CCPM.md\` (sección D).
- **Revise:** la zona del buffer de proyecto: VERDE (sin acción), AMARILLO (preparar un plan de recuperación) o ROJO (ejecutar el plan e informarle). Y los próximos pasos.
- **Terminó cuando:** usted confirma los próximos pasos.
- **Error típico:** esperar al final del proyecto para pedirlo; el avance no declarado se vuelve sorpresa.

### Paso: Registrar un cambio del cliente

Los cambios forman parte normal de cualquier proyecto.

Cuando aparece un nuevo requisito, cambia una condición de diseño o el cliente modifica el alcance, el framework exige que ese cambio quede registrado, evaluado y aprobado antes de incorporarse a la documentación.

Esto permite mantener la trazabilidad y evitar modificaciones informales que luego no puedan justificarse.

A continuación se describe cómo funciona ese proceso.

- **Usted dice:** \`registrar cambio\` (también \`registrar RFC\` o \`solicitud de cambio\`) cuando llega un pedido que modifica línea base, alcance, requisito del cliente, dato maestro, filosofía de operación, criterio de diseño, potencia o equipo aprobado. Un error documental (por ejemplo, un circuito que existe pero no aparece en el unifilar) **no es una RFC**: es una corrección documental que suma 1 a la revisión. RFC significa *Request for Change* (solicitud de cambio); no es lo mismo que una \`INF-nnn\` (información pendiente, RFI).
- **Claude hace:** abre una \`RFC-nnn\` el mismo día y guarda la **evidencia** sin modificar en \`90_MANAGEMENT/RFC/RFC-nnn/\` (archivo original con nombre \`YYYYMMDD_origen_descripcion\`: el correo, la foto, el acta). Si el pedido fue verbal, usted lo confirma y Claude lo transcribe como acta con fecha y autor. Después evalúa el impacto (alcance, requisitos, documentos, cronograma y consumo del buffer, riesgos) y propone la resolución. No toca ningún documento \`REVIEWED\` hasta que usted decida.
- **Usted decide con:** \`aprobar RFC [RFC-nnn]\`, \`rechazar RFC [RFC-nnn]\` o \`diferir RFC [RFC-nnn]\`.
- **Con la RFC aprobada:** Claude actualiza los datos maestros y cada documento afectado pasa a \`Rev 00.n\`, con \`n\` igual al número de la RFC y el último dígito en cero (la \`RFC-001\` genera la \`00.1\`; si un documento recibe solo la \`RFC-002\`, pasa de \`00.0\` a \`00.2\`, y es correcto). Si dos RFC afectan a un documento, se aplican en el orden de \`n\`. Después recorre la lista de propagación y deja el paquete afectado en \`FOR_REVIEW\`; los dependientes se reabren si usan el dato modificado. La RFC pasa a \`CLOSED\` cuando la auditoría o su revisión lo verifican.
- **RFC rechazada o diferida:** no genera revisión nueva.
- **El cliente sigue viendo \`Rev 00\`.** El \`TR-nnn\` y la tabla de control de revisiones (que cita la RFC) distinguen una entrega de otra.
- **Una solicitud, un tema:** si un correo trae tres pedidos, se abren tres RFC.
- **Errores típicos:** modificar un documento \`REVIEWED\` «por el camino» sin abrir la RFC; contestar al cliente sin consultar el impacto en el plazo.

### Paso: Información nueva en el buzón

No todo lo que llega después del inicio es un cambio. Muchas veces es simplemente un dato que faltaba: una Icc, un plano del sitio, una confirmación del cliente.

El framework distingue los dos casos para no abrir una solicitud de cambio donde solo hay que completar un dato. Veamos cómo se trata cada uno.

- **Usted:** deja el archivo en \`01_INPUT\` y, si quiere, lo comenta en una frase («tengo la Icc: …»).
- **Claude:** al abrir cada sesión revisa si hay archivos nuevos sin analizar y los analiza antes de continuar. Vuelca el dato primero en \`PROJECT_INFORMATION.md\`, cierra la \`INF-nnn\` y le avisa qué documentos quedan afectados.
- **Si lo nuevo cambia algo ya definido:** use \`registrar cambio\`.
- **Error típico:** dar el dato solo por el chat sin dejar el archivo; la evidencia se pierde.

### Paso: Armar y redactar el pliego

El pliego técnico es el documento contractual que dice qué debe ejecutarse y bajo qué reglas. Se redacta por capítulos, y cada capítulo responde una única pregunta.

Existe como etapa propia porque el pliego depende de la ingeniería: no se puede exigir un cable si todavía no se lo dimensionó. Por eso se arma después de los cálculos y también se desarrolla por paquetes.

A continuación se indica cómo se arma y se revisa.

Solo si el proyecto requiere pliego técnico (\`PG\`).

- **Usted dice:** \`armar pliego\`, y luego \`desarrollar documentación licitatoria\`.
- **Claude hace con \`armar pliego\`:** crea \`02_ENGINEERING/TECHNICAL_SPECS/\` con \`00_Index_and_Control.md\`, los diez capítulos vacíos (\`01_Scope.md\` a \`10_Contractor_Responsibilities.md\`) y \`Annexes/\`, y propone los paquetes de pliego. El pliego es un solo documento con un código y una revisión; cada capítulo responde una única pregunta.
- **Capítulos como paquetes:** cada capítulo, o grupo de capítulos que van de la mano, es un paquete (propuesta de \`TECHNICAL_SPECIFICATIONS_GUIDE.md\`, 4.10): Alcance y Memoria Descriptiva; Marco Normativo; Condiciones Generales de Ejecución; Requisitos de Diseño; Ensayos e Inspecciones; Precommissioning y COMMISSIONING; Documentación Técnica; Responsabilidades del Contratista (último).
- **Por qué el pliego va después del cálculo:** el capítulo Requisitos de Diseño cita potencias, secciones de cable y niveles de falla. No se puede redactar una exigencia sobre el cable si el cable todavía no se dimensionó. Por eso el pliego depende de los paquetes de cálculo \`REVIEWED\`.
- **Puerta por capítulo:** los capítulos cuya puerta se cumple se desarrollan; los demás quedan \`BLOCKED\` sin detener el resto.
- **Revisión:** la hoja del paquete de pliego tiene una fila por capítulo, con la pregunta que responde como «qué mirar». El veredicto es por capítulo.
- **Archivos:** capítulos \`NN_Nombre.md\` sin código ni revisión en el nombre. Al entregar, Claude consolida los capítulos en orden numérico en un solo documento \`<código>_Rev00.md\`; los capítulos no se entregan sueltos.
- **Error típico:** pedir el pliego completo de una vez antes de tener los cálculos revisados.

### Paso: Planos (insumos, dibujo y \`DRAWING_STATUS.md\`)

Los planos tienen un circuito distinto del resto de los documentos, porque los dibuja usted y no Claude. Claude le entrega los insumos, usted dibuja, y Claude verifica lo que recibe.

Como Claude no puede abrir su programa CAD ni saber qué avanzó, existe un archivo, \`DRAWING_STATUS.md\`, donde usted anota el estado de cada plano. Esa tabla es la única fuente de verdad sobre los planos.

El circuito completo se recorre en ocho pasos.

Los planos DWG los dibuja usted; Claude nunca genera DWG y por eso no puede saber en qué estado está un plano. El estado vive en \`DRAWING_STATUS.md\` (raíz del proyecto), que usted edita a mano. Claude nunca modifica su columna *Estado*: solo propone filas nuevas y completa *Verificación de Claude*.

1. **Filas propuestas:** al aprobarse el plan de paquetes, Claude propone una fila por cada plano o diagrama en \`PLANNED\`.
2. **Insumos:** Claude entrega, como parte de un paquete, el documento \`<código-del-plano>_DIN_Rev00.0.md\` en \`02_ENGINEERING/DRAWING_INPUTS/\`: lista de elementos con cantidad y ubicación, capas y bloques, notas, cuadros y referencias a cálculos. El plano pasa a \`CAD_INPUT\`.
3. **Revisión de los insumos:** usted los revisa como cualquier documento. El plano no se dibuja hasta que ese paquete esté \`REVIEWED\`.
4. **Dibujo:** usted dibuja el DWG con \`02_ENGINEERING/CAD_RESOURCES\` (plantillas, xrefs, bloques), lo deposita con su PDF de revisión en la carpeta de planos de la etapa y marca \`DRAWN\` en \`DRAWING_STATUS.md\`, con las rutas de ambos archivos.
5. **Verificación:** usted dice \`verificar plano [código]\` (uno) o \`actualizar planos\` (todos los \`DRAWN\`). Claude lo verifica contra los insumos y la lista de verificación (por el PDF o un DXF), escribe \`OK\` u \`OBSERVACIONES REV-nnn\` en *Verificación de Claude* y registra las diferencias como \`REV-nnn\`. Lo que no pueda leer lo declara como no verificado.
6. **Conformidad:** cuando las observaciones están resueltas, **usted** marca \`REVIEWED\` (su OK personal, sin hoja de revisión aparte). Tras \`entrega enviada TR-nnn\`, marca \`ENTREGADO\`.
7. **Cambios:** un plano ya \`REVIEWED\` que cambia (por un comentario o una RFC) recibe insumos actualizados con la revisión que corresponda (\`00.0.1\`, \`00.1\`…). El plano es el mismo archivo en todas las fases y madura de una a otra.
8. **Al abrir cada sesión,** Claude lee \`DRAWING_STATUS.md\`; si el último cambio es anterior al último paquete entregado, le pregunta si hubo cambios sin registrar.

- **Importante:** solo los planos \`REVIEWED\` entran en una entrega; la auditoría verifica la coherencia entre \`DRAWING_STATUS.md\`, la LME y las carpetas.
- **Errores típicos:** dibujar antes de que se apruebe el paquete de insumos; no actualizar el estado después de dibujar o de corregir (Claude no puede enterarse).

### Paso: Auditar

La auditoría es la revisión independiente de toda la entrega. Mientras usted revisó paquete por paquete, el auditor mira el conjunto: si todo es coherente, si está demostrado y si cumple lo pedido.

Existe porque los errores más caros no están dentro de un documento sino entre documentos: una memoria que dice una cosa y un pliego que dice otra. Cada entrega tiene su propia auditoría.

A continuación se describe cómo se pide, qué hace Claude y cómo se interpretan los veredictos.

- **Usted dice:** \`auditar\` (o \`auditar proyecto\`), cuando todos los paquetes de la entrega están \`REVIEWED\` y ninguno \`REABIERTO\` (y, desde el segundo IFA de la fase, los comentarios del cliente al IFA anterior están cerrados). Claude lo propone al cerrar el último paquete, pero espera su frase. Hay **una auditoría por emisión** (cada IFA y la IFC): la primera cubre todo el alcance; las siguientes, lo nuevo y lo modificado desde la anterior.
- **Claude hace (como auditor):** congela el alcance y ejecuta una sola vez, para esa entrega, las cinco auditorías: A1 documental, A2 de requisitos, A3 de ingeniería, A4 de entregables, A5 de trazabilidad, con mentalidad adversarial. Nunca asume conformidad: pide evidencia por código, revisión y sección. Contrasta cada parámetro entre documentos, y verifica que los planos incluidos estén \`REVIEWED\` en \`DRAWING_STATUS.md\` que los comentarios del cliente al IFA anterior estén cerrados (A2-12) y que cada entregable tenga la madurez que exige la fase (A1-18).
- **Archivo:** \`04_AUDIT/AUDIT_REPORTS/AUD-nn_YYYYMMDD.md\`, simple y directo: resultado (veredicto y conteo), cada observación con documento, problema, impacto y acción requerida, pendientes aceptados, orden de cierre para poder entregar, aprobación humana y tres anexos breves de respaldo. El gestor lo registra en \`AUDIT_REGISTER.md\`.
- **Severidades:** \`CRITICAL\`, \`MAJOR\`, \`MINOR\`, \`OBSERVATION\`. Los \`CRITICAL\` y \`MAJOR\` bloquean la entrega.
- **Veredictos y qué hacer:**

La tabla siguiente resume los tres veredictos posibles y qué le corresponde hacer a usted en cada caso.

Tabla: Veredictos de la auditoría y qué hacer

| Veredicto | Qué significa | Qué hace usted |
|---|---|---|
| \`APPROVED\` | Solo observaciones | Dice \`aprobar auditoría\`: el proyecto pasa a \`AUDITED\` y puede entregar |
| \`APPROVED_WITH_COMMENTS\` | Sin críticos ni mayores; \`MINOR\` con acción, responsable y fecha | Dice \`aprobar auditoría\`: pasa a \`AUDITED\`; cierre los \`MINOR\` antes de \`IFC\` o de la siguiente revisión |
| \`NOT_APPROVED\` | Al menos un \`CRITICAL\` o \`MAJOR\` abierto | Si el hallazgo exige trabajo de ingeniería, se registra como \`REV-nnn\` (origen AUDITORÍA), se clasifica (RFC o corrección documental) y, con ella aprobada, el proyecto vuelve a \`ENGINEERING\` (el paquete afectado vuelve a \`DRAFT\`). Si no (una decisión suya, un dato del cliente, registros), permanece en \`FOR_AUDIT\`. Cerrados los ítems, se re-audita solo lo corregido |

- **Pendientes aceptados (\`PA-nnn\`):** una marca \`[DEFINIR]\` o \`[VERIFICAR]\` abierta solo puede ir a auditoría si usted la aceptó (\`ACEPTO PENDIENTE\`). Se reporta como no verificada: para un \`IFA\` como \`OBSERVATION\`; para \`IFC\` o posterior, si es un valor normativo, como \`MAJOR\`.
- **Aprobación humana:** el informe lleva un campo para su nombre, cargo, fecha y firma. El veredicto de Claude es una auditoría técnica asistida; el proyecto solo pasa a \`AUDITED\` cuando usted dice \`aprobar auditoría\`.
- **Revise:** el resultado y las observaciones; los anexos son respaldo.
- **Errores típicos:** modificar un documento ya auditado (invalida su auditoría); esperar que la auditoría diseñe la solución (solo declara que falta evidencia).

### Paso: Preparar y hacer la entrega

Entregar es sacar del entorno de trabajo una copia limpia de lo aprobado y enviarla al cliente. La carpeta de trabajo y la carpeta de entrega están separadas a propósito: lo que se entregó no se vuelve a tocar.

Existe para que siempre se pueda demostrar qué recibió el cliente y cuándo. Cada envío lleva un transmittal (\`TR-nnn\`) que lo identifica.

La entrega se hace en dos frases, una para armar el paquete y otra para confirmar el envío. Los pasos son los siguientes.

La emisión solo sale de \`AUDITED\`, con la auditoría **de esa emisión** aprobada. Se hace en dos frases: \`entregar IFA\` (o \`IFC\`, al terminar la Ejecutiva), con la que Claude arma el paquete, y \`entrega enviada TR-nnn\`, con la que usted confirma que lo envió.

1. **Copia limpia (\`entregar IFA\`):** Claude copia los documentos y listados aprobados de \`02_ENGINEERING\` a \`06_DELIVERABLES/IFA/YYYYMMDD_TR-nnn_Rev00/\` (o \`IFC\`; el as-built va a \`AS_BUILT\`), en \`Documents/\`, y deja los planos \`REVIEWED\` en \`DRAWINGS_PDF/\` y \`DRAWINGS_DWG/\`. Si hay pliego, entrega el consolidado. Todo se rotula \`Rev 00\`.
2. **Depuración de entrega** (DE-01 a DE-10):
   - Usted depura los DWG: \`PURGE\`, \`AUDIT\`, \`RECOVER\`, \`ETRANSMIT\` o *bind* de xrefs, sin datos de otros proyectos ni internos (DE-01 a DE-06), y genera el PDF desde el DWG depurado (DE-07).
   - Claude depura los documentos: sin comentarios ni marcas internas (DE-08), nombres conformes (DE-09), mismos códigos y revisiones que lo editable aprobado y la LME (DE-10).
3. **Revisiones exactas:** en los documentos de trabajo se cita la «revisión vigente»; al entregar, toda referencia cita la revisión exacta del juego entregado.
4. **Transmittal \`TR-nnn\`:** qué se entrega, a quién, y la **revisión interna entregada** de cada documento (por ejemplo «TR-001: 00.0.2» y «TR-002: 00.2»), más la fase, mientras el cliente ve siempre \`Rev 00\`. El original vive en \`06_DELIVERABLES/TRANSMITTALS\`; una copia, en la carpeta de entrega.
5. **Columna *Aprobó*:** a partir de la \`Rev 00\` la completa usted (la persona responsable); Claude nunca la completa.
6. **Confirmación (\`entrega enviada TR-nnn\`):** usted envía y lo dice. Recién entonces Claude emite el transmittal, registra \`IFA\` o \`IFC\` y le propone marcar \`ENTREGADO\` en \`DRAWING_STATUS.md\` a los planos incluidos. Hasta esa frase el proyecto sigue en \`AUDITED\`.
7. **Estado:** el proyecto queda en \`IFA\` o \`IFC\` *esperando al cliente* (ver el paso siguiente).

- **Terminó cuando:** el transmittal está emitido y la carpeta de entrega es de solo lectura.
- **Errores típicos:** editar algo en \`06_DELIVERABLES\` (se corrige en \`02_ENGINEERING\` y se vuelve a entregar con otro \`TR-nnn\`); incluir un plano que no está \`REVIEWED\`.

### Paso: Comentarios del cliente y fase siguiente

Una emisión no termina cuando se envía: termina cuando el cliente la aprobó. Mientras tanto hay una instancia de revisión del cliente que el framework trata con el mismo rigor que cualquier otro cambio.

Esto evita que los comentarios se pierdan en correos o se resuelvan sin dejar rastro. Veamos cómo se procesan y cómo se pasa a la fase siguiente.

Después de cada \`IFA\` hay una **instancia de revisión del cliente**. El proyecto permanece en \`IFA\` hasta que se cierra con \`cliente aprueba\`.

- **Llegan comentarios:** déjelos en el buzón y diga \`comentarios del cliente recibidos\`. Claude guarda la evidencia, registra cada comentario como \`REV-nnn\` (origen CLIENTE) y propone si es una **corrección documental** o una **RFC**; usted lo confirma con \`confirmar clasificación\`. Cada comentario incorporado suma 1 a la revisión del documento (si el cliente dice «falta un circuito», el documento pasa de \`00.0\` a \`00.0.1\`); una RFC aprobada fija \`00.n\`. Los documentos afectados **vuelven siempre a revisión interna (IFR)**: usted revisa el paquete, y recién entonces hay un nuevo IFA. Sin excepciones.
- **El cliente aprueba:** el silencio no cierra la instancia por sí solo. La cierra únicamente usted con \`cliente aprueba\`, que registra una \`DEC\` con la evidencia (la aprobación expresa o, si el cliente no responde, su confirmación por llamada telefónica: fecha, persona y lo acordado) y **dispara la fase siguiente** (la aprobación del IFA Conceptual dispara la Básica, la de la Básica la de Detalle, la de Detalle la Ejecutiva).
- **Cierre de los comentarios:** cada \`REV-nnn\` incorporado, o \`REJECTED\` / \`DEFERRED\` con su \`DEC\`; las RFC, \`CLOSED\`.
- **Nuevo IFA:** con los comentarios resueltos y los paquetes \`REVIEWED\` de nuevo, usted dice \`auditar\`. Claude audita lo nuevo y lo modificado **y todo documento que comparta datos con ello** (si cambió un interruptor en el unifilar, lo contrasta con el multifilar y el pliego), **verifica que todos los comentarios del cliente estén resueltos** (A2-12), y tras \`aprobar auditoría\` usted dice \`entregar IFA\` y, ya enviada, \`entrega enviada TR-nnn\`. El cliente vuelve a recibir \`Rev 00\`; el \`TR-nnn\` nuevo y el control de revisiones muestran qué cambió.
- **Excepción \`[VERIFICAR]\`:** el orden de fases solo se altera, o se omite una fase o su IFA, si el contrato no la prevé, y queda registrado en una \`DEC\`. Si no hay Ejecutiva, el IFC se prepara tras \`cliente aprueba\` de la última fase.
- **IFC:** al terminar la Ejecutiva y con su auditoría aprobada, \`entregar IFC\` libera la documentación para construir. No es una aprobación documental: es la liberación del conjunto ya en nivel Final. La Ejecutiva se sigue actualizando con las decisiones de obra hasta \`iniciar as-built\`.
- **Error típico:** corregir directamente un documento entregado. Siempre se corrige en el editable, con su \`REV-nnn\` (o RFC), revisión interna y auditoría.

### Paso: Obra, as-built y modificaciones posteriores

Si el contrato incluye obra, el proyecto no termina con la ingeniería. Durante la construcción y la puesta en marcha aparecen cambios, y al final hay que dejar documentado lo realmente construido.

Esta etapa existe para que el juego documental final coincida con la obra. A continuación se indica cómo se manejan la obra, el as-built y los cambios posteriores.

- **Obra y puesta en marcha:** los estados son \`CONSTRUCTION\`, \`PRECOMMISSIONING\` y \`COMMISSIONING\`. Se pasa a cada estado con \`pasar a CONSTRUCTION\`, \`pasar a PRECOMMISSIONING\` y \`pasar a COMMISSIONING\`, cuando se cumple su condición de entrada. Cada cambio de obra se registra (\`REV-nnn\` o \`registrar cambio\` si es RFC; origen OBRA, con foto y orden de trabajo como evidencia) y se refleja en la Ejecutiva actualizada. Los redlines de obra y la Ejecutiva son la base del as-built. Claude no verifica la ejecución física: exige evidencia (protocolos firmados, registros).
- **As-built (\`AS_BUILT\`):** con \`iniciar as-built\`, todo el juego documental del proyecto pasa a \`Rev 01\` (conforme a obra); los documentos que el as-built no modifica se vuelven a entregar «sin cambios» con \`Rev 01\`, con el informe de modificaciones respecto de \`IFC\`, redlines incorporados, manuales y data book. Cada documento as-built registra lo instalado, el motivo del cambio y su acta (\`RFC-nnn\` o acta del cliente). Se arma con \`entregar as-built\` y se confirma con \`entrega enviada TR-nnn\` en \`06_DELIVERABLES/AS_BUILT\`, si el proyecto contrata as-built. Los planos as-built los dibuja usted.
- **Modificaciones posteriores (\`Rev 02\` y siguientes):** si después de terminado se instala algo (por ejemplo, un tablero nuevo), nace una \`RFC\` y el proyecto completo pasa a \`Rev 02\`; los siguientes cambios, a \`Rev 03\`, \`Rev 04\`… (numeración secuencial del proyecto, no ligada al número de la RFC, que el control de revisiones cita). Los documentos afectados se actualizan y los no afectados se vuelven a entregar con la nueva revisión indicando «sin cambios».
- **Error típico:** cambiar algo en obra sin registrarlo; sin registro no hay as-built.

### Paso: Lecciones aprendidas y cierre

Un proyecto bien cerrado deja a la oficina mejor preparada para el siguiente. Las lecciones aprendidas son la forma de lograrlo: lo que enseñó este proyecto vuelve a la plantilla para que el próximo no repita el error.

Por eso el cierre tiene dos partes: extraer las lecciones y pasar la auditoría de cierre. Se detallan a continuación.

1. **Capturar:** durante todo el proyecto, cuando algo enseñe una regla reutilizable, Claude o usted lo anotan como \`LEC-nnn\` en \`LESSONS_LEARNED.md\`. Dígalo en una frase («esto hay que recordarlo»).
2. **\`extraer lecciones\`:** obligatorio antes del cierre. Claude clasifica cada lección por destino (reglas de diseño, criterios, cálculos, equipos, normas, proceso, cliente o descarte con motivo) y escribe \`90_MANAGEMENT/Historical/Lessons/LESSONS_PROPOSAL_YYYYMMDD.md\`.
3. **Usted aprueba o corrige cada fila** (\`APROBADO\`, \`CORREGIDO: …\` o \`DESCARTADO\`). Claude no modifica la biblioteca sin esa aprobación. Aplica lo aprobado en la plantilla maestra (o genera un paquete de actualización si la maestra no está accesible) y deja \`LESSONS_LEARNED.md\` en blanco; el contenido pasa a \`02_ENGINEERING/ARCHIVE\`.
4. **Auditoría de cierre:** con \`auditar\` en estado \`AS_BUILT\`, y su aprobación con \`aprobar auditoría\`. Verifica entregables, as-built y trazabilidad al 100 %.
5. **Cierre:** con las lecciones extraídas, el as-built entregado y la auditoría de cierre aprobada, usted dice \`cerrar proyecto\` y \`AS_BUILT\` pasa a \`CLOSED\`.

- **Error típico:** llegar al cierre con lecciones sin extraer; la auditoría de cierre lo marca.

## Si algo sale distinto

Ningún proyecto sigue el camino ideal. Falta un dato, el cliente cambia de opinión, una auditoría no sale limpia. El framework está pensado para esos casos y todos tienen un camino.

La tabla siguiente reúne las situaciones más comunes y qué hacer en cada una.

Tabla: Problema y qué hacer

| Problema | Qué hacer |
|---|---|
| Claude pregunta algo que no sabe | Responda «no sé / pendiente». Queda una \`INF-nnn\` con responsable y fecha, y Claude propone esperar, autorizar un supuesto o bloquear |
| Falta un dato del cliente | Se abre una \`INF-nnn\`. Si es un crítico no autorizable (Icc, neutro, tensiones), solo cabe esperar o bloquear. Claude propone otro paquete que no lo necesite |
| El cliente cambia el alcance | \`registrar cambio\`. Guarde el correo o acta. No se modifica ningún documento \`REVIEWED\` sin \`RFC\` |
| La auditoría da \`NOT_APPROVED\` | Lea las observaciones bloqueantes. Si el hallazgo exige ingeniería, se tramita como RFC y el paquete vuelve a \`ENGINEERING\`. Si es una decisión o un registro, se cierra sin ingeniería y se re-audita solo ese ítem |
| No recuerda en qué estado está | \`ayuda\` o \`estado del proyecto\`. También puede leer \`PROJECT_STATUS.md\`, sección A |
| Quiere saltear un paquete | Pídalo con \`desarrollar paquete PQ-nn\`. Si sus dependencias no están \`REVIEWED\`, Claude no lo desarrolla y le dice cuál falta. Solo se admite con un \`[DEFINIR]\` justificado en una \`DEC\` |
| Quiere revisar de a dos paquetes | Diga \`desarrollar paquetes [PQ-nn] y [PQ-nn]\`. Solo si son independientes; queda registrado en una \`DEC\` |
| Una hoja es demasiado grande | Dígalo. Claude vuelve a dividir el paquete en el plan |
| No entiende algo de la hoja | Escriba \`NO ENTIENDO\` en el comentario |
| Quiere ver el cronograma | Abra \`SCHEDULE_CCPM.md\` (cadena crítica, Plan de paquetes) o pida \`informe de avance\` para la zona del buffer |
| Se atrasó algo o cambió el plazo | \`actualizar cronograma\`. Claude recalcula con \`ccpm.py\` y, si hay déficit, propone las tres opciones |
| Cambió una norma | Dígalo y use \`registrar cambio\` si modifica un requisito. Si falta el archivo de la norma, \`agregar norma\` |
| Falta un equipo en el catálogo | \`agregar equipo\` |
| Una regla de diseño está sin definir | \`completar reglas de diseño [disciplina]\` |
| Quiere corregir algo ya entregado | Se registra como comentario (\`REV-nnn\`) y, según sea corrección documental o RFC, se corrige en \`02_ENGINEERING\` (\`00.0.1\`, \`00.n\`…), vuelve a revisión interna y se entrega de nuevo con otro \`TR-nnn\`. Nunca se edita \`06_DELIVERABLES\` |
| Dibujó o corrigió un plano | Actualice su estado en \`DRAWING_STATUS.md\` y diga \`verificar plano [código]\` o \`actualizar planos\`. Claude no puede saberlo si usted no lo anota |
| El cliente no respondió | No se cierra por silencio: si lo da por aprobado, diga \`cliente aprueba\` y deje la evidencia; queda una \`DEC\` y se dispara la fase siguiente |
| Claude le repite una frase antes de actuar | Es el estándar: confirme si es lo que quería. Si no, corríjala; Claude no asume ante una frase ambigua |
| Cambió un documento ya auditado | Su auditoría deja de valer para ese documento; se re-audita el alcance afectado |
| Un paquete aparece \`REABIERTO\` | Cambió un dato del que depende. Revise la hoja corta de impacto |
| Se rechazó el paquete | \`rehacer\`. Solo ese paquete vuelve a \`ENGINEERING\` |
| Lo que Claude propuso no es lo que quería | Dígalo con una frase. Claude puede reordenar el plan sin violar dependencias |

## Lista de verificación de un día de trabajo

Esta lista sirve como rutina diaria. Con ella no depende de la memoria ni de revisar cada archivo: Claude le informa el estado al abrir la sesión y usted solo atiende lo pendiente.

Al abrir la sesión, Claude lee \`PROJECT_STATUS.md\` y le informa. Usted no tiene que pedirlo.

- [ ] Espere el primer mensaje: paquete actual y su estado, cuántos están \`REVIEWED\`, qué se espera de usted y el próximo paquete propuesto.
- [ ] Atienda lo que Claude informe: archivos nuevos sin analizar en el buzón, solicitudes de cambio sin decisión, información vencida, zona del buffer, comentarios del cliente pendientes y cambios no registrados en \`DRAWING_STATUS.md\`.
- [ ] Si hay una hoja pendiente, revísela antes de pedir nada más: Claude no desarrolla otro paquete hasta recibir su respuesta.
- [ ] Si el estado es \`FOR_AUDIT\`, Claude ejecuta la auditoría automáticamente antes de cualquier otra tarea.
- [ ] Trabaje con una frase fija por mensaje. Ante la duda, \`ayuda\`.
- [ ] Antes de cerrar, deje la hoja respondida o diga una frase de cierre; actualice \`DRAWING_STATUS.md\` si dibujó; registre lo que llegó (\`registrar cambio\` o una frase con el dato).
- [ ] Al terminar, pida \`estado del proyecto\` si no recuerda en qué quedó. Todo lo importante queda en archivos, no en la conversación.

### Lo que nunca hace Claude solo

Hay decisiones que el framework reserva siempre para usted. La lista siguiente recuerda cuáles son, para que pueda confirmar que ninguna se tomó en su lugar.

- Dar por revisado un documento o un paquete (\`revisión aprobada\` es suyo).
- Pasar de \`FOR_REVIEW\` a \`INTERNAL_REVIEW\`, o rechazar un paquete (\`rehacer\`).
- Pasar a \`FOR_AUDIT\` sin su confirmación (\`auditar\`). Lo propone, no lo ejecuta.
- Empezar la ingeniería tras \`iniciar proyecto\`, o desarrollar el paquete siguiente sin su frase.
- Desarrollar dos paquetes a la vez sin su autorización explícita (\`desarrollar paquetes [PQ-nn] y [PQ-nn]\`).
- Aprobar la línea base, el plan de paquetes, las duraciones, una solicitud de cambio (RFC) o su propia auditoría (\`aprobar auditoría\` es suyo).
- Dar por enviada una entrega (\`entrega enviada TR-nnn\` es suyo) ni cerrar por silencio la revisión del cliente.
- Modificar la columna *Estado* de \`DRAWING_STATUS.md\`.
- Modificar la biblioteca con las lecciones sin su aprobación fila por fila.
- Dibujar los planos DWG, o decidir y firmar la entrega.
- Cambiar un estado crítico sin repetirle antes la frase fija que entendió.
- Inventar un dato técnico: lo desconocido queda marcado y registrado.
- Firmar, certificar o completar la columna *Aprobó*.
