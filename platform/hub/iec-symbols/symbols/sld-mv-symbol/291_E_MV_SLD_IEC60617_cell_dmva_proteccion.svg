  <desc>Celda SM AirSET DMVL-A: seccionador, interruptor, toroidal, relé disparador, seccionador de tierra e indicador de tensión. | Origen: Lámina 1 (108-2026-SOXXXXXX-E-DU-001). Incluye el contorno gris discontinuo de la celda y el tramo de barra que la cruza. Las flechas de terminal de cable fueron redibujadas como triángulos rellenos (el original usa sombreado).</desc>
  
