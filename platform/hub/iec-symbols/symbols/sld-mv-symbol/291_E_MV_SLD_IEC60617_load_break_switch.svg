<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31.882 -1.6 39.882 28.2" width="39.882mm" height="28.2mm" role="img" aria-label="Interruptor-seccionador MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor-seccionador MT</title>
  <desc>Contacto fijo, cuchilla y semicírculo de corte en carga. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_load_break_switch" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.961" y1="3.922" x2="1.961" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="16.667" x2="0" y2="20" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="16.667" x2="-5.882" y2="5.882" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-3.922 10.539 C-4.51 8.824 -2.549 8.039 -1.765 9.314" fill="none" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7.882" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">LBS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="20" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7.882" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-7.882" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7.882" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7.882" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>