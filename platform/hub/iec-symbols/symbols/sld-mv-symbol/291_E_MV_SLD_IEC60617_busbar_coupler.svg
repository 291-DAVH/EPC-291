<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.5 -1.6 53 26.12" width="53mm" height="26.12mm" role="img" aria-label="Seccionador de acoplamiento de barras MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Seccionador de acoplamiento de barras MT</title>
  <desc>Seccionador de acoplamiento de barras de media tensión según IEC 60617. Une o desacopla dos secciones de barras en la celda de MT. | Origen: Dibujo propio según IEC 60617 (seccionador de acoplamiento MT).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_busbar_coupler" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-12.5" y1="0" x2="0" y2="0" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="12.5" y2="0" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="2.5" x2="1.961" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="15.245" x2="-4.412" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="15.245" x2="0" y2="17.745" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-12.5" y1="17.745" x2="12.5" y2="17.745" stroke="#0000ff" stroke-width="0.5"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <text font-family="Arial, sans-serif" x="-14.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BC</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_bus_A" cx="-12.5" cy="0" r="0.6" data-dir="left"/>
    <circle id="port_bus_B" cx="12.5" cy="0" r="0.6" data-dir="right"/>
    <circle id="port_bus_C" cx="-12.5" cy="17.745" r="0.6" data-dir="left"/>
    <circle id="port_bus_D" cx="12.5" cy="17.745" r="0.6" data-dir="right"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q7" x="-14.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="20 kV" x="-14.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_current" data-key="current" data-example="1250 A" x="-14.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-14.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
