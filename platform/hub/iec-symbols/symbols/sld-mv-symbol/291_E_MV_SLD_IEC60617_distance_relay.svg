<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-33.5 -1.6 43 35.262" width="43mm" height="35.262mm" role="img" aria-label="Relé de distancia MT (ANSI 21)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Relé de distancia MT (ANSI 21)</title>
  <desc>Relé de protección de distancia de media tensión, función ANSI 21. Protege líneas y transformadores contra cortocircuitos por medición de impedancia. Según IEC 60255 / IEEE C37.90. | Origen: Dibujo propio según IEC 60255 / IEEE C37.90 (ANSI función 21).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_distance_relay" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="15" x2="0" y2="20" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-7.5" y="4" width="15" height="11" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="0" y="8.99" font-size="1.7" fill="#0000ff" text-anchor="middle" font-weight="bold">21</text>
    <text x="0" y="10.112" font-size="1.7" fill="#0000ff" text-anchor="middle">DIST</text>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <text font-family="Arial, sans-serif" x="-9.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">21</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_in" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_out" cx="0" cy="20" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="21-01" x="-9.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_zone1" data-key="zone1" data-example="0.5 Ω" x="-9.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{zone1}</text>
    <text id="slot_zone2" data-key="zone2" data-example="1.0 Ω" x="-9.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{zone2}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-9.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
