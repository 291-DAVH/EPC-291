<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.75 -1.6 38.069 27.602" width="38.069mm" height="27.602mm" role="img" aria-label="Pararrayos / descargador MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Pararrayos / descargador MT</title>
  <desc>Caja con varistor y tierra. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_surge_arrester" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.721" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-2.143" y="3.721" width="4.287" height="10.232" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M -2.679 12.093 L 0 8.373 L 2.679 4.651" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="13.954" x2="0" y2="16.744" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.75" y1="16.744" x2="3.75" y2="16.744" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.411" y1="18.373" x2="2.411" y2="18.373" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.071" y1="20" x2="1.071" y2="20" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-5.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SA</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-5.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_impulse_current" data-key="impulse_current" data-example="20 kA" x="-5.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{impulse_current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>