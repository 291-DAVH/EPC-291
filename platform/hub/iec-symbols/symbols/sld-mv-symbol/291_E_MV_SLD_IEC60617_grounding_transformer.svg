<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 39 38.12" width="39mm" height="38.12mm" role="img" aria-label="Transformador de puesta a tierra (Zig-Zag)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transformador de puesta a tierra (Zig-Zag)</title>
  <desc>Transformador de puesta a tierra de neutro con devanado zigzag según IEC 60617 S00325. Se usa en redes MV sin neutro (triángulo) para crear un neutro artificial puesta a tierra. | Origen: Dibujo propio según IEC 60617 S00325.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_grounding_transformer" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.431" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M 5 7.292 C 5 9.976 2.761 12.153 0 12.153 C -2.761 12.153 -5 9.976 -5 7.292 C -5 4.607 -2.761 2.431 0 2.431 C 2.761 2.431 5 4.607 5 7.292" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -2.75 4.618 L 2.75 4.618 L -2.75 9.965 L 2.75 9.965" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.153" x2="0" y2="14.583" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.5" y1="14.583" x2="3.5" y2="14.583" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.5" y1="16.042" x2="2.5" y2="16.042" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="17.5" x2="1.5" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">ZN</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-T1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="20 kV" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_power" data-key="power" data-example="150 kVA" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_vector" data-key="vector" data-example="ZNy11" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{vector}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
