  <desc>Celda SM AirSET GAM2: remonte de cable con barra, indicador capacitivo de tensión y terminal de cable. | Origen: Lámina 1 (108-2026-SOXXXXXX-E-DU-001). Incluye el contorno gris discontinuo de la celda y el tramo de barra que la cruza. Las flechas de terminal de cable fueron redibujadas como triángulos rellenos (el original usa sombreado).</desc>
  
