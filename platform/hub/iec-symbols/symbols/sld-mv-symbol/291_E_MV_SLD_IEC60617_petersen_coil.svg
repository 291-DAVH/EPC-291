<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.14 -1.6 46.14 43.62" width="46.14mm" height="43.62mm" role="img" aria-label="Bobina de Petersen (bobina de extinción de arco)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bobina de Petersen (bobina de extinción de arco)</title>
  <desc>Bobina de Petersen o reactor de extinción de arco según IEC 60617 S00310. Se usa en redes MV con neutro compensado (sistemas resonantes) para extinguir faltas monofásicas a tierra. | Origen: Dibujo propio según IEC 60617 S00310.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_petersen_coil" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.604" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M 0 2.604 Q 4 4.688 0 6.771 Q 4 8.854 0 10.938 Q 4 13.021 0 15.104 Q 4 17.188 0 19.271" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="19.271" x2="0" y2="21.875" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.5" y1="21.875" x2="3.5" y2="21.875" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.5" y1="23.438" x2="2.5" y2="23.438" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="25" x2="1.5" y2="25" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-5.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">L</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-L1" x="-5.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_tuning_voltage" data-key="tuning_voltage" data-example="20 kV" x="-5.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{tuning_voltage}</text>
    <text id="slot_inductance" data-key="inductance" data-example="12.5 H" x="-5.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{inductance}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-5.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.5" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
