<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36.73 -4.62 63.73 33.73" width="63.73mm" height="33.73mm" role="img" aria-label="Arrancador suave (SS) 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Arrancador suave (SS) 3P (multifilar)</title>
  <desc>Arrancador suave de 3 polos en formato multifilar. Símbolo de caja con rampa de arranque. | Origen: Dibujo propio.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_soft_starter_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="18.627" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L1</text>
    <line x1="10" y1="0" x2="10" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="18.627" x2="10" y2="22.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L2</text>
    <line x1="20" y1="0" x2="20" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="20" y1="18.627" x2="20" y2="22.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="21.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L3</text>
    <rect x="-5" y="4.902" width="30" height="13.725" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -3 13.264 L 3.8 13.264 L 16.2 10.264 L 23 10.264" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="10" y="12.377" font-size="1.7" fill="#0000ff" text-anchor="middle" font-weight="bold">SS</text>
    <text x="1" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
    <text x="1" y="21" font-size="1.7" fill="#0000ff" text-anchor="start">4</text>
    <text x="11" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
    <text x="11" y="21" font-size="1.7" fill="#0000ff" text-anchor="start">5</text>
    <text x="21" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
    <text x="21" y="21" font-size="1.7" fill="#0000ff" text-anchor="start">6</text>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SS</text>
  
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L1" cx="0" cy="22.5" r="0.6" data-dir="down"/>
    <circle id="port_top_L2" cx="10" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L2" cx="10" cy="22.5" r="0.6" data-dir="down"/>
    <circle id="port_top_L3" cx="20" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L3" cx="20" cy="22.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="22 A" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_power_kw" data-key="power_kw" data-example="11 kW" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power_kw}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
