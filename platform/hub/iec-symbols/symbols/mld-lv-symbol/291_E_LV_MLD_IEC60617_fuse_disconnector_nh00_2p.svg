<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55.85 -4.83 70.16 28.93" width="70.16mm" height="28.93mm" role="img" aria-label="Fusible seccionable NH00 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionable NH00 2P (multifilar)</title>
  <desc>Fusible seccionable NH00 de 2 polo(s): el símbolo lv_fuse_disconnector_nh00 repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse_disconnector_nh00 (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_disconnector_nh00_2p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-1.632" y="8.074" width="3.265" height="9.794" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="4.809" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="6.441" x2="0" y2="19.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="21.132" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="4.804" x2="1.632" y2="4.804" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="21.127" x2="1.632" y2="21.127" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L</text>
    <rect x="8.368" y="8.074" width="3.265" height="9.794" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="4.809" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="6.441" x2="10" y2="19.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="21.132" x2="10" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="8.368" y1="4.804" x2="11.632" y2="4.804" stroke="#0000ff" stroke-width="0.25" />
    <line x1="8.368" y1="21.127" x2="11.632" y2="21.127" stroke="#0000ff" stroke-width="0.25" />
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">N</text>
    
  
    <g id="terminal_marks" font-family="Arial, sans-serif">
<text x="1" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
<text x="1" y="21.5" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
<text x="11" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
<text x="11" y="21.5" font-size="1.7" fill="#0000ff" text-anchor="start">4</text></g></g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-3.632" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">NH00</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="22.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="10" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="TAG-01" x="-3.632" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="50 A" x="-3.632" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="100 kA" x="-3.632" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-3.632" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Sch. Electric" x="-3.632" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>