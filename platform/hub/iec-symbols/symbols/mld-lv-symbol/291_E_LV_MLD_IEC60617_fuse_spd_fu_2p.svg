  <desc>Fusible + descargador de sobretensión (FU+SPD) de 2 polo(s): el símbolo lv_fuse_spd_fu repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse_spd_fu (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
