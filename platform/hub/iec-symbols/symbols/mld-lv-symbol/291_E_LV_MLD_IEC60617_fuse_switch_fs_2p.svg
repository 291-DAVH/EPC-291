<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31.025 -4.83 45.335 48.93" width="45.335mm" height="48.93mm" role="img" aria-label="Fusible seccionador (FS) 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionador (FS) 2P (multifilar)</title>
  <desc>Fusible seccionador (FS) de 2 polo(s): el símbolo lv_fuse_switch_fs repetido en cada polo, con enlace mecánico discontinuo común (IEC 60617 S00295). | Origen: Réplica por polo de SLD_LV/lv_fuse_switch_fs (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_switch_fs_2p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-4.466" y1="7.309" x2="0.005" y2="16.25" stroke="#0000ff" stroke-width="0.25" />
    <path d="M -1.672 15.691 L 0.564 14.574 L -2.789 7.868 L -5.025 8.985 L -1.672 15.691" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.275" y1="6.098" x2="1.299" y2="6.098" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="6.118" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="16.25" x2="0" y2="37.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L</text>
    <line x1="5.534" y1="7.309" x2="10.005" y2="16.25" stroke="#0000ff" stroke-width="0.25" />
    <path d="M 8.328 15.691 L 10.564 14.574 L 7.211 7.868 L 4.975 8.985 L 8.328 15.691" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="8.725" y1="6.098" x2="11.299" y2="6.098" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="6.118" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="16.25" x2="10" y2="37.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">N</text>
    <line x1="-2.235" y1="11.765" x2="7.856" y2="11.765" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    
  
    <g id="terminal_marks" font-family="Arial, sans-serif">
<text x="1" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
<text x="1" y="36.5" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
<text x="11" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
<text x="11" y="36.5" font-size="1.7" fill="#0000ff" text-anchor="start">4</text></g></g>
  
  <text font-family="Arial, sans-serif" x="-7.025" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">FS</text>
  
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="37.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="10" cy="37.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7.025" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-7.025" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="10 kA" x="-7.025" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7.025" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>