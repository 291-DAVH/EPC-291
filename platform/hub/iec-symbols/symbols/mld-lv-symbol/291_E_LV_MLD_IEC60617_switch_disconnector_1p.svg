<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.5 -4.83 35.789 26.43" width="35.789mm" height="26.43mm" role="img" aria-label="Seccionador (corte visible) 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Seccionador (corte visible) 1P (multifilar)</title>
  <desc>Seccionador (corte visible) de 1 polo(s): el símbolo lv_switch_disconnector repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_switch_disconnector (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_switch_disconnector_1p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.25" y1="4" x2="1.25" y2="4" stroke="#0000ff" stroke-width="0.25" />
    <path d="M0.9 4.9 C0.9 5.397 0.497 5.8 0 5.8 C-0.497 5.8 -0.9 5.397 -0.9 4.9 C-0.9 4.403 -0.497 4 0 4 C0.497 4 0.9 4.403 0.9 4.9" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.5" y1="4.5" x2="0" y2="10" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25" />
  </g>
  
  <text font-family="Arial, sans-serif" x="-4.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SW</text>
  
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="15" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-4.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-4.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-4.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-4.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>