<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 -4.83 60.685 26.43" width="60.685mm" height="26.43mm" role="img" aria-label="Fusible 4P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible 4P (multifilar)</title>
  <desc>Fusible de 4 polo(s): el símbolo lv_fuse repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_4p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-1" y="4" width="2" height="7" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <rect x="9" y="4" width="2" height="7" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="20" y1="0" x2="20" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <rect x="19" y="4" width="2" height="7" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="30" y1="0" x2="30" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <rect x="29" y="4" width="2" height="7" fill="none" stroke="#0000ff" stroke-width="0.25" />
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-3" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">FUSE</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L2" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L3" cx="20" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="30" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L1" cx="0" cy="15" r="0.6" data-dir="down" />
    <circle id="port_bottom_L2" cx="10" cy="15" r="0.6" data-dir="down" />
    <circle id="port_bottom_L3" cx="20" cy="15" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="30" cy="15" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-3" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-3" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="10 kA" x="-3" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-3" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>