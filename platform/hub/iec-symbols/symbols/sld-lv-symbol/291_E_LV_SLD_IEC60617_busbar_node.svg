<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31.882 -3.7 39.882 20.7" width="39.882mm" height="20.7mm" role="img" aria-label="Nodo de barra (derivación)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Nodo de barra (derivación)</title>
  <desc>Punto de conexión de un alimentador a la barra. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_busbar_node" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-5.882" y1="0.784" x2="5.882" y2="0.784" stroke="#0000ff" stroke-width="0.5" />
    <line x1="0" y1="0.784" x2="0" y2="5" stroke="#0000ff" stroke-width="0.25" />
    <path d="M0.784 0.784 C0.784 1.216 0.431 1.569 0 1.569 C-0.431 1.569 -0.784 1.216 -0.784 0.784 C-0.784 0.353 -0.431 0 0 0 C0.431 0 0.784 0.353 0.784 0.784" fill="#0000ff" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7.882" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BUS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_bottom" cx="0" cy="5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7.882" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-7.882" y="9" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7.882" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7.882" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>