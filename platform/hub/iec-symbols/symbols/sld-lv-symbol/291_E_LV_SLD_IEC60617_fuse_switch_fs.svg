<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31.025 -1.6 39.025 45.7" width="39.025mm" height="45.7mm" role="img" aria-label="Fusible seccionador (FS)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionador (FS)</title>
  <desc>Fusible seccionador según leyenda. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_switch_fs" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-4.466" y1="7.309" x2="0.005" y2="16.25" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-1.672 15.691 L0.564 14.574 L-2.789 7.868 L-5.025 8.985 L-1.672 15.691" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.275" y1="6.098" x2="1.299" y2="6.098" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="6.118" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="16.25" x2="0" y2="37.5" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-7.025" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">FS</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="37.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7.025" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-7.025" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="10 kA" x="-7.025" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7.025" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>