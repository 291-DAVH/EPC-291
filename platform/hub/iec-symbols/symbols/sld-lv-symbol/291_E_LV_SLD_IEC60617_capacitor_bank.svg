<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34.75 -1.6 45.5 40.113" width="45.5mm" height="40.113mm" role="img" aria-label="Banco de capacitores (corrección FP)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Banco de capacitores (corrección FP)</title>
  <desc>Banco de capacitores trifásico para corrección del factor de potencia según IEC 60617. Tres condensadores en paralelo sobre bus común con conexión a tierra/neutro. | Origen: Dibujo propio según IEC 60617 S00459.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_capacitor_bank" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.861" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-8.75" y1="4.861" x2="8.75" y2="4.861" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5.833" y1="4.861" x2="-5.833" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-8.749" y1="7.292" x2="-2.916" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-8.749" y1="9.722" x2="-2.916" y2="9.722" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5.833" y1="9.722" x2="-5.833" y2="12.153" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="4.861" x2="0" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.916" y1="7.292" x2="2.916" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.916" y1="9.722" x2="2.916" y2="9.722" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="9.722" x2="0" y2="12.153" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="5.833" y1="4.861" x2="5.833" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="2.916" y1="7.292" x2="8.749" y2="7.292" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="2.916" y1="9.722" x2="8.749" y2="9.722" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="5.833" y1="9.722" x2="5.833" y2="12.153" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-8.75" y1="12.153" x2="8.75" y2="12.153" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.153" x2="0" y2="14.583" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.889" y1="14.583" x2="3.889" y2="14.583" stroke="#139b48" stroke-width="0.25"/>
    <line x1="-2.43" y1="16.042" x2="2.43" y2="16.042" stroke="#139b48" stroke-width="0.25"/>
    <line x1="-0.972" y1="17.5" x2="0.972" y2="17.5" stroke="#139b48" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-10.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">CAP</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_in" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-10.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_load" data-key="load" data-example="Banco FP" x="-10.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{load}</text>
    <text id="slot_kvar" data-key="kvar" data-example="100 kVAr" x="-10.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{kvar}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-10.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-10.75" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
