<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.5 -1.6 38.5 33.2" width="38.5mm" height="33.2mm" role="img" aria-label="Pulsador de paro de emergencia (seta)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pulsador de paro de emergencia (seta)</title>
  <desc>Pulsador de parada de emergencia con cabeza tipo seta según IEC 60617 S00332. Contacto NC (normalmente cerrado). Se usa en circuitos de mando para parada de emergencia. | Origen: Dibujo propio según IEC 60617 S00332.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_emergency_stop" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M4.5 7 C4.5 9.485 2.485 11.5 0 11.5 C-2.485 11.5 -4.5 9.485 -4.5 7 C-4.5 4.515 -2.485 2.5 0 2.5 C2.485 2.5 4.5 4.515 4.5 7" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.475" y1="4.525" x2="2.475" y2="9.475" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="2.475" y1="4.525" x2="-2.475" y2="9.475" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="11.5" x2="0" y2="13" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="13" x2="1.961" y2="13" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="20" x2="-3.922" y2="13" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="20" x2="0" y2="25" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <text font-family="Arial, sans-serif" x="-6.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">S</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="25" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-S0" x="-6.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_circuit" data-key="circuit" data-example="STOP" x="-6.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{circuit}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-6.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-6.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
