<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31.142 -1 39.142 19.5" width="39.142mm" height="19.5mm" role="img" aria-label="Analizador de red (AR)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Analizador de red (AR)</title>
  <desc>Caja rotulada AR para el analizador de red. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_network_analyzer_ar" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-5.142" y="0" width="10" height="12.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <text x="-0.142" y="6.862" font-size="1.7" fill="#0000ff" text-anchor="middle">AR</text>
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-7.142" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">AR</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7.142" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7.142" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_ct_ratio" data-key="ct_ratio" data-example="200/5 A" x="-7.142" y="12" font-size="1.7" text-anchor="end" fill="#000000">{ct_ratio}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7.142" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>