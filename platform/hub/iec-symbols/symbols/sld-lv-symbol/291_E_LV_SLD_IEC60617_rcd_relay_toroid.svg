    <line x1="4.601" y1="13.333" x2="7.924" y2="13.333" stroke="#0000ff" stroke-width="0.25" />
    <rect x="7.924" y="8.804" width="9.105" height="9.059" fill="none" stroke="#0000ff" stroke-width="0.25" />
