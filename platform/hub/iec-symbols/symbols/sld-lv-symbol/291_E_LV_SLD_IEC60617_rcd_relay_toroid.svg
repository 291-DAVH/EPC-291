  <text font-family="Arial, sans-serif" x="-6.505" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">RCD</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="25" r="0.6" data-dir="down" />
    <circle id="port_trip" cx="12.5" cy="5" r="0.6" data-dir="up" />
