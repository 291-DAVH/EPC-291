<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34.93 -1.6 53.959 33.2" width="53.959mm" height="33.2mm" role="img" aria-label="Relé diferencial con toroide" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Relé diferencial con toroide</title>
  <desc>Toroide sobre el conductor conectado a un relé de medida IΔ; la salida de disparo actúa sobre el interruptor asociado (MCCB/ACB). | Origen: Dibujo propio según IEC 60617 S00327 / S00333.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
