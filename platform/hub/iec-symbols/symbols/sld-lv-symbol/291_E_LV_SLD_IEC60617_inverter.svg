<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 38.5 32.87" width="38.5mm" height="32.87mm" role="img" aria-label="Inversor DC/AC" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Inversor DC/AC</title>
  <desc>Inversor o convertidor DC/AC según IEC 60617 S00451. Se usa en instalaciones fotovoltaicas, UPS y sistemas de almacenamiento de energía. | Origen: Dibujo propio según IEC 60617 S00451.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_inverter" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-5" y="2.5" width="10" height="12.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.818" y1="5.25" x2="1.818" y2="5.25" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.818" y1="6.875" x2="1.818" y2="6.875" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="8.75" x2="5" y2="8.75" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -2.182 11.5 Q -1.091 9.5 0 11.5 Q 1.091 13.5 2.182 11.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -1.091 7.55 L 0 9.25 L 1.091 7.55" fill="#0000ff" stroke="#0000ff" stroke-width="0.18"/>
    <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">INV</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-UF1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_dc_input" data-key="dc_input" data-example="750 V DC" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{dc_input}</text>
    <text id="slot_ac_output" data-key="ac_output" data-example="400 V / 50 Hz" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{ac_output}</text>
    <text id="slot_power" data-key="power" data-example="10 kW" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
