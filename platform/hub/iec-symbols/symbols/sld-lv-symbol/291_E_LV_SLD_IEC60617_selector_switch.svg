<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.412 -1.6 38.412 25.7" width="38.412mm" height="25.7mm" role="img" aria-label="Interruptor selector rotativo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Interruptor selector rotativo</title>
  <desc>Interruptor selector rotativo de 2 ó 3 posiciones (MANUAL / 0 / AUTO). Según IEC 60617 S00085. Usado para selección LOCAL/REMOTO o MANUAL/AUTO. | Origen: Dibujo propio según IEC 60617 S00085.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_selector_switch" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="3.922" x2="1.961" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.745" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.745" x2="-4.412" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M0 7.5 C0 8.715 -0.985 9.7 -2.2 9.7 C-3.415 9.7 -4.4 8.715 -4.4 7.5 C-4.4 6.285 -3.415 5.3 -2.2 5.3 C-0.985 5.3 0 6.285 0 7.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.2" y1="7.5" x2="-2.2" y2="5.3" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M0 7.5 C0 6.285 -0.985 5.3 -2.2 5.3" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-6.412" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SA</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-S1" x="-6.412" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_positions" data-key="positions" data-example="MAN/0/AUTO" x="-6.412" y="9" font-size="1.7" text-anchor="end" fill="#000000">{positions}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-6.412" y="12" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-6.412" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-6.412" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
