<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -3.45 48 24.5" width="48mm" height="24.5mm" role="img" aria-label="Transformador de tensión (TT)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Transformador de tensión (TT)</title>
  <desc>Dos círculos solapados con estrella (Y) y derivación. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_vt" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-10" y1="5" x2="-7.5" y2="5" stroke="#0000ff" stroke-width="0.25" />
    <path d="M2.5 5 C2.5 7.761 0.261 10 -2.5 10 C-5.261 10 -7.5 7.761 -7.5 5 C-7.5 2.239 -5.261 0 -2.5 0 C0.261 0 2.5 2.239 2.5 5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M7.5 5 C7.5 7.761 5.261 10 2.5 10 C-0.261 10 -2.5 7.761 -2.5 5 C-2.5 2.239 -0.261 0 2.5 0 C5.261 0 7.5 2.239 7.5 5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="7.5" y1="5" x2="10" y2="5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.5" y1="5" x2="-2.5" y2="7" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.5" y1="5" x2="-4.2" y2="4" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.5" y1="5" x2="-0.8" y2="4" stroke="#0000ff" stroke-width="0.25" />
    <line x1="2.5" y1="5" x2="2.5" y2="7" stroke="#0000ff" stroke-width="0.25" />
    <line x1="2.5" y1="5" x2="0.8" y2="4" stroke="#0000ff" stroke-width="0.25" />
    <line x1="2.5" y1="5" x2="4.2" y2="4" stroke="#0000ff" stroke-width="0.25" />
  </g>
  
  <text font-family="Arial, sans-serif" x="-12" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">VT</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_primary" cx="-10" cy="5" r="0.6" data-dir="left" />
    <circle id="port_secondary" cx="10" cy="5" r="0.6" data-dir="right" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-12" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_vt_ratio" data-key="vt_ratio" data-example="400/100 V" x="-12" y="9" font-size="1.7" text-anchor="end" fill="#000000">{vt_ratio}</text>
    <text id="slot_accuracy_class" data-key="accuracy_class" data-example="0,5S" x="-12" y="12" font-size="1.7" text-anchor="end" fill="#000000">{accuracy_class}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-12" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>