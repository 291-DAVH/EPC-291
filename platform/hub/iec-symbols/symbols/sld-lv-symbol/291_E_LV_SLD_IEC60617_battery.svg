<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.75 -1.6 38 36.62" width="38mm" height="36.62mm" role="img" aria-label="Batería / acumulador" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Batería / acumulador</title>
  <desc>Batería de acumuladores según IEC 60617 S00257. Se usa en circuitos de alimentación de emergencia (UPS, SAI, SCADA). | Origen: Dibujo propio según IEC 60617 S00257.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_battery" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.75" y1="2.5" x2="3.75" y2="2.5" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="-1.875" y1="5" x2="1.875" y2="5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="5" x2="0" y2="7.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.75" y1="7.5" x2="3.75" y2="7.5" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="-1.875" y1="10" x2="1.875" y2="10" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10" x2="0" y2="12.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="4.688" y="3.3" font-size="1.7" fill="#0000ff" text-anchor="start">+</text>
    <text x="4.688" y="11.5" font-size="1.7" fill="#0000ff" text-anchor="start">−</text>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-5.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BAT</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="12.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-GB1" x="-5.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="48 V DC" x="-5.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_capacity" data-key="capacity" data-example="100 Ah" x="-5.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{capacity}</text>
    <text id="slot_cells" data-key="cells" data-example="2×12 V" x="-5.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{cells}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.75" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
