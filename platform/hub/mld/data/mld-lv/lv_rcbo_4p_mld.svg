  <desc>RCBO de 4 polo(s): el símbolo lv_rcbo repetido en cada polo, con un único toroide que abarca todos los polos y un solo relé IΔ en el último polo, cuyo enlace discontinuo llega hasta el primer polo (todos abren y cierran juntos, S00295). Solo existe en 1P, 2P y 4P. | Origen: Dibujo propio según IEC 60617 S00287 / S00295 / S00327. Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
