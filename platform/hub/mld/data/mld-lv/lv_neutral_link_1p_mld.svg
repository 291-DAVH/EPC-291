<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16.64 -4.62 22.62 21.23" width="22.62mm" height="21.23mm" role="img" aria-label="Enlace de neutro 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Enlace de neutro 1P (multifilar)</title>
  <desc>Enlace de neutro de 1 polo en formato multifilar. Mismo símbolo que SLD. | Origen: Dibujo propio.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_neutral_link_1p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="3.922" x2="1.5" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10" x2="-3" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">N</text>
    <text x="3" y="13" font-size="2.5" fill="#000000" text-anchor="start">2</text>
    <text x="3" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">1</text>
    <text x="-5.5" y="4.902" font-size="3.47" fill="#000000" text-anchor="end" font-weight="bold">N</text>
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_N" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_N" cx="0" cy="15" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-N1" x="-5.5" y="9.312" font-size="3.47" text-anchor="end">{tag}</text>
  </g>
</svg>
