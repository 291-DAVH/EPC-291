<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36.73 -12.12 71.43 40.23" width="71.43mm" height="40.23mm" role="img" aria-label="Transferencia automática (ATS) 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transferencia automática (ATS) 3P (multifilar)</title>
  <desc>Interruptor de transferencia automática de 3 polos en formato multifilar. Puertos top_S1 = Fuente 1 (normal), top_S2 = Fuente 2 (grupo). Puerto bot = salida. | Origen: Dibujo propio.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ats_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">S1-L1</text>
    <line x1="12.5" y1="0" x2="12.5" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="13.725" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">S1-L2</text>
    <line x1="25" y1="0" x2="25" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="26.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">S1-L3</text>
    <line x1="0" y1="-7.5" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="1.225" y="-8.725" font-size="2.5" fill="#000000" text-anchor="start">S2-L1</text>
    <line x1="12.5" y1="-7.5" x2="12.5" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="13.725" y="-8.725" font-size="2.5" fill="#000000" text-anchor="start">S2-L2</text>
    <line x1="25" y1="-7.5" x2="25" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="26.225" y="-8.725" font-size="2.5" fill="#000000" text-anchor="start">S2-L3</text>
    <rect x="-5" y="4.902" width="35" height="17.098" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="12.5" y="11.741" font-size="3.922" fill="#0000ff" text-anchor="middle" font-weight="bold">ATS</text>
    <line x1="0" y1="22" x2="0" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="12.5" y1="22" x2="12.5" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="25" y1="22" x2="25" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1" y="-3.3" font-size="2.5" fill="#000000" text-anchor="start">1</text>
    <text x="1" y="25" font-size="2.5" fill="#000000" text-anchor="start">4</text>
    <text x="13.5" y="-3.3" font-size="2.5" fill="#000000" text-anchor="start">2</text>
    <text x="13.5" y="25" font-size="2.5" fill="#000000" text-anchor="start">5</text>
    <text x="26" y="-3.3" font-size="2.5" fill="#000000" text-anchor="start">3</text>
    <text x="26" y="25" font-size="2.5" fill="#000000" text-anchor="start">6</text>
    <text x="-6.5" y="6.902" font-size="3.47" fill="#000000" text-anchor="end" font-weight="bold">ATS</text>
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_S1_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S1_L2" cx="12.5" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S1_L3" cx="25" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L1" cx="0" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L2" cx="12.5" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L3" cx="25" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_bot_L1" cx="0" cy="26.5" r="0.6" data-dir="down"/>
    <circle id="port_bot_L2" cx="12.5" cy="26.5" r="0.6" data-dir="down"/>
    <circle id="port_bot_L3" cx="25" cy="26.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q0" x="-6.5" y="11.812" font-size="3.47" text-anchor="end">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="250 A" x="-6.5" y="16.222" font-size="3.47" text-anchor="end">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-6.5" y="20.632" font-size="3.47" text-anchor="end">{voltage}</text>
  </g>
</svg>
