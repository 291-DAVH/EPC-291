<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55.85 -4.83 87.24 28.93" width="87.24mm" height="28.93mm" role="img" aria-label="Fusible seccionable NH00 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionable NH00 3P (multifilar)</title>
  <desc>Fusible seccionable NH00 de 3 polo(s): el símbolo lv_fuse_disconnector_nh00 repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse_disconnector_nh00 (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_disconnector_nh00_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-1.632" y="8.074" width="3.265" height="9.794" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="4.809" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="6.441" x2="0" y2="19.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="21.132" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
