    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L1</text>
    <rect x="10.868" y="8.074" width="3.265" height="9.794" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="0" x2="12.5" y2="4.809" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="6.441" x2="12.5" y2="19.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="21.132" x2="12.5" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10.868" y1="4.804" x2="14.132" y2="4.804" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10.868" y1="21.127" x2="14.132" y2="21.127" stroke="#0000ff" stroke-width="0.25" />
    <text x="13.725" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L2</text>
