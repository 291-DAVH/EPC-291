upstream epc_api {
    server backend:8000;
}

server {
    listen 8080;
    root /usr/share/nginx/html/web;
    location /api/ { proxy_pass http://epc_api; client_max_body_size 30m; }
    location / { try_files $uri /index.html; }
}

# Technical console: publish it only on an internal network and run the API for it with EPC_ROLE=admin.
server {
    listen 8081;
    root /usr/share/nginx/html/console;
    location /api/ { proxy_pass http://epc_api; }
    location / { try_files $uri /index.html; }
}
