<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.58 -4.62 56.18 26.05" width="56.18mm" height="26.05mm" role="img" aria-label="Generador trifásico 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Generador trifásico 3P (multifilar)</title>
  <desc>Generador trifásico de 3 polos en formato multifilar. Dispositivo terminal. Caja con símbolo de generador (círculo G 3~) según IEC 60617. | Origen: Dibujo propio según IEC 60617 S00614.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_generator_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L1</text>
    <line x1="12.5" y1="0" x2="12.5" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="13.725" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L2</text>
    <line x1="25" y1="0" x2="25" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="26.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L3</text>
    <rect x="-5" y="4.902" width="35" height="12.745" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M16.5 11.274 C16.5 13.484 14.709 15.274 12.5 15.274 C10.291 15.274 8.5 13.484 8.5 11.274 C8.5 9.065 10.291 7.274 12.5 7.274 C14.709 7.274 16.5 9.065 16.5 11.274" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="12.5" y="12.745" font-size="5.392" fill="#0000ff" text-anchor="middle" font-weight="bold">G</text>
    <text x="12.5" y="14.784" font-size="3.47" fill="#0000ff" text-anchor="middle">3~</text>
    <text x="-5.8" y="5.902" font-size="3.47" fill="#000000" text-anchor="end" font-weight="bold">GEN</text>
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L2" cx="12.5" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L3" cx="25" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-G1" x="-5.8" y="10.312" font-size="3.47" text-anchor="end">{tag}</text>
    <text id="slot_power" data-key="power" data-example="500 kVA" x="-5.8" y="14.722" font-size="3.47" text-anchor="end">{power}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.8" y="19.132" font-size="3.47" text-anchor="end">{voltage}</text>
  </g>
</svg>
