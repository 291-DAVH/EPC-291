<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.58 -4.62 56.18 33.87" width="56.18mm" height="33.87mm" role="img" aria-label="Banco de capacitores 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Banco de capacitores 3P (multifilar)</title>
  <desc>Banco de capacitores trifásico de 3 polos en formato multifilar. Dispositivo terminal (shunt). Caja con símbolo de condensador según IEC 60617. | Origen: Dibujo propio según IEC 60617 S00459.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_capacitor_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L1</text>
    <line x1="12.5" y1="0" x2="12.5" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="13.725" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L2</text>
    <line x1="25" y1="0" x2="25" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="26.225" y="-1.225" font-size="2.5" fill="#000000" text-anchor="start">L3</text>
    <rect x="-5" y="4.902" width="35" height="12.745" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="12.5" y1="4.902" x2="12.5" y2="9.804" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="8.5" y1="9.804" x2="16.5" y2="9.804" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="8.5" y1="12.255" x2="16.5" y2="12.255" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="12.5" y1="12.255" x2="12.5" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    <text x="-5.8" y="13.722" font-size="3.47" fill="#000000" text-anchor="end" font-weight="bold">CAP</text>
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L2" cx="12.5" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L3" cx="25" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-5.8" y="18.132" font-size="3.47" text-anchor="end">{tag}</text>
    <text id="slot_kvar" data-key="kvar" data-example="100 kVAr" x="-5.8" y="22.542" font-size="3.47" text-anchor="end">{kvar}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.8" y="26.952" font-size="3.47" text-anchor="end">{voltage}</text>
  </g>
</svg>
