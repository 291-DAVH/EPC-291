<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55.85 -4.83 60.16 28.93" width="60.16mm" height="28.93mm" role="img" aria-label="Fusible seccionable NH00 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionable NH00 1P (multifilar)</title>
  <desc>Fusible seccionable NH00 de 1 polo(s): el símbolo lv_fuse_disconnector_nh00 repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse_disconnector_nh00 (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_disconnector_nh00_1p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-1.632" y="7.451" width="3.265" height="10.217" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="4.045" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="5.748" x2="0" y2="19.37" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="21.073" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="4.04" x2="1.632" y2="4.04" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="21.068" x2="1.632" y2="21.068" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L</text>
    <text x="-15.279" y="9.153" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">NH00</text>
  
    <g id="terminal_marks" font-family="Arial, sans-serif"><text x="1" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">1</text><text x="1" y="21.5" font-size="2.5" fill="#000000" text-anchor="start">2</text></g></g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Sch. Electric" x="-15.284" y="3.615" font-size="3.47" text-anchor="end">{manufacturer}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="50 A" x="-15.304" y="15.32" font-size="3.47" text-anchor="end">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="100 kA" x="-15.294" y="21.81" font-size="3.47" text-anchor="end">{breaking_capacity}</text>
  </g>
</svg>