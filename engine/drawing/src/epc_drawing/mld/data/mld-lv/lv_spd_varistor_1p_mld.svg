<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.69 -4.83 56.13 28.93" width="56.13mm" height="28.93mm" role="img" aria-label="Descargador de sobretensión (SPD) con varistor 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Descargador de sobretensión (SPD) con varistor 1P (multifilar)</title>
  <desc>Descargador de sobretensión (SPD) con varistor de 1 polo(s): el símbolo lv_spd_varistor repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_spd_varistor (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_spd_varistor_1p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-2.074" y="3.446" width="4.147" height="16.618" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-3.426 17.784 L-3.426 16.034 L3.441 7.358 L3.441 5.52" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="3.446" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="20.064" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L</text>
    <text x="-15.289" y="6.064" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">SPD</text>
  </g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_class" data-key="class" data-example="Type II" x="-15.289" y="11.961" font-size="3.47" text-anchor="end">{class}</text>
    <text id="slot_impulse_current" data-key="impulse_current" data-example="65 kA" x="-15.299" y="18.196" font-size="3.47" text-anchor="end">{impulse_current}</text>
  </g>
</svg>