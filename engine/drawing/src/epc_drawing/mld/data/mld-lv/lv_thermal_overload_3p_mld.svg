<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19.9 -4.83 52.43 20.73" width="52.43mm" height="20.73mm" role="img" aria-label="Relé térmico de sobrecarga 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Relé térmico de sobrecarga 3P (multifilar)</title>
  <desc>Relé térmico de sobrecarga de 3 polo(s): el símbolo lv_thermal_overload repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_thermal_overload (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm (polos pegados). x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_thermal_overload_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-6.529" y="2.941" width="12.779" height="7.843" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-1.716 8.824 L-1.716 6.863 L1.716 6.863 L1.716 4.902" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.784" x2="0" y2="12.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L1</text>
    <line x1="12.5" y1="0" x2="12.5" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="6.25" y="2.941" width="12.5" height="7.843" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M10.784 8.824 L10.784 6.863 L14.216 6.863 L14.216 4.902" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="10.784" x2="12.5" y2="12.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="13.725" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L2</text>
    <line x1="25" y1="0" x2="25" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="18.75" y="2.941" width="12.779" height="7.843" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M23.284 8.824 L23.284 6.863 L26.716 6.863 L26.716 4.902" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="25" y1="10.784" x2="25" y2="12.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="26.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L3</text>
    <text x="-8.49" y="3.922" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">OL</text>
  
    <g id="terminal_marks" font-family="Arial, sans-serif"><text x="1" y="2.4" font-size="2.5" fill="#000000" text-anchor="start">1</text><text x="1" y="15.1" font-size="2.5" fill="#000000" text-anchor="start">2</text><text x="13.5" y="2.4" font-size="2.5" fill="#000000" text-anchor="start">3</text><text x="13.5" y="15.1" font-size="2.5" fill="#000000" text-anchor="start">4</text><text x="26" y="2.4" font-size="2.5" fill="#000000" text-anchor="start">5</text><text x="26" y="15.1" font-size="2.5" fill="#000000" text-anchor="start">6</text></g></g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L2" cx="12.5" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L3" cx="25" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L1" cx="0" cy="12.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_L2" cx="12.5" cy="12.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_L3" cx="25" cy="12.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-8.49" y="8.333" font-size="3.47" text-anchor="end">{tag}</text>
  </g>
</svg>