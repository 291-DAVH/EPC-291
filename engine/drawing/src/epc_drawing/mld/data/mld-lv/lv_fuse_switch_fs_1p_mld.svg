<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18.37 -4.83 22.68 43.93" width="22.68mm" height="43.93mm" role="img" aria-label="Fusible seccionador (FS) 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionador (FS) 1P (multifilar)</title>
  <desc>Fusible seccionador (FS) de 1 polo(s): el símbolo lv_fuse_switch_fs repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse_switch_fs (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
