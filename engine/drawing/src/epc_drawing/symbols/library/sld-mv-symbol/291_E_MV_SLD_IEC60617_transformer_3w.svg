<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-37 -1.6 50 49.12" width="50mm" height="49.12mm" role="img" aria-label="Transformador de tres devanados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transformador de tres devanados</title>
  <desc>Transformador de tres devanados según IEC 60617 S00322. Bobinas primaria, secundaria y terciaria. | Origen: Dibujo propio según IEC 60617 S00322.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_transformer_3w" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="13.25" x2="5" y2="13.25" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="14.25" x2="5" y2="14.25" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-1 20 C-1 22.761 -3.239 25 -6 25 C-8.761 25 -11 22.761 -11 20 C-11 17.239 -8.761 15 -6 15 C-3.239 15 -1 17.239 -1 20" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-6" y1="25" x2="-6" y2="27.5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M11 20 C11 22.761 8.761 25 6 25 C3.239 25 1 22.761 1 20 C1 17.239 3.239 15 6 15 C8.761 15 11 17.239 11 20" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="6" y1="25" x2="6" y2="27.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-13" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">T</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_bottom_secondary" cx="-6" cy="27.5" r="0.6" data-dir="down"/>
    <circle id="port_bottom_tertiary" cx="6" cy="27.5" r="0.6" data-dir="down"/>
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-T1" x="-13" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_power" data-key="power" data-example="1600 kVA" x="-13" y="9" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_ratio_prim" data-key="ratio_prim" data-example="20/6.6/0.4 kV" x="-13" y="12" font-size="1.7" text-anchor="end" fill="#000000">{ratio_prim}</text>
    <text id="slot_vector" data-key="vector" data-example="YNd11" x="-13" y="15" font-size="1.7" text-anchor="end" fill="#000000">{vector}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-13" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
