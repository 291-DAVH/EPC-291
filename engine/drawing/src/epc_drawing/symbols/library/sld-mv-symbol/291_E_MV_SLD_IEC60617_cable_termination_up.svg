<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1 39.588 20.1" width="39.588mm" height="20.1mm" role="img" aria-label="Terminal de cable (hacia arriba)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Terminal de cable (hacia arriba)</title>
  <desc>Triángulo relleno invertido (terminal de cable de remonte). | Origen: Lámina 1 (108-2026-SOXXXXXX-E-DU-001)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_cable_termination_up" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.011" stroke="#0000ff" stroke-width="0.25" />
    <path d="M -5 12.5 L 5 12.5 L 0 2.5 Z" fill="#0000ff" stroke="#0000ff" stroke-width="0.18" />
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">TERM</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_cable" cx="0" cy="12.5" r="0.6" data-dir="down" />
    <circle id="port_top" cx="0" cy="2.5" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_cable_spec" data-key="cable_spec" data-example="3x2.5 mm2" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{cable_spec}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>