<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-57.544 -1 65.544 21.56" width="65.544mm" height="21.56mm" role="img" aria-label="Indicador capacitivo de presencia de tensión" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Indicador capacitivo de presencia de tensión</title>
  <desc>Derivación capacitiva con borne indicador (semicírculo). Aparece en cada celda. | Origen: Lámina 1 (108-2026-SOXXXXXX-E-DU-001). Identificación por forma; el original no lo rotula.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_vpis" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <path d="M-31.544 10.672 C-29.775 10.672 -28.343 9.24 -28.343 7.476 C-28.343 5.74 -29.775 4.337 -31.544 4.337" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-28.343" y1="7.5" x2="-17.99" y2="7.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-13.461" y1="7.5" x2="0" y2="7.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="14.559" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-17.99" y1="3.038" x2="-17.99" y2="11.995" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-13.48" y1="3.038" x2="-13.48" y2="11.995" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-33.544" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">VPIS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_conn" cx="0" cy="7.5" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-33.544" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-33.544" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_class" data-key="class" data-example="Clase II" x="-33.544" y="12" font-size="1.7" text-anchor="end" fill="#000000">{class}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-33.544" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>