<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.431 -1.6 37.431 25.74" width="37.431mm" height="25.74mm" role="img" aria-label="Seccionador de puesta a tierra" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Seccionador de puesta a tierra</title>
  <desc>Cuchilla lateral hacia símbolo de tierra. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_earthing_switch" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="10.784" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.784" x2="5.882" y2="5.882" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.784" x2="0" y2="14.706" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.431" y1="14.706" x2="3.431" y2="14.706" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.206" y1="16.422" x2="2.206" y2="16.422" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-0.98" y1="18.137" x2="0.98" y2="18.137" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-5.431" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">ES</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-5.431" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.431" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-5.431" y="12" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_short_circuit_current" data-key="short_circuit_current" data-example="25 kA" x="-5.431" y="15" font-size="1.7" text-anchor="end" fill="#000000">{short_circuit_current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.431" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>