<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.75 -1.6 38 33.62" width="38mm" height="33.62mm" role="img" aria-label="Resistencia de puesta a tierra del neutro (NER)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Resistencia de puesta a tierra del neutro (NER)</title>
  <desc>Resistencia de puesta a tierra del neutro según IEC 60617 S00337. Limita la corriente de falta monofásica en sistemas MV puestos a tierra a través de resistencia. | Origen: Dibujo propio según IEC 60617 S00337.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_neutral_earthing_resistor" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.419" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-2.679" y="2.419" width="5.357" height="7.258" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="-0" y="6.66" font-size="1.7" fill="#0000ff" text-anchor="middle">R</text>
    <line x1="0" y1="9.677" x2="0" y2="12.097" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-3.75" y1="12.097" x2="3.75" y2="12.097" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.679" y1="13.548" x2="2.679" y2="13.548" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.607" y1="15" x2="1.607" y2="15" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-5.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">NER</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-R1" x="-5.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_resistance" data-key="resistance" data-example="40 Ω" x="-5.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{resistance}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-5.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_time" data-key="time" data-example="10 s" x="-5.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{time}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.75" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
