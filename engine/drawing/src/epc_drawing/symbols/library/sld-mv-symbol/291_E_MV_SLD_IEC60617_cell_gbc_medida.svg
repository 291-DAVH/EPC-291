  <desc>Celda SM AirSET GBC: conexión barra-barra con transformadores de corriente en serie y transformadores de tensión con fusibles. | Origen: Dibujo propio según IEC 60617 S00850 / S00878 / S00362. Celda de fabricante: armada con símbolos IEC y el mismo estilo que mv_cell_im_interruptor. La barra queda cortada: entra por la izquierda y sale por la derecha.</desc>
  
