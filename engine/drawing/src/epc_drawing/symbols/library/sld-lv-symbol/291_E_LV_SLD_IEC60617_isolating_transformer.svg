<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 39 42.21" width="39mm" height="42.21mm" role="img" aria-label="Transformador de aislamiento" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transformador de aislamiento</title>
  <desc>Transformador de aislamiento con pantalla electrostática según IEC 60617 S00323. Se usa para separar galvánicamente circuitos y eliminar ruido de modo común. | Origen: Dibujo propio según IEC 60617 S00323.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_isolating_transformer" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="12.5" x2="5" y2="12.5" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="1.5 1.5"/>
    <path d="M5 17.5 C5 20.261 2.761 22.5 0 22.5 C-2.761 22.5 -5 20.261 -5 17.5 C-5 14.739 -2.761 12.5 0 12.5 C2.761 12.5 5 14.739 5 17.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="22.5" x2="0" y2="25" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">TI</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="25" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-T1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_ratio" data-key="ratio" data-example="230/230 V" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{ratio}</text>
    <text id="slot_power" data-key="power" data-example="1 kVA" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
