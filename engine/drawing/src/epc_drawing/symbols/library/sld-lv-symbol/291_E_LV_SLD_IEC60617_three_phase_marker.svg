<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.377 -1 37.377 18.27" width="37.377mm" height="18.27mm" role="img" aria-label="Marcador 3 fases + neutro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Marcador 3 fases + neutro</title>
  <desc>Trazos oblicuos con círculo que indican 3 fases más neutro sobre un conductor. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_three_phase_marker" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-3.377" y1="6.265" x2="1.623" y2="3.765" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.377" y1="3.765" x2="0.505" y2="1.824" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.377" y1="8.765" x2="1.623" y2="6.265" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.377" y1="11.265" x2="1.623" y2="8.765" stroke="#0000ff" stroke-width="0.25" />
    <path d="M2.887 1.26 C2.887 0.564 2.324 0 1.627 0 C0.936 0 0.373 0.564 0.373 1.26 C0.373 1.951 0.936 2.515 1.627 2.515 C2.324 2.515 2.887 1.951 2.887 1.26" fill="none" stroke="#0000ff" stroke-width="0.25" />
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-5.377" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">3PH</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
