    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.377" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.377" y="12" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
