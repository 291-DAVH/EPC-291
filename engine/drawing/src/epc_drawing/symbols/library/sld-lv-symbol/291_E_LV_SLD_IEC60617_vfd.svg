<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -4.5 52.316 33.6" width="52.316mm" height="33.6mm" role="img" aria-label="Variador de frecuencia (VFD)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Variador de frecuencia (VFD)</title>
  <desc>Caja con rótulo VFD y corriente nominal. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_vfd" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-10" y="4.902" width="20" height="13.725" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="18.627" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="12.377" font-size="1.7" text-anchor="middle" fill="#0000ff">VFD</text>
  </g>
  
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-12" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">VFD</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="TAG-01" x="-12" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="6.0A" x="-12" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_power_kw" data-key="power_kw" data-example="15 kW" x="-12" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power_kw}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-12" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-12" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>