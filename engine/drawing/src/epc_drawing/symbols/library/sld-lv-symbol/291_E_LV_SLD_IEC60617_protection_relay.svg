<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45.218 -1.6 64.105 22.637" width="64.105mm" height="22.637mm" role="img" aria-label="Relé de protección" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Relé de protección</title>
  <desc>Relé de medida (IEC 60617 S00327): caja con las funciones ANSI como dato variable. Entrada desde TI/TT arriba, salida de disparo a la derecha. | Origen: Dibujo propio según IEC 60617 S00327 / S00342.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_protection_relay" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0.074" y1="0" x2="0.074" y2="3.889" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-13.113" y="3.889" width="26.265" height="11.111" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="13.151" y1="9.444" x2="16.887" y2="9.444" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-15.113" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">RELAY</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0.074" cy="0" r="0.6" data-dir="up" />
    <circle id="port_trip" cx="16.887" cy="9.444" r="0.6" data-dir="right" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-F11" x="-15.113" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_ansi_functions" data-key="ansi_functions" data-example="50/51 50N/51N" x="-15.113" y="9" font-size="1.7" text-anchor="end" fill="#000000">{ansi_functions}</text>
    <text id="slot_model" data-key="model" data-example="VIP 40" x="-15.113" y="12" font-size="1.7" text-anchor="end" fill="#000000">{model}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Sch. Electric" x="-15.113" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>