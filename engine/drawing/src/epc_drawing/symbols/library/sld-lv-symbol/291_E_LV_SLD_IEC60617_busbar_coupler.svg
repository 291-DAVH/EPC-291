<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-41 -11.1 58 23.1" width="58mm" height="23.1mm" role="img" aria-label="Acoplador de barras" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Acoplador de barras</title>
  <desc>Interruptor de acoplamiento de barras (bus tie) según IEC 60617. Conecta o separa dos secciones de barras colectoras en un TGBT. | Origen: Dibujo propio según IEC 60617.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_busbar_coupler" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-15" y1="0" x2="-5" y2="0" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="0" x2="-5" y2="-3" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5" y1="0" x2="-5" y2="3" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-6.5" y1="0" x2="-3.5" y2="0" stroke="#0000ff" stroke-width="0.375"/>
    <line x1="-5" y1="0" x2="2" y2="-5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="3.5" y1="0" x2="6.5" y2="0" stroke="#0000ff" stroke-width="0.375"/>
    <line x1="5" y1="0" x2="15" y2="0" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-17" y="1" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BUS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_left" cx="-15" cy="0" r="0.6" data-dir="left"/>
    <circle id="port_right" cx="15" cy="0" r="0.6" data-dir="right"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q7" x="-17" y="-2.8" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-17" y="4" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-17" y="7" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-17" y="10" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
