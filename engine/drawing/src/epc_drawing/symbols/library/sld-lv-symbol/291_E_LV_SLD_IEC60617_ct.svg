<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.713 -1.6 44.213 23.2" width="44.213mm" height="23.2mm" role="img" aria-label="Transformador de corriente (TI)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Transformador de corriente (TI)</title>
  <desc>Círculo sobre el conductor (primario) con salida de secundario a la derecha. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ct" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="5" y1="7.5" x2="12.5" y2="7.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="15" stroke="#ff0000" stroke-width="0.25" />
  </g>
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">CT</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="15" r="0.6" data-dir="down" />
    <circle id="port_secondary" cx="12.5" cy="7.5" r="0.6" data-dir="right" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_ct_ratio" data-key="ct_ratio" data-example="200/5 A" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{ct_ratio}</text>
    <text id="slot_accuracy_class" data-key="accuracy_class" data-example="0,5S" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{accuracy_class}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>