<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 40.569 28.62" width="40.569mm" height="28.62mm" role="img" aria-label="Lámpara piloto / presencia de tensión" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Lámpara piloto / presencia de tensión</title>
  <desc>Lámpara de señalización (IEC 60617 S00965): círculo con cruz entre fase y neutro. | Origen: Dibujo propio según IEC 60617 S00965.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_pilot_lamp" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25" />
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-3.54" y1="3.96" x2="3.54" y2="11.04" stroke="#0000ff" stroke-width="0.25" />
    <line x1="3.54" y1="3.96" x2="-3.54" y2="11.04" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="12.5" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25" />
  </g>
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">H</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="15" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-H1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_color" data-key="color" data-example="RD" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{color}</text>
    <text id="slot_voltage" data-key="voltage" data-example="230 V" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>