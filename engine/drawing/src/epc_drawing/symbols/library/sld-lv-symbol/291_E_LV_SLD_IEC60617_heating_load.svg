<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 40 27.21" width="40mm" height="27.21mm" role="img" aria-label="Carga resistiva / calefacción" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Carga resistiva / calefacción</title>
  <desc>Elemento calefactor resistivo según IEC 60617 S00785. Se usa para circuitos de calefacción eléctrica, traceado térmico, resistencias. | Origen: Dibujo propio según IEC 60617 S00785.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_heating_load" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-5" y="2.5" width="10" height="10" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-3 5 L0 10 L3 5" fill="none" stroke="#0000ff" stroke-width="0.25" />
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">EH</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-EH1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_power_kw" data-key="power_kw" data-example="3 kW" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{power_kw}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
