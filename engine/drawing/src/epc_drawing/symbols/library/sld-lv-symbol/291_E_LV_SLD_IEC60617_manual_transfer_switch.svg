<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.804 -4.62 47.608 37.89" width="47.608mm" height="37.89mm" role="img" aria-label="Interruptor de transferencia manual (MTS)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Interruptor de transferencia manual (MTS)</title>
  <desc>Interruptor de transferencia manual con dos entradas de alimentación (A y B) y una salida. Actuador manual tipo T. Para transferencia de emergencia sin automatismo. | Origen: Dibujo propio según IEC 60617 S00335 / IEC 61008.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_manual_transfer_switch" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <text x="-7.475" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="end">A</text>
    <text x="7.475" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">B</text>
    <line x1="-6.25" y1="0" x2="-6.25" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="6.25" y1="0" x2="6.25" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="3.922" x2="0" y2="1.471" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.451" y1="1.471" x2="2.451" y2="1.471" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-9.804" y="3.922" width="19.608" height="13.725" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-7.475" y1="7.844" x2="-5.025" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="5.025" y1="7.844" x2="7.475" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-6.25" y1="3.922" x2="-6.25" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="6.25" y1="3.922" x2="6.25" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M0.6 14.216 C0.6 14.547 0.331 14.816 0 14.816 C-0.331 14.816 -0.6 14.547 -0.6 14.216 C-0.6 13.885 -0.331 13.616 0 13.616 C0.331 13.616 0.6 13.885 0.6 14.216" fill="#0000ff" stroke="#0000ff" stroke-width="0.18"/>
    <line x1="0" y1="14.216" x2="-6.25" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="14.216" x2="6.25" y2="7.844" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="2 1"/>
    <line x1="0" y1="14.216" x2="0" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="17.647" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-11.804" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">MTS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_in_a" cx="-6.25" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_in_b" cx="6.25" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_out" cx="0" cy="22.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q0" x="-11.804" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_load" data-key="load" data-example="Panel B" x="-11.804" y="9" font-size="1.7" text-anchor="end" fill="#000000">{load}</text>
    <text id="slot_current" data-key="current" data-example="630 A" x="-11.804" y="12" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-11.804" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-11.804" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
