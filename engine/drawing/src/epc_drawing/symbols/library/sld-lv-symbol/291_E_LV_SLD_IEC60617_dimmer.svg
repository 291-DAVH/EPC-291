<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34.75 -1.6 45.5 34.87" width="45.5mm" height="34.87mm" role="img" aria-label="Regulador de alumbrado (dimmer)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Regulador de alumbrado (dimmer)</title>
  <desc>Regulador de intensidad lumínica (TRIAC/SCR) para cargas de alumbrado AC. Símbolo de caja con flecha de control variable según IEC 60617 S00513. | Origen: Dibujo propio según IEC 60617 S00513.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_dimmer" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="18.628" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-8.75" y="3.922" width="17.5" height="14.706" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-5.833" y1="14.706" x2="5.833" y2="7.844" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="5.833" y1="7.844" x2="4.848" y2="9.118" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="5.833" y1="7.844" x2="4.248" y2="8.082" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -2.975 15.687 C -2.975 14.187 0 14.187 0 15.687 C 0 17.187 2.975 17.187 2.975 15.687" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-10.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">DIM</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_in" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_out" cx="0" cy="22.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-DIM1" x="-10.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_load" data-key="load" data-example="Alumbrado" x="-10.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{load}</text>
    <text id="slot_power" data-key="power" data-example="2.5 kW" x="-10.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-10.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
