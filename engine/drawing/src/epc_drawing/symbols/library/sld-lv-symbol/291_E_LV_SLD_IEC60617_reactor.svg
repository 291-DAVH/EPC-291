<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27.09 -1.6 35.09 37.21" width="35.09mm" height="37.21mm" role="img" aria-label="Reactor / inductancia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Reactor / inductancia</title>
  <desc>Bobina de inductancia o reactor de potencia según IEC 60617 S00310. Se usa como choke de entrada de VFD, reactancia limitadora de corriente o reactor de filtro. | Origen: Dibujo propio según IEC 60617 S00310.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_reactor" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.574" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M 0 2.574 Q 3 4.118 0 5.662 Q 3 7.206 0 8.75 Q 3 10.294 0 11.838 Q 3 13.382 0 14.926" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="14.926" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-2" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">L</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-L1" x="-2" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_impedance" data-key="impedance" data-example="4%" x="-2" y="9" font-size="1.7" text-anchor="end" fill="#000000">{impedance}</text>
    <text id="slot_power" data-key="power" data-example="30 kVA" x="-2" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-2" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
