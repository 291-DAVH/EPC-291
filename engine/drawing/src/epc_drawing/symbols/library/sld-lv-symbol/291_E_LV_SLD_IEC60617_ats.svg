<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48.11 -4.83 62.071 31.43" width="62.071mm" height="31.43mm" role="img" aria-label="Transferencia automática (ATS)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Transferencia automática (ATS)</title>
  <desc>Dos interruptores-seccionadores (S00290) con enclavamiento mecánico y mando automático común; dos entradas (red / grupo) y una salida. | Origen: Dibujo propio según IEC 60617 S00290 / S00295.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ats" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-10" y1="0" x2="-10" y2="5.392" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-11.961" y1="5.392" x2="-8" y2="5.392" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-10" y1="15.196" x2="-13.922" y2="6.863" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-10" y1="15.196" x2="-10" y2="18.137" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="5.392" stroke="#0000ff" stroke-width="0.25" />
    <line x1="8" y1="5.392" x2="11.961" y2="5.392" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="15.196" x2="6" y2="6.863" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="15.196" x2="10" y2="18.137" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-10" y1="18.137" x2="10" y2="18.137" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="18.137" x2="0" y2="25" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-4" y="7.108" width="8" height="4.412" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="9.926" font-size="1.7" fill="#0000ff" text-anchor="middle">ATS</text>
    <line x1="-12.77" y1="9.314" x2="-4" y2="9.314" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <line x1="4" y1="9.314" x2="7.175" y2="9.314" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <text x="-10" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="middle">1</text>
    <text x="10" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="middle">2</text>
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-15.922" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">ATS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_1" cx="-10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_2" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="25" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q0" x="-15.922" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="630 A" x="-15.922" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_poles" data-key="poles" data-example="4P" x="-15.922" y="12" font-size="1.7" text-anchor="end" fill="#000000">{poles}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-15.922" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Sch. Electric" x="-15.922" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>