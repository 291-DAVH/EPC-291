<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -1.6 38 18.1" width="38mm" height="18.1mm" role="img" aria-label="Toma de corriente (base enchufe)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Toma de corriente (base enchufe)</title>
  <desc>Toma de corriente o base de enchufe según IEC 60617 S00842. Se usa en circuitos de usos varios y fuerza. | Origen: Dibujo propio según IEC 60617 S00842.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_socket_outlet" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-2.5 7.5 C-2.5 6.12 -1.38 5 0 5 C1.38 5 2.5 6.12 2.5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-4.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">XS</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-XS1" x="-4.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rating" data-key="rating" data-example="16 A / 230 V" x="-4.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rating}</text>
    <text id="slot_ip_rating" data-key="ip_rating" data-example="IP44" x="-4.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{ip_rating}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-4.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
