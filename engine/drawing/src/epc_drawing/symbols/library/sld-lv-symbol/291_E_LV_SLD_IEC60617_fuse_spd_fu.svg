<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.647 -1.6 36.647 48.2" width="36.647mm" height="48.2mm" role="img" aria-label="Fusible + descargador de sobretensión (FU+SPD)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible + descargador de sobretensión (FU+SPD)</title>
  <desc>Dispositivo de protección contra sobretensiones transitorias con fusibles. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_spd_fu" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-2.647" y1="32.338" x2="2.632" y2="25.676" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-1.603" y="22.691" width="3.176" height="12.721" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-1.265" y="5.794" width="2.5" height="7.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="3.294" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="4.544" x2="0" y2="14.544" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="15.794" x2="0" y2="22.691" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="35.412" x2="0" y2="40" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.647" y1="32.338" x2="-2.647" y2="33.662" stroke="#0000ff" stroke-width="0.25" />
    <line x1="2.647" y1="24.279" x2="2.647" y2="25.676" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.265" y1="3.27" x2="1.235" y2="3.27" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.265" y1="15.819" x2="1.235" y2="15.819" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-4.647" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">FU+SPD</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="40" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-4.647" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-4.647" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="10 kA" x="-4.647" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-4.647" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>