<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-39.73 -1.6 49.73 31.62" width="49.73mm" height="31.62mm" role="img" aria-label="Arrancador directo (DOL)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Arrancador directo (DOL)</title>
  <desc>Arrancador directo DOL: contactor + relé térmico integrados. Se usa para arrancar motores hasta ~15 kW directamente a tensión de red. | Origen: Dibujo propio según IEC 60617 (símbolo propio industria).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_motor_starter_dol" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-8" y="2.5" width="16" height="15" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="4" x2="0" y2="6" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="6" x2="1.5" y2="6" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10.5" x2="-3" y2="7" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-1.5 9 Q-0.8 7.7 0 9" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-8" y1="10.75" x2="8" y2="10.75" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-4.4 12.25 L-1.6 12.25 L1.6 15.25 L4.4 15.25" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="17.5" x2="0" y2="20" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-10" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">DOL</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="20" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-10" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_motor_kw" data-key="motor_kw" data-example="7.5 kW" x="-10" y="9" font-size="1.7" text-anchor="end" fill="#000000">{motor_kw}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="16 A" x="-10" y="12" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_setting" data-key="setting" data-example="13-16 A" x="-10" y="15" font-size="1.7" text-anchor="end" fill="#000000">{setting}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-10" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
