<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32.5 -1.6 43 30.52" width="43mm" height="30.52mm" role="img" aria-label="Módulo fotovoltaico (panel solar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Módulo fotovoltaico (panel solar)</title>
  <desc>Módulo fotovoltaico o panel solar. Convención de la industria. Se usa en instalaciones de generación solar fotovoltaica. | Origen: Convención de la industria fotovoltaica (IEC 62446).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_pv_module" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-0.071" y1="0" x2="-0.071" y2="2.404" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-6.5" y="2.404" width="12.857" height="7.692" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.214" y1="2.404" x2="-2.214" y2="10.096" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="2.071" y1="2.404" x2="2.071" y2="10.096" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-6.5" y1="6.25" x2="6.357" y2="6.25" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="8.5" y1="1.442" x2="3.143" y2="4.327" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M 2.071 2.885 L 3.143 4.327 L 4.75 3.846" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-0.071" y1="10.096" x2="-0.071" y2="12.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-8.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">PV</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="-0.071" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="-0.071" cy="12.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-PV1" x="-8.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_power_wp" data-key="power_wp" data-example="400 Wp" x="-8.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{power_wp}</text>
    <text id="slot_voc" data-key="voc" data-example="48 V" x="-8.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voc}</text>
    <text id="slot_isc" data-key="isc" data-example="10 A" x="-8.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{isc}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-8.5" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
