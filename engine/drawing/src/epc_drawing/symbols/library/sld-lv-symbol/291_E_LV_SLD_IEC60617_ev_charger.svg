<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34.75 -1.6 45.5 39.133" width="45.5mm" height="39.133mm" role="img" aria-label="Cargador vehículo eléctrico (EVSE)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cargador vehículo eléctrico (EVSE)</title>
  <desc>Punto de carga para vehículo eléctrico según IEC 60364-7-722 / IEC 62196. Dispositivo terminal; sin puerto de salida. | Origen: Dibujo propio según IEC 60364-7-722 / IEC 62196.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ev_charger" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.889" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-8.75" y="3.889" width="17.5" height="13.611" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.479" y1="9.421" x2="-2.479" y2="12.892" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="2.479" y1="9.421" x2="2.479" y2="12.892" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2.479" y1="12.892" x2="2.479" y2="12.892" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M -2.479 9.421 C -2.479 8.051 -1.369 6.942 0 6.942 C 1.369 6.942 2.479 8.051 2.479 9.421" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-0.992" y1="12.892" x2="-0.992" y2="14.379" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0.992" y1="12.892" x2="0.992" y2="14.379" stroke="#0000ff" stroke-width="0.25"/>
    <text x="0" y="16.31" font-size="1.7" fill="#0000ff" text-anchor="middle" font-weight="bold">EV</text>
    <line x1="0" y1="3.889" x2="0" y2="6.942" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  <text font-family="Arial, sans-serif" x="-10.75" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">EV</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_in" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-EV1" x="-10.75" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_load" data-key="load" data-example="Cargador EV" x="-10.75" y="9" font-size="1.7" text-anchor="end" fill="#000000">{load}</text>
    <text id="slot_power" data-key="power" data-example="22 kW" x="-10.75" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V 3F" x="-10.75" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-10.75" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
