<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.5 -4.83 42.712 26.43" width="42.712mm" height="26.43mm" role="img" aria-label="Contactor de potencia 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Contactor de potencia 2P (multifilar)</title>
  <desc>Contactor de potencia de 2 polo(s): el símbolo lv_contactor repetido en cada polo, con enlace mecánico discontinuo común (IEC 60617 S00295). | Origen: Réplica por polo de SLD_LV/lv_contactor (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_contactor_2p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.5" y1="4.5" x2="0" y2="10" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <path d="M 0 2.5 C -0.69 2.5 -1.25 3.06 -1.25 3.75 C -1.25 4.44 -0.69 5 0 5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="7.5" y1="4.5" x2="10" y2="10" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="10" x2="10" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <path d="M 10 2.5 C 9.31 2.5 8.75 3.06 8.75 3.75 C 8.75 4.44 9.31 5 10 5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.14" y1="7.5" x2="8.86" y2="7.5" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
  </g>
  
  <text font-family="Arial, sans-serif" x="-4.5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">KM</text>
  
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="15" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="10" cy="15" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-4.5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-4.5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-4.5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-4.5" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>