<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.412 -4.62 55.992 28.73" width="55.992mm" height="28.73mm" role="img" aria-label="Acoplamiento de barras 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Acoplamiento de barras 3P (multifilar)</title>
  <desc>Seccionador de acoplamiento de barras de 3 polos en formato multifilar. Une dos secciones de bus (BB1 y BB2). | Origen: Dibujo propio.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_busbar_coupler_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="3.922" x2="1.961" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.745" x2="-4.412" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.745" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L1</text>
    <line x1="10" y1="0" x2="10" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="8.039" y1="3.922" x2="11.961" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="12.745" x2="5.588" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="12.745" x2="10" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L2</text>
    <line x1="20" y1="0" x2="20" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="18.039" y1="3.922" x2="21.961" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="20" y1="12.745" x2="15.588" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="20" y1="12.745" x2="20" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="21.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L3</text>
    <line x1="-1.93" y1="9.314" x2="18.07" y2="9.314" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    
    <text x="1" y="3.122" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
    <text x="1" y="16.5" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
    <text x="11" y="3.122" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
    <text x="11" y="16.5" font-size="1.7" fill="#0000ff" text-anchor="start">4</text>
    <text x="21" y="3.122" font-size="1.7" fill="#0000ff" text-anchor="start">5</text>
    <text x="21" y="16.5" font-size="1.7" fill="#0000ff" text-anchor="start">6</text>
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-6.412" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BUS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L1" cx="0" cy="17.5" r="0.6" data-dir="down"/>
    <circle id="port_top_L2" cx="10" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L2" cx="10" cy="17.5" r="0.6" data-dir="down"/>
    <circle id="port_top_L3" cx="20" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bot_L3" cx="20" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q7" x="-6.412" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-6.412" y="9" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-6.412" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-6.412" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
