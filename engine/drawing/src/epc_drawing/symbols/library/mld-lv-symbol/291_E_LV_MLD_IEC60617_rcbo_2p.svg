<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.87 -4.83 76.37 43.93" width="76.37mm" height="43.93mm" role="img" aria-label="Interruptor termomagnético diferencial RCBO 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor termomagnético diferencial RCBO 2P (multifilar)</title>
  <desc>RCBO de 2 polo(s): el símbolo lv_rcbo repetido en cada polo, con un único toroide que abarca todos los polos y un solo relé IΔ en el último polo, cuyo enlace discontinuo llega hasta el primer polo (todos abren y cierran juntos, S00295). Solo existe en 1P, 2P y 4P. | Origen: Dibujo propio según IEC 60617 S00287 / S00295 / S00327. Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
