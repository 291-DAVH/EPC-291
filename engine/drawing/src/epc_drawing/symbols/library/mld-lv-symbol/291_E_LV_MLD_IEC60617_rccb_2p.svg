<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-43.54 -4.83 68.04 43.93" width="68.04mm" height="43.93mm" role="img" aria-label="Interruptor diferencial (RCCB) 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor diferencial (RCCB) 2P (multifilar)</title>
  <desc>Interruptor diferencial (RCCB) de 2 polo(s): el símbolo lv_rccb repetido en cada polo, con un único toroide y un solo relé IΔ en el último polo, cuyo enlace discontinuo llega hasta el primer polo (todos abren y cierran juntos, IEC 60617 S00295). | Origen: Réplica por polo de SLD_LV/lv_rccb (Lámina 3 (108-2026-SOXXXXXX-E-DU-003)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_rccb_2p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="10.191" x2="0" y2="32.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0.039" y1="10.25" x2="-2.873" y2="5.015" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="5.662" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L</text>
    <line x1="10" y1="10.191" x2="10" y2="32.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10.039" y1="10.25" x2="7.127" y2="5.015" stroke="#0000ff" stroke-width="0.25" />
    <rect x="15.701" y="5.662" width="2.029" height="4.529" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="17.73" y1="7.936" x2="19.995" y2="7.936" stroke="#0000ff" stroke-width="0.25" />
    <line x1="20" y1="6.794" x2="20" y2="9.059" stroke="#0000ff" stroke-width="0.25" />
    <line x1="15.441" y1="4.529" x2="15.441" y2="5.662" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10" y1="0" x2="10" y2="5.662" stroke="#0000ff" stroke-width="0.25" />
    <text x="16.365" y="8.538" font-size="1.7" fill="#0000ff" text-anchor="middle">Δ</text>
    <text x="14.566" y="8.538" font-size="1.7" fill="#0000ff" text-anchor="middle">I</text>
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">N</text>
    <path d="M 14.554 14.721 C 14.554 15.348 8.935 15.853 3.769 15.853 C 1.103 15.853 -4.505 15.348 -4.505 14.721 C -4.505 14.093 1.103 13.588 3.769 13.588 C 8.935 13.588 14.554 14.093 14.554 14.721 Z" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.108" y1="7.936" x2="15.701" y2="7.936" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    
  <line x1="15.441" y1="11.324" x2="15.441" y2="14.721" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
<line x1="14.554" y1="14.701" x2="15.466" y2="14.701" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <g id="terminal_marks" font-family="Arial, sans-serif">
<text x="1" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
<text x="1" y="31.5" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
<text x="11" y="3.2" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
<text x="11" y="31.5" font-size="1.7" fill="#0000ff" text-anchor="start">4</text></g></g>
  
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-6.505" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">RCCB</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="10" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="32.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="10" cy="32.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="TAG-01" x="-6.505" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="25A" x="-6.505" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_sensitivity" data-key="sensitivity" data-example="30mA" x="-6.505" y="12" font-size="1.7" text-anchor="end" fill="#000000">{sensitivity}</text>
    <text id="slot_poles" data-key="poles" data-example="3P" x="-6.505" y="15" font-size="1.7" text-anchor="end" fill="#000000">{poles}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-6.505" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>