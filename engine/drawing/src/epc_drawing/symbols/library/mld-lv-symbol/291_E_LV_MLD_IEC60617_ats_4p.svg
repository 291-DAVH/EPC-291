<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36.73 -12.12 75.05 45.23" width="75.05mm" height="45.23mm" role="img" aria-label="Transferencia automática (ATS) 4P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transferencia automática (ATS) 4P (multifilar)</title>
  <desc>Interruptor de transferencia automática de 4 polos en formato multifilar (L1,L2,L3,N). | Origen: Dibujo propio.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ats_4p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">S1-L1</text>
    <line x1="10" y1="0" x2="10" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">S1-L2</text>
    <line x1="20" y1="0" x2="20" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="21.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">S1-L3</text>
    <line x1="30" y1="0" x2="30" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="31.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">S1-N</text>
    <line x1="0" y1="-7.5" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="1.225" y="-8.725" font-size="1.7" fill="#0000ff" text-anchor="start">S2-L1</text>
    <line x1="10" y1="-7.5" x2="10" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="11.225" y="-8.725" font-size="1.7" fill="#0000ff" text-anchor="start">S2-L2</text>
    <line x1="20" y1="-7.5" x2="20" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="21.225" y="-8.725" font-size="1.7" fill="#0000ff" text-anchor="start">S2-L3</text>
    <line x1="30" y1="-7.5" x2="30" y2="4.902" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1"/>
    <text x="31.225" y="-8.725" font-size="1.7" fill="#0000ff" text-anchor="start">S2-N</text>
    <rect x="-5" y="4.902" width="40" height="17.098" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    
    <line x1="0" y1="22" x2="0" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="22" x2="10" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="20" y1="22" x2="20" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="30" y1="22" x2="30" y2="26.5" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1" y="-3.3" font-size="1.7" fill="#0000ff" text-anchor="start">1</text>
    <text x="1" y="25" font-size="1.7" fill="#0000ff" text-anchor="start">5</text>
    <text x="11" y="-3.3" font-size="1.7" fill="#0000ff" text-anchor="start">2</text>
    <text x="11" y="25" font-size="1.7" fill="#0000ff" text-anchor="start">6</text>
    <text x="21" y="-3.3" font-size="1.7" fill="#0000ff" text-anchor="start">3</text>
    <text x="21" y="25" font-size="1.7" fill="#0000ff" text-anchor="start">7</text>
    <text x="31" y="-3.3" font-size="1.7" fill="#0000ff" text-anchor="start">4</text>
    <text x="31" y="25" font-size="1.7" fill="#0000ff" text-anchor="start">8</text>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="-1.5" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">ATS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_S1_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S1_L2" cx="10" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S1_L3" cx="20" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S1_N" cx="30" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L1" cx="0" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L2" cx="10" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_L3" cx="20" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_top_S2_N" cx="30" cy="-7.5" r="0.6" data-dir="up"/>
    <circle id="port_bot_L1" cx="0" cy="26.5" r="0.6" data-dir="down"/>
    <circle id="port_bot_L2" cx="10" cy="26.5" r="0.6" data-dir="down"/>
    <circle id="port_bot_L3" cx="20" cy="26.5" r="0.6" data-dir="down"/>
    <circle id="port_bot_N" cx="30" cy="26.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q0" x="-7" y="-5.3" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="630 A" x="-7" y="1.5" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7" y="4.5" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_poles" data-key="poles" data-example="3P" x="-7" y="7.5" font-size="1.7" text-anchor="end" fill="#000000">{poles}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="10.5" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
