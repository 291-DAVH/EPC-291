[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-drawing"
version = "0.1.0"
description = "EPC-291 board design: calculation + single-line + multi-line in one go, and the exports (PDF, stamped DXF)"
requires-python = ">=3.10"
dependencies = ["epc-calc", "epc-sld", "epc-mld", "epc-titleblock", "openpyxl>=3.1", "ezdxf", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
