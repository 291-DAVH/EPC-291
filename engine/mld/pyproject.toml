[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-mld"
version = "0.1.0"
description = "EPC-291 multi-line diagram generator: each line of the single-line expanded into its conductors"
requires-python = ">=3.10"
dependencies = ["epc-calc", "epc-sld", "epc-symbols", "lxml", "ezdxf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_mld = ["data/**/*", "templates/*"]
