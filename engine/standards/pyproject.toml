[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-standards"
version = "0.1.0"
description = "EPC-291 standards pipeline: text extraction, validation (schema, verbatim-copy guard) and promotion of rules.json"
requires-python = ">=3.10"
dependencies = ["pypdf", "jsonschema", "pypdfium2"]

[project.optional-dependencies]
render = ["pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_standards = ["data/*.json"]
