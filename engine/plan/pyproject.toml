[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-plan"
version = "0.1.0"
description = "EPC-291 plan-drawing engine: nodes and lines over a plan, graph, tags, circuit routes, schedules, DXF"
requires-python = ">=3.10"
dependencies = ["ezdxf", "epc-dxf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_plan = ["params.json", "symbols.json", "profiles/*.json", "knowledge/*.json", "schema/*.json", "symbols/*.svg"]
