[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-calc"
version = "1.7.0"
description = "EPC-291 calculation engine: LV sizing (AEA 90364 / IEC 60364), voltage drop, short circuit, protection, earthing"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_calc = ["*.json", "rules/*.json", "templates/*.md"]
