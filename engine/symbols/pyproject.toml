[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-symbols"
version = "0.1.0"
description = "EPC-291 IEC 60617 symbol library (SVG and DXF blocks, catalogs) for single-line and multi-line diagrams"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_symbols = ["library/**/*"]
