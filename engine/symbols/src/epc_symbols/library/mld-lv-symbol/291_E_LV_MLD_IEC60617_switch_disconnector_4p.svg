<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.5 -4.83 62.099 26.43" width="62.099mm" height="26.43mm" role="img" aria-label="Seccionador (corte visible) 4P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Seccionador (corte visible) 4P (multifilar)</title>
  <desc>Seccionador (corte visible) de 4 polo(s): el símbolo lv_switch_disconnector repetido en cada polo, con enlace mecánico discontinuo común (IEC 60617 S00295). | Origen: Réplica por polo de SLD_LV/lv_switch_disconnector (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
