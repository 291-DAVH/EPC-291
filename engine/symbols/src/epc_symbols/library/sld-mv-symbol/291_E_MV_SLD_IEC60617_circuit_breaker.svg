<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32.863 -1.6 40.863 30.7" width="40.863mm" height="30.7mm" role="img" aria-label="Interruptor automático MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor automático MT</title>
  <desc>Cuchilla con marca x de contacto de ruptura. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_circuit_breaker" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="5.833" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.961" y1="3.873" x2="1.961" y2="7.794" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.961" y1="7.794" x2="1.961" y2="3.873" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="18.578" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="18.578" x2="-6.863" y2="7.794" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-8.863" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">CB</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-8.863" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-8.863" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="10 kA" x="-8.863" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-8.863" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>