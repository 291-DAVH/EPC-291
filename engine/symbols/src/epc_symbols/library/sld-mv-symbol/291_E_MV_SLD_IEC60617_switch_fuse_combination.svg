<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-42.03 -1.6 50.03 43.2" width="50.03mm" height="43.2mm" role="img" aria-label="Interruptor-seccionador con fusibles combinados (percutor)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor-seccionador con fusibles combinados (percutor)</title>
  <desc>Interruptor-seccionador MT (como mv_load_break_switch) con fusible de percutor en serie; el percutor dispara el interruptor por enlace mecánico (IEC 60617 S00364 / S00367). | Origen: Dibujo propio según IEC 60617 S00290 / S00364 / S00367.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_switch_fuse_combination" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.608" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.961" y1="4.608" x2="1.961" y2="4.608" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="17.353" x2="-5.882" y2="6.569" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-3.922 11.225 C-4.51 9.51 -2.549 8.725 -1.765 10" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="17.353" x2="0" y2="21.275" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-1.716" y="21.275" width="3.431" height="10.784" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="32.059" x2="0" y2="35" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.716" y1="26.667" x2="-7.843" y2="26.667" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <line x1="-7.843" y1="26.667" x2="-7.843" y2="11.961" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <line x1="-7.843" y1="11.961" x2="-2.941" y2="11.961" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-9.843" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">LBS+F</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="35" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-9.843" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="630 A" x="-9.843" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_fuse_rating" data-key="fuse_rating" data-example="40 A" x="-9.843" y="12" font-size="1.7" text-anchor="end" fill="#000000">{fuse_rating}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-9.843" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-9.843" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>