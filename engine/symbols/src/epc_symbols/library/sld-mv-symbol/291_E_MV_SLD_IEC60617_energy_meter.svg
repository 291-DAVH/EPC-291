<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-41.27 -1.6 49.27 31.429" width="49.27mm" height="31.429mm" role="img" aria-label="Medidor de energía (kWh) MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Medidor de energía (kWh) MT</title>
  <desc>Contador de energía activa según IEC 60617 S00933: rectángulo con franja superior y rótulo kWh. | Origen: Dibujo propio según IEC 60617 S00933.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_energy_meter" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.857" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-5" y="2.857" width="10" height="12.143" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-5" y1="5.896" x2="5" y2="5.896" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="11.06" font-size="1.7" fill="#0000ff" text-anchor="middle">kWh</text>
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">kWh</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-P1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_model" data-key="model" data-example="ION8650" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{model}</text>
    <text id="slot_accuracy_class" data-key="accuracy_class" data-example="Cl. 0.5S" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{accuracy_class}</text>
    <text id="slot_ct_ratio" data-key="ct_ratio" data-example="50/5 A" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{ct_ratio}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>