<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-47.304 -1.6 55.304 20.7" width="55.304mm" height="20.7mm" role="img" aria-label="Conmutador de 3 vías (SW)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Conmutador de 3 vías (SW)</title>
  <desc>Conmutador de tres vías usado como selector de alimentación (TGBT 1 / TGBT 2). | Origen: Lámina 3 (108-2026-SOXXXXXX-E-DU-003). Recorte del plano de servicios auxiliares; la geometría exacta del contacto es la del original.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_switch_3way" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
