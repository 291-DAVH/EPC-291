    <path d="M-3.73 1.632 L0 9.162 L0 12.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-21.304 7.485 L-19.627 7.485 L-19.627 4.132 L-17.951 4.132" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-17.113 5.809 L-15.863 5.809 L-15.025 7.059 L-14.186 5.809 L-12.51 5.809" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-13.775 3.294 L-11.26 8.324 L-10.701 7.191" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="2.471" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-19.627" y1="5.784" x2="-18.377" y2="5.784" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-10.01" y1="5.784" x2="-7.495" y2="5.784" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-5.819" y1="5.784" x2="-3.73" y2="5.784" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-2.069" y1="5.784" x2="-1.48" y2="5.784" stroke="#0000ff" stroke-width="0.25" />
    
  <line x1="-11.275" y1="3.294" x2="-11.275" y2="8.324" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" /></g>
  
  <text font-family="Arial, sans-serif" x="-23.304" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SW</text>
  
  
  
  
