<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28.451 -1.6 36.451 20.7" width="36.451mm" height="20.7mm" role="img" aria-label="Relé térmico de sobrecarga" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Relé térmico de sobrecarga</title>
  <desc>Rectángulo con elemento bimetálico en serie con el conductor. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_thermal_overload" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-2.451" y="2.941" width="4.902" height="7.843" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-1.716 8.824 L-1.716 6.863 L1.716 6.863 L1.716 4.902" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.784" x2="0" y2="12.5" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  <text font-family="Arial, sans-serif" x="-4.451" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">OL</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="12.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-4.451" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-4.451" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_setting" data-key="setting" data-example="0,8 In" x="-4.451" y="12" font-size="1.7" text-anchor="end" fill="#000000">{setting}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-4.451" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>