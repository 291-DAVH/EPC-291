<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.82 -1.6 49.82 31.92" width="49.82mm" height="31.92mm" role="img" aria-label="Sistema de almacenamiento en baterías (BESS)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sistema de almacenamiento en baterías (BESS)</title>
  <desc>Sistema de almacenamiento de energía en baterías con inversor bidireccional. Se usa en instalaciones fotovoltaicas, gestión de carga y respaldo de energía. | Origen: Convención de la industria (IEC 62933).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_battery_storage" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-9" y="2.5" width="18" height="18" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-4.5" y1="4.5" x2="4.5" y2="4.5" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="-2.7" y1="5.5" x2="2.7" y2="5.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-4.5" y1="7" x2="4.5" y2="7" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="-2.7" y1="8" x2="2.7" y2="8" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-4.5" y1="9.5" x2="4.5" y2="9.5" stroke="#0000ff" stroke-width="0.5"/>
    <line x1="-2.7" y1="10.5" x2="2.7" y2="10.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-9" y1="12.4" x2="9" y2="12.4" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2" y1="14.9" x2="2" y2="14.9" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-2" y1="16.2" x2="2" y2="16.2" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-1 15.9 L0 14.6 L1 15.9" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="14.6" x2="0" y2="22.2" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-1 20.9 L0 22.2 L1 20.9" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="20.5" x2="0" y2="23" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-11" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">BESS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="23" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-GB1" x="-11" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_power_kw" data-key="power_kw" data-example="100 kW" x="-11" y="9" font-size="1.7" text-anchor="end" fill="#000000">{power_kw}</text>
    <text id="slot_capacity_kwh" data-key="capacity_kwh" data-example="200 kWh" x="-11" y="12" font-size="1.7" text-anchor="end" fill="#000000">{capacity_kwh}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V AC" x="-11" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-11" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
