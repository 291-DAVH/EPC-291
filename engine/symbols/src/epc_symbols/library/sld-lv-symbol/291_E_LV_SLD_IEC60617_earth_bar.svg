<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.5 0.9 58.91 18.7" width="58.91mm" height="18.7mm" role="img" aria-label="Barra de tierra (barra PE)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Barra de tierra (barra PE)</title>
  <desc>Barra colectora de protección a tierra (PE) según IEC 60617. Punto de conexión centralizado de los conductores de protección. | Origen: Dibujo propio según IEC 60617. Barra horizontal PE con bornes de conexión. Puertos 'top_*' son las entradas de conductores PE.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_earth_bar" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-12.5" y1="7.5" x2="12.5" y2="7.5" stroke="#139b48" stroke-width="0.5"/>
    <line x1="-7.5" y1="2.5" x2="-7.5" y2="7.5" stroke="#139b48" stroke-width="0.25"/>
    <line x1="0" y1="2.5" x2="0" y2="7.5" stroke="#139b48" stroke-width="0.25"/>
    <line x1="7.5" y1="2.5" x2="7.5" y2="7.5" stroke="#139b48" stroke-width="0.25"/>
    <line x1="0" y1="7.5" x2="0" y2="10" stroke="#139b48" stroke-width="0.25"/>
    <line x1="-4" y1="10" x2="4" y2="10" stroke="#139b48" stroke-width="0.25"/>
    <line x1="-3" y1="11.5" x2="3" y2="11.5" stroke="#139b48" stroke-width="0.25"/>
    <line x1="-2" y1="13" x2="2" y2="13" stroke="#139b48" stroke-width="0.25"/>
    <text x="14.5" y="8.3" font-size="1.7" fill="#0000ff" text-anchor="start" font-weight="bold">PE</text>
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-14.5" y="8.5" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">PE BAR</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_1" cx="-7.5" cy="2.5" r="0.6" data-dir="up"/>
    <circle id="port_top_2" cx="0" cy="2.5" r="0.6" data-dir="up"/>
    <circle id="port_top_3" cx="7.5" cy="2.5" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-PE" x="-14.5" y="4.7" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-14.5" y="11.5" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-14.5" y="14.5" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
