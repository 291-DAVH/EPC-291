<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58.77 -4.5 66.77 33.6" width="66.77mm" height="33.6mm" role="img" aria-label="Descargador de sobretensión (SPD) con varistor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Descargador de sobretensión (SPD) con varistor</title>
  <desc>Caja con símbolo de varistor; se conecta a tierra por su extremo inferior. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_spd_varistor" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-2.074" y="3.446" width="4.147" height="16.618" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-3.426 17.784 L-3.426 16.034 L3.441 7.358 L3.441 5.52" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="3.446" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="20.064" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-5.426" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">SPD</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="TAG-01" x="-5.426" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_class" data-key="class" data-example="Type II" x="-5.426" y="9" font-size="1.7" text-anchor="end" fill="#000000">{class}</text>
    <text id="slot_impulse_current" data-key="impulse_current" data-example="65 kA" x="-5.426" y="12" font-size="1.7" text-anchor="end" fill="#000000">{impulse_current}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-5.426" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5.426" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>