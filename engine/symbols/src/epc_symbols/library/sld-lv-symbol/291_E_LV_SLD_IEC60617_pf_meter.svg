<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-33.368 -1.6 41.956 27.305" width="41.956mm" height="27.305mm" role="img" aria-label="Medidor de factor de potencia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Medidor de factor de potencia</title>
  <desc>Instrumento indicador (IEC 60617 S00910) con símbolo cos φ. Mide factor de potencia. | Origen: Dibujo propio según IEC 60617 S00910.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_pf_meter" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25" />
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="6.612" font-size="1.7" fill="#0000ff" text-anchor="middle">cos</text>
    <text x="0" y="9.612" font-size="1.7" fill="#0000ff" text-anchor="middle">φ</text>
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">cosφ</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-P1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_scale_range" data-key="scale_range" data-example="0.5 ind–0.5 cap" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{scale_range}</text>
    <text id="slot_accuracy_class" data-key="accuracy_class" data-example="Cl 0.5" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{accuracy_class}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
