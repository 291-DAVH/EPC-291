<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 39 32.87" width="39mm" height="32.87mm" role="img" aria-label="Rectificador (AC/DC)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rectificador (AC/DC)</title>
  <desc>Convertidor AC/DC (rectificador de puente). Según IEC 60617 S00449. Se usa como fuente de alimentación DC para baterías y controles. | Origen: Dibujo propio según IEC 60617 S00449.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_rectifier" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-5" y="2.5" width="10" height="12.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <text x="0" y="6.237" font-size="1.7" fill="#0000ff" text-anchor="middle">~</text>
    <line x1="-5" y1="8.75" x2="5" y2="8.75" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.8" y1="10.625" x2="1.8" y2="10.625" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.8" y1="12.25" x2="1.8" y2="12.25" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M-1.5 9 L1.5 9 L0 11 Z" fill="#0000ff" stroke="#0000ff" stroke-width="0.18"/>
    <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">RECT</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-UF1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_ac_input" data-key="ac_input" data-example="400 V AC" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{ac_input}</text>
    <text id="slot_dc_output" data-key="dc_output" data-example="48 V DC" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{dc_output}</text>
    <text id="slot_power" data-key="power" data-example="5 kW" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
