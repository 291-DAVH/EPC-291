<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.028 -1.6 43.616 27.095" width="43.616mm" height="27.095mm" role="img" aria-label="Amperímetro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Amperímetro</title>
  <desc>Instrumento indicador (IEC 60617 S00910) con letra A. Se conecta al secundario de un TI. | Origen: Dibujo propio según IEC 60617 S00910 / S01426.</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ammeter" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25" />
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <text x="0" y="8.112" font-size="1.7" fill="#0000ff" text-anchor="middle">A</text>
  </g>
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">A</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-P2" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_scale_range" data-key="scale_range" data-example="0–800 A" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{scale_range}</text>
    <text id="slot_ct_ratio" data-key="ct_ratio" data-example="800/5 A" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{ct_ratio}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>