<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-63.76 -4.5 71.76 28.6" width="71.76mm" height="28.6mm" role="img" aria-label="Fusible seccionable NH00" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible seccionable NH00</title>
  <desc>Fusible NH con barras de conexión (columna de protección de TGBT). | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_disconnector_nh00" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <rect x="-1.632" y="7.451" width="3.265" height="10.217" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="0" x2="0" y2="4.045" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="5.748" x2="0" y2="19.37" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="21.073" x2="0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="4.04" x2="1.632" y2="4.04" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.632" y1="21.068" x2="1.632" y2="21.068" stroke="#0000ff" stroke-width="0.25" />
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-3.632" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">NH00</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="TAG-01" x="-3.632" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="50 A" x="-3.632" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="100 kA" x="-3.632" y="12" font-size="1.7" text-anchor="end" fill="#000000">{breaking_capacity}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-3.632" y="15" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Sch. Electric" x="-3.632" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>