<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29 -1.6 37 23.2" width="37mm" height="23.2mm" role="img" aria-label="Enlace de neutro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Enlace de neutro</title>
  <desc>Puente de neutro desconectable según IEC 60617. Permite aislar el neutro para mediciones de aislamiento. | Origen: Dibujo propio según IEC 60617.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_neutral_link" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="3.922" x2="1.5" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="10" x2="-3" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-5" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">N</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="15" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-N1" x="-5" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_rated_current" data-key="rated_current" data-example="63 A" x="-5" y="9" font-size="1.7" text-anchor="end" fill="#000000">{rated_current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-5" y="12" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
