[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-lighting"
version = "0.1.0"
description = "EPC-291 lighting engine: luminaire count, layout and point illuminance for interior rooms and exterior areas"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_lighting = ["params.json", "data/*.json", "schema/*.json", "rules/*.json", "standards/*.json"]
