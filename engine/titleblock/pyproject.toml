[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epc-titleblock"
version = "0.1.0"
description = "EPC-291 IRAM A0-A4 sheets with the IRAM 4504/4508 title block, custom company/client blocks and logos"
requires-python = ">=3.10"
dependencies = ["epc-dxf", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epc_titleblock = ["templates/**/*", "assets/*"]
