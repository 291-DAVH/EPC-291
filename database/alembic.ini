[alembic]
script_location = %(here)s/migrations
# The URL comes from EPC_DATABASE_URL (see migrations/env.py); this value is only the fallback.
sqlalchemy.url = sqlite:///../local/epc-dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
