<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-41.686 -4.62 59.766 38.73" width="59.766mm" height="38.73mm" role="img" aria-label="Celda compacta RMU (Ring Main Unit) MT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Celda compacta RMU (Ring Main Unit) MT</title>
  <desc>Celda compacta de media tensión tipo RMU de 3 vías: dos entradas de anillo con seccionadores y un feeder con interruptor automático. IEC 62271-200. | Origen: Dibujo propio según IEC 62271-200 / IEC 60947 (celda compacta MT).</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_ring_main_unit" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <text x="-13.725" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="end">R1</text>
    <text x="13.725" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">R2</text>
    <line x1="-12.5" y1="0" x2="-12.5" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="12.5" y1="0" x2="12.5" y2="3.922" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-15.686" y="3.922" width="31.372" height="17.647" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-12.5" y1="9.804" x2="12.5" y2="9.804" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-4.902" y1="3.922" x2="-4.902" y2="9.804" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="1.5 1"/>
    <line x1="4.902" y1="3.922" x2="4.902" y2="9.804" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="1.5 1"/>
    <line x1="-13.725" y1="5.922" x2="-11.275" y2="5.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-12.5" y1="9.804" x2="-11.275" y2="5.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="11.275" y1="5.922" x2="13.725" y2="5.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="12.5" y1="9.804" x2="11.275" y2="5.922" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="9.804" x2="0" y2="21.569" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="13.725" x2="1.961" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="1.961" y1="13.725" x2="-1.961" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="13.725" x2="1.961" y2="13.725" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.961" y1="17.647" x2="1.961" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="21.569" x2="0" y2="27.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-17.686" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">RMU</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_ring_in" cx="-12.5" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_ring_out" cx="12.5" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_feeder_out" cx="0" cy="27.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="RMU-01" x="-17.686" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="20 kV" x="-17.686" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_current" data-key="current" data-example="630 A" x="-17.686" y="12" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-17.686" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
