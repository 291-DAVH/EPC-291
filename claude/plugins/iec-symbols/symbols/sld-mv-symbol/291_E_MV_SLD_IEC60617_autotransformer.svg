<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 40.5 34.71" width="40.5mm" height="34.71mm" role="img" aria-label="Autotransformador MV" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Autotransformador MV</title>
  <desc>Autotransformador de un solo devanado con derivación según IEC 60617 S00328. Se usa para arranque de motores y regulación de tensión MV. | Origen: Dibujo propio según IEC 60617 S00328.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_autotransformer" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M5 7.5 C5 10.261 2.761 12.5 0 12.5 C-2.761 12.5 -5 10.261 -5 7.5 C-5 4.739 -2.761 2.5 0 2.5 C2.761 2.5 5 4.739 5 7.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M0.8 3.7 C0.8 4.142 0.442 4.5 0 4.5 C-0.442 4.5 -0.8 4.142 -0.8 3.7 C-0.8 3.258 -0.442 2.9 0 2.9 C0.442 2.9 0.8 3.258 0.8 3.7" fill="#0000ff" stroke="#0000ff" stroke-width="0.18"/>
    <line x1="5" y1="7.5" x2="7.5" y2="7.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="12.5" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">AT</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_tap" cx="7.5" cy="7.5" r="0.6" data-dir="right"/>
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="15" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-T1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_ratio" data-key="ratio" data-example="20 kV / 0–20 kV" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{ratio}</text>
    <text id="slot_power" data-key="power" data-example="5 MVA" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{power}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
