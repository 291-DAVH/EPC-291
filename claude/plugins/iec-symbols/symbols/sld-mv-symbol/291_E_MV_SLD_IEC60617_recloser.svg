<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -1.6 39 32.87" width="39mm" height="32.87mm" role="img" aria-label="Reconectador automático" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Reconectador automático</title>
  <desc>Reconectador automático según IEC 60617 S00095. Interruptor automático con reconexión automática temporizada para faltas transitorias en redes de distribución aérea. | Origen: Dibujo propio según IEC 60617 S00095.</desc>
  <!-- Sistema de coordenadas: x=0 es el eje del conductor; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="mv_recloser" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.5" stroke="#0000ff" stroke-width="0.25"/>
    <rect x="-5" y="2.5" width="10" height="12.5" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="3.5" x2="0" y2="5.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="-1.5" y1="5.5" x2="1.5" y2="5.5" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="11" x2="-3" y2="6.3" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="11" x2="0" y2="14" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M2.75 6.95 C3.744 6.95 4.55 7.756 4.55 8.75 C4.55 9.744 3.744 10.55 2.75 10.55 C1.756 10.55 0.95 9.744 0.95 8.75" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <path d="M1.75 5.95 L2.75 6.95 L3.75 5.95" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="0" y1="15" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos; mostrar para ver donde engancha el conductor) -->
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">AR</text>
  
  
  
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_bottom" cx="0" cy="17.5" r="0.6" data-dir="down"/>
  </g>
  <!-- Datos VARIABLES (verde): {clave}; ejemplo en data-example. -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_voltage" data-key="voltage" data-example="20 kV" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_current" data-key="current" data-example="400 A" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_shots" data-key="shots" data-example="3 re-shots" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{shots}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
