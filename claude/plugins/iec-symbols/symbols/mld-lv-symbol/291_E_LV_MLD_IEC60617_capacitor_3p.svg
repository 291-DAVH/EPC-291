<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-31 -4.62 58 38.87" width="58mm" height="38.87mm" role="img" aria-label="Banco de capacitores 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Banco de capacitores 3P (multifilar)</title>
  <desc>Banco de capacitores trifásico de 3 polos en formato multifilar. Dispositivo terminal (shunt). Caja con símbolo de condensador según IEC 60617. | Origen: Dibujo propio según IEC 60617 S00459.</desc>
  <!-- Sistema de coordenadas: x=0 es el primer polo; y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_capacitor_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="1.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L1</text>
    <line x1="10" y1="0" x2="10" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="11.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L2</text>
    <line x1="20" y1="0" x2="20" y2="4.902" stroke="#0000ff" stroke-width="0.25"/>
    <text x="21.225" y="-1.225" font-size="1.7" fill="#0000ff" text-anchor="start">L3</text>
    <rect x="-5" y="4.902" width="30" height="12.745" fill="none" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="4.902" x2="10" y2="9.804" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="6" y1="9.804" x2="14" y2="9.804" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="6" y1="12.255" x2="14" y2="12.255" stroke="#0000ff" stroke-width="0.25"/>
    <line x1="10" y1="12.255" x2="10" y2="17.647" stroke="#0000ff" stroke-width="0.25"/>
    
  </g>
  <!-- Puertos de conexion (ocultos) -->
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-7" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">CAP</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L2" cx="10" cy="0" r="0.6" data-dir="up"/>
    <circle id="port_top_L3" cx="20" cy="0" r="0.6" data-dir="up"/>
  </g>
  <!-- Datos VARIABLES (verde) -->
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-7" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_kvar" data-key="kvar" data-example="100 kVAr" x="-7" y="9" font-size="1.7" text-anchor="end" fill="#000000">{kvar}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-7" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-7" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>
