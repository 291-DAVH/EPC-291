  <desc>Descargador de sobretensión (SPD) con varistor de 4 polo(s): el símbolo lv_spd_varistor repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_spd_varistor (Lámina 2 (108-2026-SOXXXXXX-E-DU-002)). Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
