<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-37.25 -1.6 50.5 30.7" width="50.5mm" height="30.7mm" role="img" aria-label="UPS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>UPS</title>
  <desc>Caja con rótulo UPS, entrada y salida. | Origen: Dibujo propio (misma simbología de las láminas)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_ups" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-0" y1="0" x2="-0" y2="4.902" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-11.25" y="4.902" width="22.5" height="13.725" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-0" y1="18.627" x2="-0" y2="22.5" stroke="#0000ff" stroke-width="0.25" />
    
    
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-13.25" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">UPS</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top" cx="-0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom" cx="-0" cy="22.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-13.25" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_power_kva" data-key="power_kva" data-example="50 kVA" x="-13.25" y="9" font-size="1.7" text-anchor="end" fill="#000000">{power_kva}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-13.25" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-13.25" y="15" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>