<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27.25 -1 35.25 20.5" width="35.25mm" height="20.5mm" role="img" aria-label="Flecha de acometida (cable que ingresa)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Flecha de acometida (cable que ingresa)</title>
  <desc>Flecha roja hacia abajo: cable que ingresa al tablero. | Origen: Lámina 2 (108-2026-SOXXXXXX-E-DU-002)</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_cable_arrow_in" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <path d="M-1.25 1.559 L1.25 1.559 L0 5 ZZ" fill="#ff0000" stroke="#ff0000" stroke-width="0.18" />
    <line x1="0" y1="0" x2="0" y2="1.559" stroke="#ff0000" stroke-width="0.25" />
  </g>
  
  
  
  
  
  
  <text font-family="Arial, sans-serif" x="-3.25" y="6" font-size="1.7" font-weight="bold" text-anchor="end" fill="#0000ff">CABLE IN</text>
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-3.25" y="2.2" font-size="2.5" text-anchor="end" fill="#0000ff">{tag}</text>
    <text id="slot_cable_spec" data-key="cable_spec" data-example="3x2.5 mm2" x="-3.25" y="9" font-size="1.7" text-anchor="end" fill="#000000">{cable_spec}</text>
    <text id="slot_voltage" data-key="voltage" data-example="400 V" x="-3.25" y="12" font-size="1.7" text-anchor="end" fill="#000000">{voltage}</text>
    <text id="slot_current" data-key="current" data-example="100 A" x="-3.25" y="15" font-size="1.7" text-anchor="end" fill="#000000">{current}</text>
    <text id="slot_manufacturer" data-key="manufacturer" data-example="Fabricante" x="-3.25" y="18" font-size="1.7" text-anchor="end" fill="#000000">{manufacturer}</text>
  </g>
</svg>