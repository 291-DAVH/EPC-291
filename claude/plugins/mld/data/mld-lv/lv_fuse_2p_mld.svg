<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15.09 -4.83 31.99 21.43" width="31.99mm" height="21.43mm" role="img" aria-label="Fusible 2P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Fusible 2P (multifilar)</title>
  <desc>Fusible de 2 polo(s): el símbolo lv_fuse repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_fuse (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_fuse_2p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="-1.716" y="2.941" width="3.431" height="9.804" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="12.745" x2="0" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L</text>
    <line x1="12.5" y1="0" x2="12.5" y2="2.941" stroke="#0000ff" stroke-width="0.25" />
    <rect x="10.784" y="2.941" width="3.431" height="9.804" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="12.745" x2="12.5" y2="15" stroke="#0000ff" stroke-width="0.25" />
    <text x="13.725" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">N</text>
    <text x="-3.676" y="4.902" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">FUSE</text>
  
    <g id="terminal_marks" font-family="Arial, sans-serif"><text x="2.3" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">1</text><text x="2.3" y="14" font-size="2.5" fill="#000000" text-anchor="start">2</text><text x="14.8" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">3</text><text x="14.8" y="14" font-size="2.5" fill="#000000" text-anchor="start">4</text></g></g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_N" cx="12.5" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="15" r="0.6" data-dir="down" />
    <circle id="port_bottom_N" cx="12.5" cy="15" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-3.676" y="9.314" font-size="3.47" text-anchor="end">{tag}</text>
  </g>
</svg>