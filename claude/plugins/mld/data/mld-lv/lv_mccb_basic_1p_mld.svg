  <desc>MCCB de 1 polo(s): el símbolo lv_mccb_basic (contacto IEC 60617 S00287 + unidad LSIG I&gt;, I&gt;&gt;, I&gt;&gt;&gt;, tierra) repetido en cada polo, polos pegados, con mecanismo común y enlace mecánico discontinuo (S00295). | Origen: Dibujo propio según IEC 60617 S00287 / S00295. Paso entre polos 12.5 mm (polos pegados). x=0 es el primer polo (L).</desc>
  
