    <line x1="4.554" y1="14.701" x2="7.966" y2="14.701" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L</text>
