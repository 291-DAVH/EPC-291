    <path d="M-5.554 11.25 L-7.216 11.25 L-7.877 11.853 Z" fill="#0000ff" stroke="#0000ff" stroke-width="0.18" />
    <line x1="0" y1="0" x2="0" y2="5.441" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0.02" y1="10.103" x2="-2.892" y2="4.853" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.029" x2="0" y2="32.5" stroke="#0000ff" stroke-width="0.25" />
    <rect x="5.701" y="5.662" width="4.529" height="4.529" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <text x="6.466" y="9.088" font-size="3.529" fill="#0000ff" text-anchor="start">I</text>
