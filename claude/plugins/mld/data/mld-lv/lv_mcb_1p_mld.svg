<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.87 -4.83 56.18 38.93" width="56.18mm" height="38.93mm" role="img" aria-label="Interruptor termomagnético (MCB) 1P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Interruptor termomagnético (MCB) 1P (multifilar)</title>
  <desc>Interruptor termomagnético (MCB) de 1 polo(s): el símbolo lv_mcb repetido en cada polo. | Origen: Réplica por polo de SLD_LV/lv_mcb (Lámina 3 (108-2026-SOXXXXXX-E-DU-003)). Paso entre polos 12.5 mm. x=0 es el primer polo (L).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_mcb_1p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="-5.642" y1="6.265" x2="-4.525" y2="8.309" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.069" y1="8.132" x2="-5.833" y2="10.735" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.804" y1="6.824" x2="-4.525" y2="8.309" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0.02" y1="10.103" x2="-2.892" y2="4.853" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-8.613 10.544 L-6.569 9.426 L-7.686 7.382 L-5.642 6.265" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-7.877 11.853 L-6.113 10.221 L-5.554 11.25 L-7.877 11.853" fill="none" stroke="#0000ff" stroke-width="0.25" />
    <path d="M-6.113 10.221 L-5.554 11.25 L-7.216 11.25 Z" fill="#0000ff" stroke="#0000ff" stroke-width="0.18" />
    <path d="M-5.554 11.25 L-7.216 11.25 L-7.877 11.853 ZZ" fill="#0000ff" stroke="#0000ff" stroke-width="0.18" />
    <line x1="0" y1="0" x2="0" y2="5.441" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="10.029" x2="0" y2="32.5" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L</text>
    <text x="-11.319" y="3.632" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">MCB</text>
  
    <g id="terminal_marks" font-family="Arial, sans-serif"><text x="1" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">1</text><text x="1" y="31.5" font-size="2.5" fill="#000000" text-anchor="start">2</text></g></g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L" cx="0" cy="32.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_curve_rating" data-key="curve_rating" data-example="C32" x="-11.304" y="12.691" font-size="3.47" text-anchor="end">{curve_rating}</text>
    <text id="slot_breaking_capacity" data-key="breaking_capacity" data-example="6kA" x="-11.314" y="17.235" font-size="3.47" text-anchor="end">{breaking_capacity}</text>
  </g>
</svg>