<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17.78 -4.83 49.17 23.93" width="49.17mm" height="23.93mm" role="img" aria-label="Seccionador (corte visible) 3P (multifilar)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Seccionador (corte visible) 3P (multifilar)</title>
  <desc>Seccionador (corte visible) de 3 polo(s): el símbolo lv_switch_disconnector repetido en cada polo, con enlace mecánico discontinuo común (IEC 60617 S00295). | Origen: Réplica por polo de SLD_LV/lv_switch_disconnector (Dibujo propio (misma simbología de las láminas)). Paso entre polos 12.5 mm. x=0 es el primer polo (L1).</desc>
  
  <!-- Sistema de coordenadas: x=0 es el eje del conductor (o del primer polo); y=0 es el puerto superior. Unidad = 1 mm. Retícula de puertos 2,5 mm. Normas: IRAM 4502 / 4503, símbolos IEC 60617. -->
  <g id="lv_switch_disconnector_3p_mld" fill="none" stroke-linecap="butt" stroke-linejoin="round" font-family="Arial, sans-serif">
    <line x1="0" y1="0" x2="0" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="-1.961" y1="3.922" x2="1.961" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="12.745" x2="0" y2="17.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="0" y1="12.745" x2="-4.412" y2="4.902" stroke="#0000ff" stroke-width="0.25" />
    <text x="1.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L1</text>
    <line x1="12.5" y1="0" x2="12.5" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="10.539" y1="3.922" x2="14.461" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="12.745" x2="12.5" y2="17.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="12.5" y1="12.745" x2="8.088" y2="4.902" stroke="#0000ff" stroke-width="0.25" />
    <text x="13.725" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L2</text>
    <line x1="25" y1="0" x2="25" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="23.039" y1="3.922" x2="26.961" y2="3.922" stroke="#0000ff" stroke-width="0.25" />
    <line x1="25" y1="12.745" x2="25" y2="17.5" stroke="#0000ff" stroke-width="0.25" />
    <line x1="25" y1="12.745" x2="20.588" y2="4.902" stroke="#0000ff" stroke-width="0.25" />
    <text x="26.225" y="-1.225" font-size="3.47" fill="#000000" text-anchor="start">L3</text>
    <line x1="-2.206" y1="8.824" x2="22.889" y2="8.824" stroke="#0000ff" stroke-width="0.25" stroke-dasharray="3 1" />
    <text x="-6.373" y="5.392" font-size="3.47" font-weight="bold" text-anchor="end" fill="#000000">SW</text>
  
    <g id="terminal_marks" font-family="Arial, sans-serif"><text x="1" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">1</text><text x="1" y="16.5" font-size="2.5" fill="#000000" text-anchor="start">2</text><text x="13.5" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">3</text><text x="13.5" y="16.5" font-size="2.5" fill="#000000" text-anchor="start">4</text><text x="26" y="3.2" font-size="2.5" fill="#000000" text-anchor="start">5</text><text x="26" y="16.5" font-size="2.5" fill="#000000" text-anchor="start">6</text></g></g>
  
  <g id="ports" display="none" fill="#ff00ff" stroke="none">
    <circle id="port_top_L1" cx="0" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L2" cx="12.5" cy="0" r="0.6" data-dir="up" />
    <circle id="port_top_L3" cx="25" cy="0" r="0.6" data-dir="up" />
    <circle id="port_bottom_L1" cx="0" cy="17.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_L2" cx="12.5" cy="17.5" r="0.6" data-dir="down" />
    <circle id="port_bottom_L3" cx="25" cy="17.5" r="0.6" data-dir="down" />
  </g>
  
  <g id="label_slots" fill="#008800" font-family="Arial, sans-serif">
    <text id="slot_tag" data-key="tag" data-example="-Q1" x="-6.373" y="9.804" font-size="3.47" text-anchor="end">{tag}</text>
  </g>
</svg>